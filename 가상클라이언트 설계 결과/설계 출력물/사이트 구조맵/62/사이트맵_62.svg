<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad75" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1523"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow75" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="1350" fill="url(#bgGrad75)"/>

  <text x="600" y="55" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#FDA4AF" text-anchor="middle">SEUMIM Pilates 사이트 구조맵 (가상클라이언트 62: 필라테스재활원장)</text>
  <text x="600" y="85" font-family="'Pretendard', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">14개 전 화면 계층 구조 + 메인 15개 상품 쇼케이스 IA + 3대 핵심 전환 여정 통합 벡터 다이어그램</text>

  <!-- Root -->
  <g transform="translate(420, 130)" filter="url(#shadow75)">
    <rect width="360" height="80" rx="10" fill="#1E293B" stroke="#FDA4AF" stroke-width="2.5"/>
    <text x="180" y="32" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#FDA4AF" text-anchor="middle">P-0.0 메인 랜딩페이지 (SCR-01)</text>
    <text x="180" y="55" font-family="'Pretendard', sans-serif" font-size="11.5" fill="#E2E8F0" text-anchor="middle">★ 메인 15개 상품 대형 쇼케이스 (4대 카테고리 탭)</text>
    <text x="180" y="70" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">심리스핏 증명 / AI 바이오 케어 / 청담 아카데미</text>
  </g>

  <!-- Lines -->
  <path d="M 600 210 L 600 260 M 120 260 L 1080 260" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 120 260 L 120 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 310 260 L 310 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 500 260 L 500 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 690 260 L 690 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 880 260 L 880 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 1080 260 L 1080 300" stroke="#475569" stroke-width="2" fill="none"/>

