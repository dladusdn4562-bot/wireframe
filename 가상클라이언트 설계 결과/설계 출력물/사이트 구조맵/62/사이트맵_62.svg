    <text x="90" y="25" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">P-2.4 체형 사이즈 가이드</text>
    <text x="90" y="45" font-family="'Pretendard', sans-serif" font-size="10" fill="#B45309" text-anchor="middle">[모달] SCR-04</text>
