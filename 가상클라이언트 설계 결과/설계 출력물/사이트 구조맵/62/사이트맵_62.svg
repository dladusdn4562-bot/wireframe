    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-4.0 재활 아카데미</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#FDA4AF" text-anchor="middle">SCR-06</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">청담/한남 센터 지도</text>
