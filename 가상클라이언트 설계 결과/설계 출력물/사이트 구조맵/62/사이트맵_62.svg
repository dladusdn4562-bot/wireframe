    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-3.0 AI 바이오 케어</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#FDA4AF" text-anchor="middle">SCR-05</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">호흡/골반 대시보드</text>
