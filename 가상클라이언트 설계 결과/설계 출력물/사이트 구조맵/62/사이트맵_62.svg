    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#FDA4AF" text-anchor="middle">SCR-03</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">15개 상품 전체 갤러리</text>
