    <text x="570" y="40" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#FDA4AF" text-anchor="middle">★ 핵심 사용자 3대 전환 여정 (User Conversion Journeys)</text>
    
    <g transform="translate(30, 70)">
      <rect width="1080" height="170" rx="8" fill="#1E293B" stroke="#FDA4AF" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#FDA4AF">시나리오 A: 메인 15개 상품 탐색 ➔ 퀵뷰 ➔ 30일 무료 시착 신청 (Happy Path 1)</text>
      <text x="20" y="60" font-family="'Pretendard', sans-serif" font-size="12" fill="#CBD5E1">SCR-01 메인 ➔ 15개 상품 탭 필터링 ➔ 퀵뷰 모달 ➔ 여성 치수 선택 ➔ SCR-10 30일 시착 신청 ➔ 접수 완료</text>
    </g>

    <g transform="translate(30, 260)">
      <rect width="1080" height="170" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#34D399">시나리오 B: 청담/한남 아카데미 1:1 체형 스캔 4단계 예약 (Happy Path 2)</text>
      <text x="20" y="60" font-family="'Pretendard', sans-serif" font-size="12" fill="#CBD5E1">SCR-01 ➔ SCR-06 청담 아카데미 선택 ➔ SCR-07 4단계 예약 ➔ SCR-08 예약 확정 안내</text>
    </g>

    <g transform="translate(30, 450)">
      <rect width="1080" height="170" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#A5B4FC">시나리오 C: AI 바이오 호흡 케어 3개월 무료 구독 (Happy Path 3)</text>
      <text x="20" y="60" font-family="'Pretendard', sans-serif" font-size="12" fill="#CBD5E1">SCR-01 ➔ SCR-05 호흡/골반 대시보드 시연 ➔ SCR-11 간편 로그인 ➔ SCR-12 구독 활성화</text>
