<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="1200" height="1350">
  <defs>
    <style>
      .bg { fill: #fbf9f5; }
      .header-title { font-family: 'Noto Serif KR', 'Pretendard', sans-serif; font-size: 28px; font-weight: 800; fill: #1c2420; }
      .header-desc { font-family: 'Pretendard', sans-serif; font-size: 14px; fill: #4a5750; }
      
      .tree-card { fill: #ffffff; stroke: #e2dbca; stroke-width: 1.5; rx: 12; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.03)); }
      .tree-card-root { fill: #243028; rx: 12; }
      .root-text { font-family: 'Pretendard', sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      
      .page-col-header { fill: #f5f1e8; stroke: #cfc5af; stroke-width: 1.5; rx: 8; }
      .col-title { font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 800; fill: #243028; text-anchor: middle; }
      
      .node-card { fill: #ffffff; stroke: #ded4c0; stroke-width: 1.2; rx: 6; }
      .node-card-active { fill: #fef8f0; stroke: #d26e2e; stroke-width: 1.5; rx: 6; }
      .node-text-title { font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 800; fill: #1c2420; }
      .node-text-desc { font-family: 'Pretendard', sans-serif; font-size: 10px; fill: #7c8a82; }
      
      .badge-tag { fill: #243028; rx: 3; }
      .badge-tag-accent { fill: #d26e2e; rx: 3; }
      .badge-text { font-family: 'Pretendard', sans-serif; font-size: 9.5px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      
      .line-link { stroke: #cfc5af; stroke-width: 1.8; fill: none; }
      .line-link-accent { stroke: #d26e2e; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
