<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="1200" height="1350" style="background:#f8f9fa; font-family:'Pretendard', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c21" />
      <stop offset="100%" stop-color="#234a38" />
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382b" />
      <stop offset="100%" stop-color="#2d5a43" />
    </linearGradient>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f5f2" />
    </linearGradient>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9f5" />
      <stop offset="100%" stop-color="#fceee6" />
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97736" />
      <stop offset="100%" stop-color="#b8581b" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .title-main { font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .title-sub { font-size: 14px; font-weight: 500; fill: #a8d5be; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b382b; }
    .story-node-title { font-size: 15px; font-weight: 800; fill: #9c4310; }
    .leaf-text { font-size: 12px; font-weight: 500; fill: #334e40; }
    .highlight-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .connector { stroke: #9ebdb0; stroke-width: 2; stroke-linecap: round; fill: none; }
    .connector-story { stroke: #e3a67d; stroke-width: 2; stroke-linecap: round; fill: none; }
  </style>

  <!-- HEADER -->
  <rect x="40" y="30" width="1120" height="100" rx="16" fill="url(#headerGrad)" filter="url(#cardShadow)" />
  <text x="70" y="72" class="title-main">SEUMIM 스밈 브랜드 소개 페이지 사이트 구조맵 (IA)</text>
  <text x="70" y="102" class="title-sub">바디럽(BODYLUV)형 4대 상품 라인별 독립 스토리텔링 &amp; 3D 인터랙티브 0원 시착 퍼널 모델 (가상클라이언트 91)</text>
  <rect x="990" y="55" width="140" height="34" rx="8" fill="#d97736" />
  <text x="1060" y="77" class="badge" text-anchor="middle">Bodyluv Story V1.0</text>

  <!-- ROOT NODE -->
  <rect x="360" y="160" width="480" height="70" rx="14" fill="url(#rootGrad)" filter="url(#cardShadow)" />
  <text x="600" y="193" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">스밈(SEUMIM) 브랜드 소개 서브페이지 (Our Story)</text>
  <text x="600" y="215" font-size="12" font-weight="500" fill="#c3e4d4" text-anchor="middle">브랜드 안녕(安寧) 매니페스토 ➔ 4대 상품 라인별 독자적 탄생 서사 ➔ 28종 쇼케이스</text>

