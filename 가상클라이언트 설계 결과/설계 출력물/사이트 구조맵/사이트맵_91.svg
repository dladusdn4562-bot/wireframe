  <path d="M 600 230 L 600 260 L 375 260 L 375 300" class="connector" />
  <path d="M 600 230 L 600 300" class="connector" />
  <path d="M 600 230 L 600 260 L 825 260 L 825 300" class="connector" />
  <path d="M 600 230 L 600 260 L 1050 260 L 1050 300" class="connector" />

