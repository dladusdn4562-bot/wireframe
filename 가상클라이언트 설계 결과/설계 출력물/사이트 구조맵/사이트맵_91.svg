    <text x="15" y="165" font-size="12" font-weight="700" fill="#9c4310">③ 시각 에셋 (VIS-01)</text>
    <text x="15" y="185" font-size="11" fill="#444">🧵 나노 센서 섬유 450배 확대 스캔</text>

    <text x="15" y="215" font-size="12" font-weight="700" fill="#9c4310">④ 일상의 변화</text>
    <text x="15" y="235" font-size="11" fill="#444">99.8% 은폐율, 하루 종일 펴지는 어깨</text>

    <rect x="15" y="265" width="230" height="55" rx="8" fill="url(#ctaGrad)" />
