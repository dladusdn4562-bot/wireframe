    <text x="15" y="135" font-size="11" fill="#444">착석 체압 감지 반사 에어셀 메커니즘</text>

    <text x="15" y="165" font-size="12" font-weight="700" fill="#1b382b">③ 시각 에셋 (VIS-03)</text>
    <text x="15" y="185" font-size="11" fill="#444">💺 착석 체압 비대칭 감지 시뮬레이션</text>

    <text x="15" y="215" font-size="12" font-weight="700" fill="#1b382b">④ 일상의 변화</text>
    <text x="15" y="235" font-size="11" fill="#444">다리 꼬기 물리 차단, 요추 하중 65% 분산</text>

    <rect x="15" y="265" width="230" height="55" rx="8" fill="#1b382b" />
    <text x="25" y="288" class="highlight-text">대표작: 골반 에어셀 벨트</text>
    <text x="25" y="306" font-size="11" fill="#c3e4d4">3D 체압 분산도 ➔ [0원 무료 시착]</text>
  </g>

