  <text x="70" y="100" class="header-desc">바디럽(BODYLUV)형 일상 공감 서사 &amp; 0.1mm 원천 기술 증명 ➔ 4대 솔루션 라인업 ➔ 3대 대표작 3D 복귀 퍼널</text>

