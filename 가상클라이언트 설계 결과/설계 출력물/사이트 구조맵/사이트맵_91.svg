    <text x="15" y="235" font-size="11" fill="#444">실시간 진동 알림 &amp; 직업별 맞춤 지지</text>

    <rect x="15" y="265" width="230" height="55" rx="8" fill="#1b382b" />
    <text x="25" y="288" class="highlight-text">대표작: 스마트 센서 &amp; ACC 7종</text>
    <text x="25" y="306" font-size="11" fill="#c3e4d4">HUD 모니터링 ➔ [0원 무료 시착]</text>
