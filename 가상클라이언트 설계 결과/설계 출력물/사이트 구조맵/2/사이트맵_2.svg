  <text x="1020" y="1138" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">순공 조끼 30일 시착 신청</text>
  <text x="70" y="1200" font-size="11" fill="#64748b">시나리오: 스터디 타이머 인터랙션 체험 ➔ 자세 점수와 집중력 상관관계 확인 ➔ 10초 스트레칭 루틴 확인 ➔ 30일 시착 신청 및 대시보드 연동</text>

