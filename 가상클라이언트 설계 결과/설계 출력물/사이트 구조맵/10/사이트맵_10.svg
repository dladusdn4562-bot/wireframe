    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">3.1 원장님 실착 포토 (P-3.1)</text>
  </g>
  <g transform="translate(500, 450)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
