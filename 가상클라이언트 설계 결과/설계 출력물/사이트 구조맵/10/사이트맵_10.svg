  </g>
  <g transform="translate(500, 500)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">3.3 스튜디오 B2B (P-3.3)</text>
  </g>

  <!-- 4.0 Children -->
  <g transform="translate(720, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">4.1 스튜디오 무료실착 (P-4.1)</text>
  </g>
  <g transform="translate(720, 450)">
    <rect width="200" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="100" y="25" fill="#166534" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">4.2 강사 신청 [모달]</text>
