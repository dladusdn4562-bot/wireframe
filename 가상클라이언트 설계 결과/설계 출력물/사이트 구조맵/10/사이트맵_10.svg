    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.1 10초 흉추 이완 (P-5.1)</text>
  </g>
  <g transform="translate(940, 450)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.2 손목 건초염 예방 (P-5.2)</text>
  </g>
  <g transform="translate(940, 500)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.3 B2B 제휴 FAQ (P-5.3)</text>
  </g>

  <!-- Conversion Journeys Sub-Diagram -->
  <g transform="translate(60, 620)">
    <rect width="1080" height="670" rx="16" fill="#FFFFFF" stroke="#3F6212" stroke-width="2" filter="url(#shadow)"/>
    <rect width="1080" height="50" rx="16" fill="#3F6212"/>
    <text x="540" y="32" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">📍 핵심 사용자 3대 전환 여정 (Key User Conversion Journeys)</text>

    <!-- Journey 1 -->
    <g transform="translate(40, 80)">
      <rect width="1000" height="160" rx="12" fill="#F7FEE7" stroke="#84CC16" stroke-width="1.5"/>
      <text x="30" y="36" fill="#3F6212" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 1] 강사 자격증 인증 30일 스튜디오 무료체험 여정 (메인 전환)</text>
      <text x="30" y="66" fill="#4D7C0F" font-family="'Pretendard', sans-serif" font-size="13">타깃: 요가/필라테스 원장 및 강사 | 유입: 인스타그램 강사 커뮤니티</text>
      <g transform="translate(30, 90)">
        <rect width="160" height="45" rx="8" fill="#3F6212"/><text x="80" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">0.0 메인 랜딩</text>
        <text x="175" y="28" fill="#84CC16" font-size="16">➔</text>
        <rect x="195" width="160" height="45" rx="8" fill="#65A30D"/><text x="275" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">1.0 흉추 모빌리티</text>
        <text x="370" y="28" fill="#84CC16" font-size="16">➔</text>
        <rect x="390" width="160" height="45" rx="8" fill="#65A30D"/><text x="470" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">2.0 회전각 28%</text>
        <text x="565" y="28" fill="#84CC16" font-size="16">➔</text>
        <rect x="585" width="180" height="45" rx="8" fill="#16A34A"/><text x="675" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">4.2 강사 인증 모달</text>
        <text x="780" y="28" fill="#84CC16" font-size="16">➔</text>
        <rect x="800" width="140" height="45" rx="8" fill="#15803D"/><text x="870" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">4.3 스튜디오 수령</text>
      </g>
    </g>

    <!-- Journey 2 -->
    <g transform="translate(40, 270)">
      <rect width="1000" height="160" rx="12" fill="#FEFCE8" stroke="#EAB308" stroke-width="1.5"/>
      <text x="30" y="36" fill="#854D0E" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 2] 탑웨어 사이즈 매칭 및 30일 무료 반품 구매 여정 (일반 웰니스)</text>
      <text x="30" y="66" fill="#A16207" font-family="'Pretendard', sans-serif" font-size="13">타깃: 홈트/체형 교정 관심 여성 | 유입: 브라탑/자세 교정 검색</text>
      <g transform="translate(30, 90)">
        <rect width="180" height="45" rx="8" fill="#854D0E"/><text x="90" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">3.0 인스트럭터 후기</text>
        <text x="195" y="28" fill="#CA8A04" font-size="16">➔</text>
        <rect x="215" width="180" height="45" rx="8" fill="#CA8A04"/><text x="305" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">1.3 사이즈 가이드</text>
        <text x="410" y="28" fill="#CA8A04" font-size="16">➔</text>
        <rect x="430" width="220" height="45" rx="8" fill="#EAB308"/><text x="540" y="28" fill="#000" font-size="12" font-weight="700" text-anchor="middle">30일 100% 무료 반품 보증</text>
        <text x="665" y="28" fill="#CA8A04" font-size="16">➔</text>
        <rect x="685" width="160" height="45" rx="8" fill="#65A30D"/><text x="765" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">무료 체험 신청 완료</text>
      </g>
    </g>

    <!-- Journey 3 -->
    <g transform="translate(40, 460)">
