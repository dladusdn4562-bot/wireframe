<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#ECFCCB"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F6212"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1350" fill="url(#bgGrad)"/>

  <!-- Title Header -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="90" rx="16" fill="#3F6212" filter="url(#shadow)"/>
    <text x="540" y="42" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" text-anchor="middle">SEUMIM 흉추 모빌리티 밴드탑 사이트 구조맵 (가상클라이언트 10: 송민경)</text>
    <text x="540" y="70" fill="#ECFCCB" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" text-anchor="middle">요가·필라테스 강사용 0.1mm 심리스 모빌리티 핏 &amp; 스튜디오 30일 무료 체험단 IA</text>
  </g>

  <!-- Root Node -->
  <g transform="translate(420, 180)">
    <rect width="360" height="70" rx="12" fill="url(#rootGrad)" stroke="#166534" stroke-width="2" filter="url(#shadow)"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" text-anchor="middle">0.0 보태니컬 메인 랜딩 (P-0.0)</text>
    <text x="180" y="54" fill="#DCFCE7" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">강사 직업병 공감 &amp; 30일 스튜디오 무료체험</text>
  </g>

  <!-- Level 1 Nodes -->
  <!-- 1.0 -->
  <g transform="translate(60, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">1.0 흉추 모빌리티 탑</text>
    <text x="100" y="48" fill="#ECFCCB" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-1.0) 0.1mm 심리스</text>
  </g>
  <!-- 2.0 -->
  <g transform="translate(280, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">2.0 가동성 확장 테크</text>
    <text x="100" y="48" fill="#ECFCCB" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-2.0) 회전각 28% 성적서</text>
  </g>
  <!-- 3.0 -->
  <g transform="translate(500, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">3.0 인스트럭터 후기</text>
    <text x="100" y="48" fill="#ECFCCB" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-3.0) 평점 4.96점 갤러리</text>
  </g>
  <!-- 4.0 -->
  <g transform="translate(720, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">4.0 강사 30일 무료체험</text>
    <text x="100" y="48" fill="#ECFCCB" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-4.0) 100% 무료 반품</text>
  </g>
  <!-- 5.0 -->
  <g transform="translate(940, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeGrad)" filter="url(#shadow)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">5.0 매트 10초 시퀀스</text>
    <text x="100" y="48" fill="#ECFCCB" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-5.0) 흉추/손목 스트레칭</text>
  </g>

  <!-- Tree Connectors -->
  <path d="M 600 250 L 600 280 M 160 280 L 1040 280 M 160 280 L 160 310 M 380 280 L 380 310 M 600 280 L 600 310 M 820 280 L 820 310 M 1040 280 L 1040 310" stroke="#3F6212" stroke-width="2" fill="none"/>

  <!-- Level 2 Children -->
  <!-- 1.0 Children -->
  <g transform="translate(60, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.1 심리스 일체형 탑 (P-1.1)</text>
  </g>
  <g transform="translate(60, 450)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.2 늑골 모아줌 3D (P-1.2)</text>
  </g>
  <g transform="translate(60, 500)">
    <rect width="200" height="40" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="100" y="25" fill="#166534" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1.3 사이즈 가이드 [모달]</text>
  </g>

  <!-- 2.0 Children -->
  <g transform="translate(280, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#65A30D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2.1 회전각 28% 시험 (P-2.1)</text>
  </g>
  <g transform="translate(280, 450)">
