    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2.3 KATRI 세탁 복원 (P-2.3)</text>
  </g>

  <!-- 3.0 Children -->
