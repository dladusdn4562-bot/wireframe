      <text x="30" y="36" fill="#14532D" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 3] 스튜디오 단체 제휴 및 매트 시퀀스 여정 (B2B 단체)</text>
      <text x="30" y="66" fill="#15803D" font-family="'Pretendard', sans-serif" font-size="13">타깃: 요가원/필라테스 센터 대표 | 유입: 협회 제휴 공지</text>
      <g transform="translate(30, 90)">
        <rect width="180" height="45" rx="8" fill="#14532D"/><text x="90" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">5.0 매트 10초 시퀀스</text>
        <text x="195" y="28" fill="#22C55E" font-size="16">➔</text>
        <rect x="215" width="200" height="45" rx="8" fill="#16A34A"/><text x="315" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">3.3 스튜디오 B2B 제휴</text>
        <text x="430" y="28" fill="#22C55E" font-size="16">➔</text>
        <rect x="450" width="240" height="45" rx="8" fill="#22C55E"/><text x="570" y="28" fill="#000" font-size="12" font-weight="700" text-anchor="middle">소속 강사용 25% 단체 신청</text>
        <text x="705" y="28" fill="#22C55E" font-size="16">➔</text>
