<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mainCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1350" fill="url(#bgGrad)"/>

  <!-- Title Section -->
  <text x="600" y="55" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#38BDF8" text-anchor="middle">SEUMIM Executive 사이트 구조맵 (가상클라이언트 60: 글로벌전략컨설턴트)</text>
  <text x="600" y="85" font-family="'Pretendard', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">14개 전 화면 계층 구조 + 메인 15개 상품 쇼케이스 IA + 3대 핵심 전환 여정 통합 벡터 다이어그램</text>

  <!-- Main Root Node -->
  <g transform="translate(420, 130)" filter="url(#shadow)">
    <rect width="360" height="80" rx="10" fill="url(#mainCardGrad)" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="180" y="32" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#38BDF8" text-anchor="middle">P-0.0 메인 랜딩페이지 (SCR-01)</text>
    <text x="180" y="55" font-family="'Pretendard', sans-serif" font-size="11.5" fill="#E2E8F0" text-anchor="middle">★ 메인 15개 상품 대형 쇼케이스 (4대 카테고리 탭)</text>
    <text x="180" y="70" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">수트핏 증명 / AI 시차 대시보드 / VIP 센터 연계</text>
  </g>

  <!-- Connecting Lines from Root -->
  <path d="M 600 210 L 600 260 M 120 260 L 1080 260" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 120 260 L 120 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 310 260 L 310 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 500 260 L 500 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 690 260 L 690 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 880 260 L 880 300" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 1080 260 L 1080 300" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Sub Nodes: Depth 2 -->
  <!-- 1.0 Brand -->
  <g transform="translate(30, 300)" filter="url(#shadow)">
    <rect width="180" height="75" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-1.0 브랜드 철학</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#38BDF8" text-anchor="middle">SCR-02</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">3대 원천기술 3D 뷰</text>
  </g>

  <!-- 2.0 Collection -->
  <g transform="translate(220, 300)" filter="url(#shadow)">
    <rect width="180" height="75" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-2.0 비즈니스 컬렉션</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#38BDF8" text-anchor="middle">SCR-03</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">15개 상품 전체 갤러리</text>
  </g>

  <!-- Line to P-2.4 -->
  <path d="M 310 375 L 310 415" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <g transform="translate(220, 415)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="90" y="25" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">P-2.4 맞춤 사이즈 가이드</text>
    <text x="90" y="45" font-family="'Pretendard', sans-serif" font-size="10" fill="#B45309" text-anchor="middle">[모달] SCR-04</text>
  </g>

  <!-- 3.0 AI Care -->
  <g transform="translate(410, 300)" filter="url(#shadow)">
    <rect width="180" height="75" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-3.0 AI 데이터 케어</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#38BDF8" text-anchor="middle">SCR-05</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">시차 릴렉스 대시보드</text>
  </g>

  <!-- 4.0 O2O Center -->
  <g transform="translate(600, 300)" filter="url(#shadow)">
    <rect width="180" height="75" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-4.0 VIP 동행센터</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#38BDF8" text-anchor="middle">SCR-06</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">테헤란/여의도 지점 지도</text>
  </g>

  <!-- Lines to P-4.2 & P-4.3 -->
  <path d="M 690 375 L 690 415" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <g transform="translate(600, 415)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="90" y="25" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">P-4.2 VIP 4단계 예약</text>
    <text x="90" y="45" font-family="'Pretendard', sans-serif" font-size="10" fill="#B45309" text-anchor="middle">[모달] SCR-07</text>
  </g>
  <path d="M 690 475 L 690 510" stroke="#64748B" stroke-width="1.5" fill="none"/>
  <g transform="translate(600, 510)" filter="url(#shadow)">
    <rect width="180" height="50" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="90" y="24" font-family="'Pretendard', sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-4.3 예약 완료 안내</text>
    <text x="90" y="40" font-family="'Pretendard', sans-serif" font-size="9.5" fill="#38BDF8" text-anchor="middle">SCR-08</text>
  </g>

  <!-- 5.0 Benefit & Trial -->
  <g transform="translate(790, 300)" filter="url(#shadow)">
    <rect width="180" height="75" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="90" y="28" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">P-5.0 혜택 & 체험</text>
    <text x="90" y="48" font-family="'Pretendard', sans-serif" font-size="10.5" fill="#38BDF8" text-anchor="middle">SCR-09</text>
    <text x="90" y="64" font-family="'Pretendard', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">실착후기 / FAQ / 반품</text>
  </g>

  <!-- Line to P-5.2 -->
  <path d="M 880 375 L 880 415" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <g transform="translate(790, 415)" filter="url(#shadow)">
    <rect width="180" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="90" y="25" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">P-5.2 30일 무료체험 신청</text>
    <text x="90" y="45" font-family="'Pretendard', sans-serif" font-size="10" fill="#B45309" text-anchor="middle">[모달] SCR-10</text>
  </g>

  <!-- 6.0 Member & System Exceptions -->
  <g transform="translate(990, 300)" filter="url(#shadow)">
    <rect width="180" height="75" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
    <text x="90" y="26" font-family="'Pretendard', sans-serif" font-size="12.5" font-weight="700" fill="#EEF2FF" text-anchor="middle">P-6.1 로그인 / 가입</text>
    <text x="90" y="44" font-family="'Pretendard', sans-serif" font-size="10" fill="#818CF8" text-anchor="middle">SCR-11</text>
    <text x="90" y="62" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" fill="#EEF2FF" text-anchor="middle">P-6.2 마이페이지 (SCR-12)</text>
  </g>

  <!-- Bottom Section: 3대 핵심 전환 여정 (User Conversion Journeys) -->
  <g transform="translate(30, 620)">
    <rect width="1140" height="680" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>
    <text x="570" y="40" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#38BDF8" text-anchor="middle">★ 핵심 사용자 3대 전환 여정 (User Conversion Journeys)</text>

    <!-- Journey 1 -->
    <g transform="translate(30, 70)">
      <rect width="1080" height="170" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#38BDF8">시나리오 A: 메인 15개 상품 탐색 ➔ 퀵뷰 ➔ 30일 무료 시착 신청 (Happy Path 1)</text>
      <text x="20" y="60" font-family="'Pretendard', sans-serif" font-size="12" fill="#CBD5E1">1. SCR-01 메인 진입 ➔ 2. 15개 상품 4대 탭 탐색 ➔ 3. 퀵뷰 모달 호출 ➔ 4. 사이즈(95/100) 선택 ➔ 5. SCR-10 30일 시착 신청 ➔ 6. 접수 완료</text>
      
      <!-- Flow Nodes -->
      <rect x="40" y="90" width="160" height="50" rx="6" fill="#0A192F" stroke="#38BDF8"/>
      <text x="120" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-01 메인 쇼케이스</text>
      <text x="220" y="120" font-size="14" fill="#38BDF8">→</text>
      <rect x="250" y="90" width="160" height="50" rx="6" fill="#0A192F" stroke="#38BDF8"/>
      <text x="330" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">15개 상품 탭 필터링</text>
      <text x="430" y="120" font-size="14" fill="#38BDF8">→</text>
      <rect x="460" y="90" width="160" height="50" rx="6" fill="#FFFBEB" stroke="#D97706"/>
      <text x="540" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#92400E" text-anchor="middle">퀵뷰 모달 / 사이즈 가이드</text>
      <text x="640" y="120" font-size="14" fill="#38BDF8">→</text>
      <rect x="670" y="90" width="160" height="50" rx="6" fill="#FFFBEB" stroke="#D97706"/>
      <text x="750" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#92400E" text-anchor="middle">SCR-10 30일 시착 신청</text>
      <text x="850" y="120" font-size="14" fill="#38BDF8">→</text>
      <rect x="880" y="90" width="160" height="50" rx="6" fill="#065F46" stroke="#10B981"/>
      <text x="960" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">사전 예약 완료</text>
    </g>

    <!-- Journey 2 -->
    <g transform="translate(30, 260)">
      <rect width="1080" height="170" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#34D399">시나리오 B: 오프라인 VIP 동행센터 1회 무료 체험 4단계 예약 (Happy Path 2)</text>
      <text x="20" y="60" font-family="'Pretendard', sans-serif" font-size="12" fill="#CBD5E1">1. SCR-01 메인 O2O 배너 ➔ 2. SCR-06 테헤란로 센터 선택 ➔ 3. SCR-07 4단계 Wizard 예약 ➔ 4. SCR-08 예약 완료 및 알림톡</text>
      
      <!-- Flow Nodes -->
      <rect x="40" y="90" width="180" height="50" rx="6" fill="#0A192F" stroke="#10B981"/>
      <text x="130" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-01 O2O 센터 바로가기</text>
      <text x="240" y="120" font-size="14" fill="#10B981">→</text>
      <rect x="270" y="90" width="180" height="50" rx="6" fill="#0A192F" stroke="#10B981"/>
      <text x="360" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-06 지점 검색 / 센터 선택</text>
      <text x="470" y="120" font-size="14" fill="#10B981">→</text>
      <rect x="500" y="90" width="200" height="50" rx="6" fill="#FFFBEB" stroke="#D97706"/>
      <text x="600" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#92400E" text-anchor="middle">SCR-07 4단계 Wizard 폼 작성</text>
      <text x="720" y="120" font-size="14" fill="#10B981">→</text>
      <rect x="750" y="90" width="200" height="50" rx="6" fill="#065F46" stroke="#10B981"/>
      <text x="850" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-08 VIP 예약 확정 안내</text>
    </g>

    <!-- Journey 3 -->
    <g transform="translate(30, 450)">
      <rect width="1080" height="170" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#A5B4FC">시나리오 C: AI 시차 릴렉스 케어 3개월 무료 구독 시작 (Happy Path 3)</text>
      <text x="20" y="60" font-family="'Pretendard', sans-serif" font-size="12" fill="#CBD5E1">1. SCR-01 AI 케어 ➔ 2. SCR-05 대시보드 시연 ➔ 3. 3개월 무료 구독 클릭 ➔ 4. SCR-11 간편 로그인 ➔ 5. SCR-12 마이페이지 구독 활성화</text>
      
      <!-- Flow Nodes -->
      <rect x="40" y="90" width="180" height="50" rx="6" fill="#0A192F" stroke="#818CF8"/>
      <text x="130" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-01 AI 릴렉스 케어</text>
      <text x="240" y="120" font-size="14" fill="#818CF8">→</text>
      <rect x="270" y="90" width="180" height="50" rx="6" fill="#0A192F" stroke="#818CF8"/>
      <text x="360" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-05 다크모드 대시보드</text>
      <text x="470" y="120" font-size="14" fill="#818CF8">→</text>
      <rect x="500" y="90" width="200" height="50" rx="6" fill="#1E1B4B" stroke="#818CF8"/>
      <text x="600" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#EEF2FF" text-anchor="middle">SCR-11 1-Click 간편 로그인</text>
      <text x="720" y="120" font-size="14" fill="#818CF8">→</text>
      <rect x="750" y="90" width="200" height="50" rx="6" fill="#065F46" stroke="#10B981"/>
      <text x="850" y="120" font-family="'Pretendard', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">SCR-12 구독 개시 & 리포트</text>
    </g>
  </g>
</svg>
