    <rect width="1080" height="670" rx="16" fill="#FFFFFF" stroke="#14532D" stroke-width="2" filter="url(#shadowGolf)"/>
    <rect width="1080" height="50" rx="16" fill="#14532D"/>
    <text x="540" y="32" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">📍 핵심 사용자 3대 전환 여정 (Key User Conversion Journeys)</text>

    <!-- Journey 1 -->
