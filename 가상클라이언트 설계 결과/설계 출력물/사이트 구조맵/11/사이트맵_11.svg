      <text x="30" y="36" fill="#14532D" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 1] 080 무료 전화 30일 필드 무료 체험 여정 (메인 전환)</text>
      <text x="30" y="66" fill="#15803D" font-family="'Pretendard', sans-serif" font-size="13">타깃: 6070 파크골프 매니아 | 유입: 필드 포스터 및 지인 추천</text>
      <g transform="translate(30, 90)">
        <rect width="160" height="45" rx="8" fill="#14532D"/><text x="80" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">0.0 메인 랜딩</text>
        <text x="175" y="28" fill="#22C55E" font-size="16">➔</text>
        <rect x="195" width="160" height="45" rx="8" fill="#15803D"/><text x="275" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">1.0 파크골프 서포터</text>
        <text x="370" y="28" fill="#22C55E" font-size="16">➔</text>
        <rect x="390" width="160" height="45" rx="8" fill="#15803D"/><text x="470" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">2.0 무릎 충격 45%</text>
        <text x="565" y="28" fill="#22C55E" font-size="16">➔</text>
        <rect x="585" width="180" height="45" rx="8" fill="#D97706"/><text x="675" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">4.2 080 전화 모달</text>
        <text x="780" y="28" fill="#22C55E" font-size="16">➔</text>
        <rect x="800" width="140" height="45" rx="8" fill="#052E16"/><text x="870" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">4.3 댁으로 수령</text>
      </g>
    </g>

    <!-- Journey 2 -->
