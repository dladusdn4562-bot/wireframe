        <text x="195" y="28" fill="#CA8A04" font-size="16">➔</text>
        <rect x="215" width="180" height="45" rx="8" fill="#CA8A04"/><text x="305" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">1.3 허리둘레 매칭</text>
        <text x="410" y="28" fill="#CA8A04" font-size="16">➔</text>
        <rect x="430" width="220" height="45" rx="8" fill="#EAB308"/><text x="540" y="28" fill="#000" font-size="12" font-weight="700" text-anchor="middle">30일 100% 무료 반품 보증</text>
        <text x="665" y="28" fill="#CA8A04" font-size="16">➔</text>
        <rect x="685" width="160" height="45" rx="8" fill="#15803D"/><text x="765" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">무료 시타 신청 완료</text>
