    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.1 시크릿 벨트 (P-1.1)</text>
  </g>
  <g transform="translate(60, 450)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.2 비틀림 방지 40% (P-1.2)</text>
  </g>
  <g transform="translate(60, 500)">
    <rect width="200" height="40" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="100" y="25" fill="#92400E" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1.3 허리둘레 가이드 [모달]</text>
  </g>

  <!-- 2.0 Children -->
  <g transform="translate(280, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2.1 무릎 충격 45% (P-2.1)</text>
