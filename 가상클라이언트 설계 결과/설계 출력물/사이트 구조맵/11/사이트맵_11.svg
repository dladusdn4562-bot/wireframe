        <text x="195" y="28" fill="#EF4444" font-size="16">➔</text>
        <rect x="215" width="200" height="45" rx="8" fill="#DC2626"/><text x="315" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">3.3 동호회 단체 20%</text>
        <text x="430" y="28" fill="#EF4444" font-size="16">➔</text>
        <rect x="450" width="240" height="45" rx="8" fill="#F87171"/><text x="570" y="28" fill="#000" font-size="12" font-weight="700" text-anchor="middle">동호회 10인 단체 신청</text>
