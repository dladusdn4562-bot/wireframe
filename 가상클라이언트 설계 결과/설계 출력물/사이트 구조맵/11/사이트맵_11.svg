  <!-- Tree Connectors -->
  <path d="M 600 250 L 600 280 M 160 280 L 1040 280 M 160 280 L 160 310 M 380 280 L 380 310 M 600 280 L 600 310 M 820 280 L 820 310 M 1040 280 L 1040 310" stroke="#14532D" stroke-width="2" fill="none"/>

  <!-- Level 2 Children -->
  <!-- 1.0 Children -->
  <g transform="translate(60, 400)">
