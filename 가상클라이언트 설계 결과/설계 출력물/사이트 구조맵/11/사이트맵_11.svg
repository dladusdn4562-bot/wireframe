      <text x="30" y="36" fill="#854D0E" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 2] 허리둘레 사이즈 매칭 및 30일 무료 반품 주문 여정 (모바일 주문)</text>
      <text x="30" y="66" fill="#A16207" font-family="'Pretendard', sans-serif" font-size="13">타깃: 스마트폰 능숙 시니어 | 유입: 시니어 골프 벨트 검색</text>
      <g transform="translate(30, 90)">
