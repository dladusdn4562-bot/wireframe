    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">2.0 척추-무릎 보호</text>
    <text x="100" y="48" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-2.0) 무릎 충격 45% 흡수</text>
  </g>
  <!-- 3.0 -->
