    <rect width="200" height="60" rx="10" fill="url(#nodeGolfGrad)" filter="url(#shadowGolf)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">5.0 티박스 스트레칭</text>
    <text x="100" y="48" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-5.0) 10초 관절 리셋</text>
