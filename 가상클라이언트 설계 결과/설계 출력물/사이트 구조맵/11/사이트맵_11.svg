<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="rootGolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="nodeGolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="shadowGolf" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1350" fill="url(#bgGolfGrad)"/>

  <!-- Title Header -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="90" rx="16" fill="#14532D" filter="url(#shadowGolf)"/>
    <text x="540" y="42" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" text-anchor="middle">SEUMIM 시니어 파크골프 서포터 사이트 구조맵 (가상클라이언트 11: 배준호)</text>
    <text x="540" y="70" fill="#BBF7D0" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" text-anchor="middle">3D 골반-요추 회전 벨트 &amp; 무릎 가드 &amp; 080 무료 전화 주문 IA</text>
  </g>

  <!-- Root Node -->
  <g transform="translate(420, 180)">
    <rect width="360" height="70" rx="12" fill="url(#rootGolfGrad)" stroke="#D97706" stroke-width="2" filter="url(#shadowGolf)"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" text-anchor="middle">0.0 큰 글씨 메인 랜딩 (P-0.0)</text>
    <text x="180" y="54" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">스윙 통계 &amp; 080 무료 전화 30일 체험</text>
  </g>

  <!-- Level 1 Nodes -->
  <!-- 1.0 -->
  <g transform="translate(60, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeGolfGrad)" filter="url(#shadowGolf)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">1.0 파크골프 서포터</text>
    <text x="100" y="48" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-1.0) 비거리 15m 증가</text>
  </g>
  <!-- 2.0 -->
  <g transform="translate(280, 310)">
