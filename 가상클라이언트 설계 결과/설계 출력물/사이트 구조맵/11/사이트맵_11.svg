    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">4.0 30일 필드 무료체험</text>
    <text x="100" y="48" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-4.0) 100% 무료 반품</text>
  </g>
  <!-- 5.0 -->
