  </g>
  <g transform="translate(940, 500)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.3 080 전화 FAQ (P-5.3)</text>
