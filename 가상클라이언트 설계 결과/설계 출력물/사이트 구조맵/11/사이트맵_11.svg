    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">4.1 30일 무료 시타 (P-4.1)</text>
  </g>
  <g transform="translate(720, 450)">
    <rect width="200" height="40" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="100" y="25" fill="#92400E" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">4.2 080 전화 주문 [모달]</text>
