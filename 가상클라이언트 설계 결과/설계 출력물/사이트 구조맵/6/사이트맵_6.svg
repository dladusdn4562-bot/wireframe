  <rect x="910" y="730" width="220" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" />
  <text x="1020" y="758" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">080 전화 / 카톡 간편 신청</text>
  <text x="70" y="820" font-size="11" fill="#9a3412">시나리오: 설거지 허리 통증 공감 ➔ 1-Touch 전면 벨크로 확인 ➔ 080 무료 전화 터치 또는 카톡 신청 ➔ 30일 무료 시착</text>

