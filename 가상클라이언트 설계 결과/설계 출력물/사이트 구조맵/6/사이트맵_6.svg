  <line x1="670" y1="943" x2="700" y2="943" stroke="#ea580c" stroke-width="2" />
  <rect x="700" y="920" width="180" height="46" rx="6" fill="#ea580c" />
  <text x="790" y="948" text-anchor="middle" fill="#ffffff" font-size="11">30일 100% 무료 반품 보증</text>

  <line x1="880" y1="943" x2="910" y2="943" stroke="#f59e0b" stroke-width="2" />
  <rect x="910" y="920" width="220" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" />
