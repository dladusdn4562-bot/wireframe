  <text x="70" y="708" font-size="13" font-weight="bold" fill="#9a3412">[여정 1] 080 무료 전화 &amp; 카톡 1-Click 30일 무료 체험 여정 (메인 전환)</text>
  
  <rect x="70" y="730" width="180" height="46" rx="6" fill="#9a3412" />
  <text x="160" y="758" text-anchor="middle" fill="#ffffff" font-size="11">맘카페/주부 광고 유입</text>

  <line x1="250" y1="753" x2="280" y2="753" stroke="#ea580c" stroke-width="2" />
