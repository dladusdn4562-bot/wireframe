  <text x="70" y="1010" font-size="11" fill="#9a3412">시나리오: 맘카페 포토 리뷰 확인 ➔ 상의 사이즈 선택 ➔ 세탁기 통세척 및 무료 반품 확인 ➔ 집으로 배송 신청</text>

