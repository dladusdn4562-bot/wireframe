  <text x="70" y="898" font-size="13" font-weight="bold" fill="#9a3412">[여정 2] 동년배 100인 후기 확인 &amp; 상의 사이즈 매칭 구매 여정 (신뢰 전환)</text>

  <rect x="70" y="920" width="180" height="46" rx="6" fill="#9a3412" />
