  <!-- [영역 2] ## 7. 핵심 사용자 전환 여정 (3대 시나리오 서브 다이어그램) -->
  <!-- ========================================================================= -->
  <rect x="50" y="620" width="1100" height="40" rx="6" fill="#9a3412" />
  <text x="600" y="646" text-anchor="middle" fill="#ffedd5" font-size="15" font-weight="bold">## 7. 핵심 사용자 전환 여정 (Key User Conversion Journeys - 3대 시나리오)</text>

  <!-- 여정 1: 080 무료 전화 & 카톡 30일 무료 체험 여정 -->
