  <text x="790" y="1138" text-anchor="middle" fill="#ffffff" font-size="11">고급 선물 포장 박스 증정</text>

  <line x1="880" y1="1133" x2="910" y2="1133" stroke="#f59e0b" stroke-width="2" />
  <rect x="910" y="1110" width="220" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" />
  <text x="1020" y="1138" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">부모님 댁 무료 배송 신청</text>
  <text x="70" y="1200" font-size="11" fill="#9a3412">시나리오: 부모님 후기 확인 ➔ 선물 포장 옵션 체크 ➔ 부모님 댁으로 30일 무료 체험 배송 접수 완료</text>

