<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F6212"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="flowShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1680" height="2220" fill="url(#bgFlowGrad)"/>

  <!-- Main Header -->
  <g transform="translate(80, 50)">
    <rect width="1520" height="100" rx="16" fill="url(#headerGrad)" filter="url(#flowShadow)"/>
    <text x="760" y="45" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" text-anchor="middle">SEUMIM 흉추 모빌리티 밴드탑 서비스 흐름도 (가상클라이언트 10: 송민경)</text>
    <text x="760" y="78" fill="#DCFCE7" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" text-anchor="middle">ST-01~14 전 단계 정의 &amp; 강사 자격증 인증 30일 스튜디오 무료체험 Happy Path &amp; B2B 제휴 분기</text>
  </g>

  <!-- Lane 1: Entry & Core Exploration (Y: 200 ~ 650) -->
  <g transform="translate(80, 190)">
    <rect width="1520" height="460" rx="16" fill="#FFFFFF" stroke="#3F6212" stroke-width="2" filter="url(#flowShadow)"/>
    <rect width="1520" height="40" rx="16" fill="#3F6212"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">1. 진입 및 흉추 모빌리티 탐색 영역 (Entry &amp; Tech Validation)</text>

    <!-- ST-01 -->
    <g transform="translate(40, 70)">
      <rect width="320" height="90" rx="12" fill="#3F6212" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-01 보태니컬 메인 랜딩</text>
      <text x="160" y="62" fill="#DCFCE7" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-0.0) 강사 직업병 공감</text>
    </g>

    <!-- ST-02 -->
    <g transform="translate(420, 70)">
      <rect width="320" height="90" rx="12" fill="#65A30D" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-02 1.0 흉추 모빌리티 탑</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-1.0) 0.1mm 심리스 일체형 핏</text>
    </g>

    <!-- ST-03 -->
    <g transform="translate(800, 70)">
      <rect width="320" height="90" rx="12" fill="#65A30D" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-03 2.0 가동성 확장 테크</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-2.0) 회전각 28% 성적서</text>
    </g>

    <!-- ST-06 -->
    <g transform="translate(1180, 70)">
      <rect width="300" height="90" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#flowShadow)"/>
      <text x="150" y="38" fill="#166534" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-06 1.3 사이즈 매칭 [모달]</text>
      <text x="150" y="62" fill="#15803D" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-1.3) 브라/탑 70A~85D</text>
    </g>

    <!-- Connectors -->
    <path d="M 360 115 L 420 115 M 740 115 L 800 115 M 740 115 L 740 220 L 1180 220 M 1120 115 L 1180 115" stroke="#3F6212" stroke-width="2" fill="none"/>
  </g>

  <!-- Lane 2: Verification & Review (Y: 690 ~ 1150) -->
  <g transform="translate(80, 690)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#3F6212" stroke-width="2" filter="url(#flowShadow)"/>
    <rect width="1520" height="40" rx="16" fill="#3F6212"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">2. 강사 검증 및 B2B 스튜디오 제휴 영역 (Review &amp; B2B Alliance)</text>

    <!-- ST-04 -->
    <g transform="translate(40, 70)">
      <rect width="320" height="90" rx="12" fill="#65A30D" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-04 3.0 인스트럭터 후기</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-3.0) 평점 4.96점 갤러리</text>
    </g>

    <!-- ST-10 -->
    <g transform="translate(420, 70)">
      <rect width="320" height="90" rx="12" fill="#16A34A" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-10 3.3 스튜디오 B2B 제휴</text>
      <text x="160" y="62" fill="#DCFCE7" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-3.3) 전국 스튜디오 25% 단체 할인</text>
    </g>

    <!-- ST-05 -->
    <g transform="translate(800, 70)">
      <rect width="320" height="90" rx="12" fill="#65A30D" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-05 5.0 매트 10초 시퀀스</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-5.0) 흉추 이완 &amp; 손목 케어</text>
    </g>

    <!-- ST-09 -->
    <g transform="translate(1180, 70)">
      <rect width="300" height="90" rx="12" fill="#65A30D" filter="url(#flowShadow)"/>
      <text x="150" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-09 4.0 강사 30일 체험 안내</text>
      <text x="150" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-4.0) 100% 무료 반품 보증</text>
    </g>
  </g>

  <!-- Lane 3: Conversion & Order Completion (Y: 1170 ~ 1630) -->
  <g transform="translate(80, 1170)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#3F6212" stroke-width="2" filter="url(#flowShadow)"/>
    <rect width="1520" height="40" rx="16" fill="#3F6212"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">3. 강사 1-Click 신청 및 주문 완료 영역 (Conversion &amp; Completion)</text>

    <!-- ST-07 -->
    <g transform="translate(420, 70)">
      <rect width="400" height="110" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3" filter="url(#flowShadow)"/>
      <text x="200" y="45" fill="#166534" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">ST-07 4.2 강사 1-Click 신청 [모달]</text>
      <text x="200" y="75" fill="#15803D" font-family="'Pretendard', sans-serif" font-size="13" text-anchor="middle">자격증 인증 + 스튜디오 주소 10초 간편 접수</text>
    </g>

    <!-- ST-08 -->
    <g transform="translate(900, 70)">
      <rect width="380" height="110" rx="14" fill="#15803D" filter="url(#flowShadow)"/>
      <text x="190" y="45" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">ST-08 4.3 주문 완료 및 배송 안내</text>
      <text x="190" y="75" fill="#DCFCE7" font-family="'Pretendard', sans-serif" font-size="13" text-anchor="middle">(P-4.3) 접수 번호 확인 &amp; 스튜디오 발송</text>
    </g>

    <!-- Connectors -->
    <path d="M 820 125 L 900 125" stroke="#166534" stroke-width="3" fill="none"/>
  </g>

  <!-- Lane 4: Member Service & System Exceptions (Y: 1650 ~ 2110) -->
  <g transform="translate(80, 1650)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#3F6212" stroke-width="2" filter="url(#flowShadow)"/>
    <rect width="1520" height="40" rx="16" fill="#3F6212"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">4. 회원 서비스 및 시스템 예외 처리 영역 (Member &amp; Exceptions)</text>

    <!-- ST-11 -->
    <g transform="translate(40, 70)">
      <rect width="320" height="90" rx="12" fill="#4D7C0F" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-11 6.1 강사 간편 로그인</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-6.1) 자격증/카카오 연동 세션</text>
    </g>

    <!-- ST-12 -->
    <g transform="translate(420, 70)">
      <rect width="320" height="90" rx="12" fill="#4D7C0F" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-12 6.2 마이페이지</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-6.2) 배송 조회 &amp; 무료 반품 신청</text>
    </g>

    <!-- ST-13 -->
    <g transform="translate(800, 70)">
      <rect width="320" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#flowShadow)"/>
      <text x="160" y="38" fill="#991B1B" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-13 9.1 404 Not Found</text>
      <text x="160" y="62" fill="#B91C1C" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-9.1) 감성적 에러 안내</text>
    </g>

    <!-- ST-14 -->
    <g transform="translate(1180, 70)">
      <rect width="300" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#flowShadow)"/>
      <text x="150" y="38" fill="#991B1B" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-14 9.2 시스템 점검 안내</text>
      <text x="150" y="62" fill="#B91C1C" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-9.2) 카톡 1:1 강사 상담 연동</text>
    </g>
  </g>
</svg>
