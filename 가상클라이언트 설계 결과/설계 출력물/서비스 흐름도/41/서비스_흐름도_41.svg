<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlowGrad_41" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="headerFlowGrad_41" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="flowShadow_41" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1680" height="2220" fill="url(#bgFlowGrad_41)"/>

  <g transform="translate(80, 50)">
    <rect width="1520" height="100" rx="16" fill="url(#headerFlowGrad_41)" filter="url(#flowShadow_41)"/>
    <text x="760" y="45" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" text-anchor="middle">SEUMIM 패션모델 전용 서포터 서비스 흐름도 (가상클라이언트 41: 진수아)</text>
    <text x="760" y="78" fill="#FFE4E6" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" text-anchor="middle">ST-01~14 전 단계 정의 &amp; 1-Click 30일 무료체험 Happy Path &amp; 단체 제휴 분기</text>
  </g>

  <!-- Lane 1 -->
  <g transform="translate(80, 190)">
    <rect width="1520" height="460" rx="16" fill="#FFFFFF" stroke="#9F1239" stroke-width="2" filter="url(#flowShadow_41)"/>
    <rect width="1520" height="40" rx="16" fill="#9F1239"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">1. 진입 및 서포터 탐색 영역 (Entry &amp; Tech Validation)</text>
    <g transform="translate(40, 70)"><rect width="320" height="90" rx="12" fill="#9F1239" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-01 메인 랜딩</text><text x="160" y="62" fill="#FFE4E6" font-size="12" text-anchor="middle">(P-0.0) 직업병 공감</text></g>
    <g transform="translate(420, 70)"><rect width="320" height="90" rx="12" fill="#BE123C" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-02 1.0 패션모델 서포터</text><text x="160" y="62" fill="#FFF" font-size="12" text-anchor="middle">(P-1.0) 0.1mm 심리스 핏</text></g>
    <g transform="translate(800, 70)"><rect width="320" height="90" rx="12" fill="#BE123C" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-03 2.0 보호 테크</text><text x="160" y="62" fill="#FFF" font-size="12" text-anchor="middle">(P-2.0) 하중 분산 성적서</text></g>
    <g transform="translate(1180, 70)"><rect width="300" height="90" rx="12" fill="#FFE4E6" stroke="#FB7185" stroke-width="2" filter="url(#flowShadow_41)"/><text x="150" y="38" fill="#9F1239" font-size="15" font-weight="800" text-anchor="middle">ST-06 1.3 사이즈 [모달]</text><text x="150" y="62" fill="#9F1239" font-size="12" text-anchor="middle">(P-1.3) 정밀 치수 매칭</text></g>
    <path d="M 360 115 L 420 115 M 740 115 L 800 115 M 740 115 L 740 220 L 1180 220 M 1120 115 L 1180 115" stroke="#9F1239" stroke-width="2" fill="none"/>
  </g>

  <!-- Lane 2 -->
  <g transform="translate(80, 690)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#9F1239" stroke-width="2" filter="url(#flowShadow_41)"/>
    <rect width="1520" height="40" rx="16" fill="#9F1239"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">2. 검증 및 단체 제휴 영역 (Review &amp; B2B Alliance)</text>
    <g transform="translate(40, 70)"><rect width="320" height="90" rx="12" fill="#BE123C" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-04 3.0 100인 후기</text><text x="160" y="62" fill="#FFF" font-size="12" text-anchor="middle">(P-3.0) 평점 4.96점 갤러리</text></g>
    <g transform="translate(420, 70)"><rect width="320" height="90" rx="12" fill="#FB7185" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-10 3.3 단체 제휴</text><text x="160" y="62" fill="#FFF" font-size="12" text-anchor="middle">(P-3.3) 단체 할인 혜택</text></g>
    <g transform="translate(800, 70)"><rect width="320" height="90" rx="12" fill="#BE123C" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-05 5.0 10초 스트레칭</text><text x="160" y="62" fill="#FFF" font-size="12" text-anchor="middle">(P-5.0) 현장 리셋 영상</text></g>
    <g transform="translate(1180, 70)"><rect width="300" height="90" rx="12" fill="#BE123C" filter="url(#flowShadow_41)"/><text x="150" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-09 4.0 30일 무료체험</text><text x="150" y="62" fill="#FFF" font-size="12" text-anchor="middle">(P-4.0) 100% 무료 반품</text></g>
  </g>

  <!-- Lane 3 -->
  <g transform="translate(80, 1170)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#9F1239" stroke-width="2" filter="url(#flowShadow_41)"/>
    <rect width="1520" height="40" rx="16" fill="#9F1239"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">3. 1-Click 신청 및 발송 영역 (Conversion &amp; Completion)</text>
    <g transform="translate(420, 70)"><rect width="400" height="110" rx="14" fill="#FFE4E6" stroke="#FB7185" stroke-width="3" filter="url(#flowShadow_41)"/><text x="200" y="45" fill="#9F1239" font-size="18" font-weight="900" text-anchor="middle">ST-07 4.2 1-Click 신청 [모달]</text><text x="200" y="75" fill="#9F1239" font-size="13" text-anchor="middle">간편 인증 + 배송지 10초 접수</text></g>
    <g transform="translate(900, 70)"><rect width="380" height="110" rx="14" fill="#9F1239" filter="url(#flowShadow_41)"/><text x="190" y="45" fill="#FFFFFF" font-size="18" font-weight="900" text-anchor="middle">ST-08 4.3 주문 완료 안내</text><text x="190" y="75" fill="#FFE4E6" font-size="13" text-anchor="middle">(P-4.3) 접수 완료 &amp; 즉시 발송</text></g>
    <path d="M 820 125 L 900 125" stroke="#FB7185" stroke-width="3" fill="none"/>
  </g>

  <!-- Lane 4 -->
  <g transform="translate(80, 1650)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#9F1239" stroke-width="2" filter="url(#flowShadow_41)"/>
    <rect width="1520" height="40" rx="16" fill="#9F1239"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">4. 회원 서비스 및 시스템 예외 처리 영역 (Member &amp; Exceptions)</text>
    <g transform="translate(40, 70)"><rect width="320" height="90" rx="12" fill="#9F1239" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-11 6.1 간편 로그인</text><text x="160" y="62" fill="#FFE4E6" font-size="12" text-anchor="middle">(P-6.1) 간편 세션</text></g>
    <g transform="translate(420, 70)"><rect width="320" height="90" rx="12" fill="#9F1239" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#FFF" font-size="15" font-weight="800" text-anchor="middle">ST-12 6.2 마이페이지</text><text x="160" y="62" fill="#FFE4E6" font-size="12" text-anchor="middle">(P-6.2) 배송/반품 조회</text></g>
    <g transform="translate(800, 70)"><rect width="320" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#flowShadow_41)"/><text x="160" y="38" fill="#991B1B" font-size="15" font-weight="800" text-anchor="middle">ST-13 9.1 404 Not Found</text><text x="160" y="62" fill="#B91C1C" font-size="12" text-anchor="middle">(P-9.1) 에러 안내</text></g>
    <g transform="translate(1180, 70)"><rect width="300" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#flowShadow_41)"/><text x="150" y="38" fill="#991B1B" font-size="15" font-weight="800" text-anchor="middle">ST-14 9.2 시스템 점검</text><text x="150" y="62" fill="#B91C1C" font-size="12" text-anchor="middle">(P-9.2) 1:1 상담 채널</text></g>
  </g>
</svg>
