<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFF7ED; }
      .main-title { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; font-weight: 800; fill: #9A3412; }
      .sub-title { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 14px; fill: #C2410C; font-weight: 500; }
      .node-text { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .edge-label { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 600; fill: #9A3412; text-anchor: middle; }
      
      /* 연결선 */
      .line { stroke: #FDBA74; stroke-width: 2px; fill: none; }
      .line-accent { stroke: #EA580C; stroke-width: 2.5px; fill: none; }
      .line-dashed { stroke: #C2410C; stroke-width: 2px; stroke-dasharray: 5,5; fill: none; }
      .line-error { stroke: #EF4444; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
      .line-success { stroke: #10B981; stroke-width: 2px; fill: none; }
      
      /* 마커 */
      .arrow { fill: #FDBA74; }
      .arrow-accent { fill: #EA580C; }
      .arrow-dashed { fill: #C2410C; }
      .arrow-error { fill: #EF4444; }
      .arrow-success { fill: #10B981; }

      /* 노드 스타일 */
      .box-start-end { fill: #9A3412; stroke: #EA580C; stroke-width: 2px; }
      .text-start-end { fill: #FFEDD5; font-size: 13.5px; font-weight: bold; }
      
      .box-screen { fill: #FFFFFF; stroke: #EA580C; stroke-width: 2px; rx: 8px; ry: 8px; filter: drop-shadow(0 2px 8px rgba(234,88,12,0.15)); }
      .text-screen { fill: #9A3412; font-size: 13px; font-weight: bold; }
      
      .box-user { fill: #FFEDD5; stroke: #C2410C; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-user { fill: #7C2D12; font-size: 12.5px; font-weight: 600; }
      
      .box-system { fill: #D1FAE5; stroke: #10B981; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-system { fill: #065F46; font-size: 12.5px; font-weight: 600; }
      
      .box-decision { fill: #FEF9C3; stroke: #CA8A04; stroke-width: 1.8px; }
      .text-decision { fill: #854D0E; font-size: 12px; font-weight: bold; }
      
      .box-modal { fill: #FFFBEB; stroke: #D97706; stroke-width: 2px; stroke-dasharray: 6,3; rx: 8px; ry: 8px; }
      .text-modal { fill: #B45309; font-size: 13px; font-weight: bold; }
      
      .box-exception { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-exception { fill: #991B1B; font-size: 12px; font-weight: 600; }

      .col-container { fill: #FFFFFF; stroke: #FED7AA; stroke-width: 1.5px; rx: 12px; ry: 12px; }
      .col-header { font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: bold; }
      .legend-box { fill: #FFFFFF; stroke: #FED7AA; stroke-width: 1px; rx: 8px; ry: 8px; }
    </style>

    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow" />
    </marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-accent" />
    </marker>
    <marker id="arr-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-dashed" />
    </marker>
    <marker id="arr-error" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-error" />
    </marker>
    <marker id="arr-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-success" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="100%" height="100%" class="bg" />

  <!-- ========================================== -->
  <!-- 1. 헤더 및 범례 영역 -->
  <!-- ========================================== -->
  <g transform="translate(50, 35)">
    <text x="0" y="28" class="main-title">SEUMIM(스밈) 주부 홈케어 서비스 흐름도 (Service Flowchart)</text>
    <text x="0" y="55" class="sub-title">가상클라이언트 6 (정은숙: 1-Touch 3초 착용 &amp; 허리 하중 40% 분산 &amp; 080 무료 전화 주문)</text>
    
    <!-- 범례 (Legend) -->
    <g transform="translate(730, 0)">
      <rect width="850" height="65" class="legend-box" />
      <rect x="20" y="22" width="50" height="22" rx="11" class="box-start-end" />
      <text x="80" y="37" font-size="12" fill="#9A3412">시작/종료</text>
      
      <rect x="145" y="20" width="30" height="24" class="box-screen" />
      <text x="185" y="37" font-size="12" fill="#9A3412">화면(Page)</text>
      
      <rect x="265" y="22" width="28" height="22" class="box-user" />
      <text x="302" y="37" font-size="12" fill="#9A3412">사용자 행동</text>
      
      <rect x="385" y="22" width="28" height="22" class="box-system" />
      <text x="422" y="37" font-size="12" fill="#9A3412">시스템 처리</text>
      
      <polygon points="505,33 517,21 529,33 517,45" class="box-decision" />
      <text x="538" y="37" font-size="12" fill="#9A3412">판단 분기</text>
      
      <rect x="610" y="20" width="30" height="24" class="box-modal" />
      <text x="650" y="37" font-size="12" fill="#9A3412">080/모달</text>

      <rect x="725" y="22" width="28" height="22" class="box-exception" />
      <text x="762" y="37" font-size="12" fill="#9A3412">오류/예외</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. 공통 진입 및 메인 랜딩 네비게이션 -->
  <!-- ========================================== -->
  <g transform="translate(715, 125)">
    <rect width="250" height="46" rx="23" class="box-start-end" />
    <text x="125" y="23" class="node-text text-start-end">● 시작: 큰 글씨 웹사이트 접속</text>
  </g>

  <path d="M 840 171 L 840 205" class="line-accent" marker-end="url(#arr-accent)" />

  <!-- URL 유효성 검사 분기 다이아몬드 -->
  <g transform="translate(840, 240)">
    <polygon points="0,-32 120,0 0,32 -120,0" class="box-decision" />
    <text x="0" y="0" class="node-text text-decision">URL 유효성 검사</text>
  </g>

  <path d="M 840 272 L 840 325" class="line-accent" marker-end="url(#arr-accent)" />
  <rect x="848" y="288" width="56" height="20" fill="#FFF7ED" rx="4" />
  <text x="876" y="302" class="edge-label">정상 URL</text>

  <!-- 404 예외 분기 -->
  <path d="M 960 240 L 1400 240 L 1400 280" class="line-error" marker-end="url(#arr-error)" />
  <rect x="1140" y="228" width="65" height="20" fill="#FFF7ED" rx="4" />
  <text x="1172" y="242" class="edge-label" fill="#EF4444">잘못된 URL</text>
  
  <g transform="translate(1275, 280)">
    <rect width="250" height="50" class="box-exception" />
    <text x="125" y="25" class="node-text text-exception">9.1 404 Not Found [가정] (P-9.1)</text>
  </g>
  <path d="M 1275 305 L 1100 305 L 1100 350 L 990 350" class="line-dashed" marker-end="url(#arr-dashed)" />
  <text x="1165" y="297" class="edge-label">080 전화 주문 연결</text>

  <!-- 0.0 메인 랜딩페이지 노드 -->
  <g transform="translate(690, 325)">
    <rect width="300" height="56" class="box-screen" stroke-width="2.5" />
    <text x="150" y="28" class="node-text text-screen" font-size="15">0.0 큰 글씨 메인 랜딩 (P-0.0)</text>
  </g>

  <!-- GNB 분기선 -->
  <path d="M 840 381 L 840 425" class="line" />
  <path d="M 285 425 L 1395 425" class="line" />

  <path d="M 285 425 L 285 465" class="line-accent" marker-end="url(#arr-accent)" />
  <path d="M 840 425 L 840 465" class="line-accent" marker-end="url(#arr-accent)" />
  <path d="M 1395 425 L 1395 465" class="line-accent" marker-end="url(#arr-accent)" />

  <text x="285" y="445" class="edge-label" font-weight="bold">1-Touch 착용 영상</text>
  <text x="840" y="445" class="edge-label" font-weight="bold">허리 하중 40% 분산</text>
  <text x="1395" y="445" class="edge-label" font-weight="bold">동년배 100인 후기</text>

  <!-- ========================================================================= -->
  <!-- 3. 핵심 3대 흐름 컨테이너 (Flow A / Flow B / Flow C) -->
  <!-- ========================================================================= -->

  <!-- =================================================== -->
  <!-- COLUMN 1: Flow A (1-Touch 착용 & 080 무료 전화 주문) -->
  <!-- =================================================== -->
  <g transform="translate(45, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#9A3412" text-anchor="middle">[Flow A] 1-Touch 착용 &amp; 080 전화 / 카톡 무료 신청</text>
    
    <!-- 1. 탐색: P-1.0 홈케어 조끼 -->
    <g transform="translate(90, 60)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">1.0 홈케어 조끼 (P-1.0)</text>
    </g>

    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />

    <!-- 2. 사용자: 3초 착용 영상 확인 -->
    <g transform="translate(90, 145)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 앞에서 당겨 붙이는 3초 영상 확인</text>
    </g>

    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />

    <!-- 3. 분기: 상의 사이즈 가이드 필요 여부 -->
    <g transform="translate(240, 260)">
      <polygon points="0,-30 110,0 0,30 -110,0" class="box-decision" />
      <text x="0" y="0" class="node-text text-decision">옷 사이즈 확인?</text>
    </g>

    <path d="M 130 260 L 60 260 L 60 325 L 90 325" class="line" marker-end="url(#arr)" />
    <text x="80" y="250" class="edge-label">사이즈 확인</text>

    <g transform="translate(90, 305)">
      <rect width="300" height="46" class="box-modal" />
      <text x="150" y="23" class="node-text text-modal">1.3 상의 치수 가이드 [모달] (P-1.3)</text>
    </g>

    <path d="M 240 351 L 240 380" class="line" marker-end="url(#arr)" />

    <g transform="translate(90, 380)">
      <rect width="300" height="44" class="box-user" />
      <text x="150" y="22" class="node-text text-user">사용자: 평소 옷 치수(66/77/88) 선택</text>
    </g>

    <path d="M 350 260 L 415 260 L 415 460 L 390 460" class="line" marker-end="url(#arr)" />
    <text x="390" y="250" class="edge-label">전화 주문</text>

    <path d="M 240 424 L 240 455" class="line" marker-end="url(#arr)" />

    <!-- 4. 핵심 행동: 4.2 080 전화 / 카톡 간편 신청 모달 -->
    <g transform="translate(75, 455)">
      <rect width="330" height="52" class="box-modal" stroke-width="2.5" />
      <text x="165" y="26" class="node-text text-modal">4.2 080 전화 / 카톡 간편 신청 [모달] (P-4.2)</text>
    </g>

    <path d="M 240 507 L 240 540" class="line" marker-end="url(#arr)" />

    <!-- 5. 사용자 주문 방식 선택 -->
    <g transform="translate(90, 540)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 080 무료 전화 터치 또는 주소 입력</text>
    </g>

    <path d="M 240 586 L 240 625" class="line" marker-end="url(#arr)" />

    <!-- 6. 유효성 검증 분기 -->
    <g transform="translate(240, 660)">
      <polygon points="0,-32 110,0 0,32 -110,0" class="box-decision" />
      <text x="0" y="0" class="node-text text-decision">주문 유효성 검증</text>
    </g>

    <!-- 에러 경로 -->
    <path d="M 130 660 L 50 660 L 50 563 L 90 563" class="line-error" marker-end="url(#arr-error)" />
    <text x="70" y="650" class="edge-label" fill="#EF4444">080 전화 유도</text>

    <!-- 정상 주문 -->
    <path d="M 240 692 L 240 730" class="line-success" marker-end="url(#arr-success)" />
    <text x="260" y="710" class="edge-label" fill="#10B981">주문 승인</text>

    <!-- 7. 시스템 처리 -->
    <g transform="translate(90, 730)">
      <rect width="300" height="46" class="box-system" />
      <text x="150" y="23" class="node-text text-system">시스템: 2벌 동시 무료 배송 접수 &amp; 알림톡</text>
    </g>

    <path d="M 240 776 L 240 810" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 8. 완료 화면 -->
    <g transform="translate(90, 810)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">4.3 주문 완료 및 배송 안내 (P-4.3)</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- COLUMN 2: Flow B (허리 하중 40% 분산 테크 검증) -->
  <!-- =================================================== -->
  <g transform="translate(600, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#9A3412" text-anchor="middle">[Flow B] 싱크대 허리 하중 40% 분산 검증</text>

    <!-- 1. 탐색: P-2.0 허리 안심 테크 -->
    <g transform="translate(90, 60)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">2.0 허리 안심 테크 (P-2.0)</text>
    </g>

    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />

    <!-- 2. 사용자: 하중 분산 원리 확인 -->
    <g transform="translate(90, 145)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 설거지 시 허리 하중 40% 분산 확인</text>
    </g>

    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />

    <!-- 3. 오십견 배려 패턴 확인 -->
    <g transform="translate(90, 225)">
      <rect width="300" height="46" class="box-screen" />
      <text x="150" y="23" class="node-text text-screen">2.3 오십견 무간섭 어깨 패턴</text>
    </g>

    <path d="M 240 271 L 240 310" class="line" marker-end="url(#arr)" />

    <!-- 4. 사용자: 30일 무료 신청 클릭 -->
    <g transform="translate(90, 310)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: [집에서 30일간 무료로 입어보기] 클릭</text>
    </g>

    <path d="M 240 356 L 240 395" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 5. 모달 오픈 -->
    <g transform="translate(75, 395)">
      <rect width="330" height="52" class="box-modal" stroke-width="2.5" />
      <text x="165" y="26" class="node-text text-modal">4.2 080 전화 / 카톡 간편 신청 [모달] (P-4.2)</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- COLUMN 3: Flow C (동년배 100인 후기 & 자녀 효도 선물) -->
  <!-- =================================================== -->
  <g transform="translate(1155, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#065F46" text-anchor="middle">[Flow C] 동년배 100인 후기 &amp; 효도 선물</text>

    <!-- 1. 탐색: P-3.0 동년배 100인 후기 -->
    <g transform="translate(90, 60)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">3.0 동년배 100인 후기 (P-3.0)</text>
    </g>

    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />

    <!-- 2. 사용자: 50대 주부 실착 포토 확인 -->
    <g transform="translate(90, 145)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 싱크대 실착 포토 &amp; 평점 4.92 확인</text>
    </g>

    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />

    <!-- 3. 자녀 효도 선물 인터뷰 -->
    <g transform="translate(90, 225)">
      <rect width="300" height="46" class="box-screen" />
      <text x="150" y="23" class="node-text text-screen">3.3 자녀 효도 선물 인터뷰 (P-3.3)</text>
    </g>

    <path d="M 240 271 L 240 310" class="line" marker-end="url(#arr)" />

    <!-- 4. 사용자: 부모님 선물 신청 -->
    <g transform="translate(90, 310)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: [부모님 댁으로 30일 무료 배송] 클릭</text>
    </g>

    <path d="M 240 356 L 240 395" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 5. 간편 신청 모달 -->
    <g transform="translate(75, 395)">
      <rect width="330" height="52" class="box-modal" stroke-width="2.5" />
      <text x="165" y="26" class="node-text text-modal">4.2 080 전화 / 카톡 간편 신청 [모달] (P-4.2)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. 하단 공통 수렴 및 사후 관리 영역 -->
  <!-- ========================================================================= -->
  <path d="M 285 1685 L 285 1740 L 840 1740" class="line-accent" />
  <path d="M 840 1685 L 840 1740" class="line-accent" />
  <path d="M 1395 1685 L 1395 1740 L 840 1740" class="line-accent" />

  <path d="M 840 1740 L 840 1780" class="line-accent" marker-end="url(#arr-accent)" />

  <g transform="translate(690, 1780)">
    <rect width="300" height="50" class="box-screen" />
    <text x="150" y="25" class="node-text text-screen">6.1 전화번호 간편 조회 [가정] (P-6.1)</text>
  </g>

  <path d="M 840 1830 L 840 1870" class="line-success" marker-end="url(#arr-success)" />

  <g transform="translate(690, 1870)">
    <rect width="300" height="56" class="box-screen" stroke-width="2.5" />
    <text x="150" y="28" class="node-text text-screen" font-size="14">6.2 마이페이지 배송/반품 조회 [가정] (P-6.2)</text>
  </g>

  <path d="M 840 1926 L 840 1965" class="line" marker-end="url(#arr)" />

  <!-- 최종 종료 노드 -->
  <g transform="translate(715, 1965)">
    <rect width="250" height="46" rx="23" class="box-start-end" />
    <text x="125" y="23" class="node-text text-start-end">◎ 종료: 30일 설거지 실착 후 결정</text>
  </g>

  <g transform="translate(1300, 1960)">
    <rect width="250" height="50" class="box-exception" />
    <text x="125" y="25" class="node-text text-exception">9.2 시스템 점검 (전화주문 정상) (P-9.2)</text>
  </g>
</svg>
