<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="1680" height="2220">
  <defs>
    <style>
      .bg { fill: #0F172A; }
      .header-box { fill: #1E293B; stroke: #38BDF8; stroke-width: 2; rx: 16; }
      .title { fill: #38BDF8; font-family: 'Pretendard', sans-serif; font-size: 32px; font-weight: 800; }
      .subtitle { fill: #94A3B8; font-family: 'Pretendard', sans-serif; font-size: 18px; }
      
      .step-box { fill: #1E293B; stroke: #475569; stroke-width: 2; rx: 12; }
      .step-active { fill: #0F3854; stroke: #00F0FF; stroke-width: 3; rx: 12; }
      .step-modal { fill: #2A2010; stroke: #F59E0B; stroke-width: 2; rx: 12; }
      .step-success { fill: #064E3B; stroke: #10B981; stroke-width: 2; rx: 12; }
      
      .badge-step { fill: #0284C7; rx: 6; }
      .badge-txt { fill: #FFFFFF; font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 800; }
      
      .txt-title { fill: #FFFFFF; font-family: 'Pretendard', sans-serif; font-size: 19px; font-weight: 700; }
      .txt-desc { fill: #CBD5E1; font-family: 'Pretendard', sans-serif; font-size: 14px; line-height: 1.5; }
      .txt-highlight { fill: #38BDF8; font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: 600; }
      
      .flow-arrow { stroke: #38BDF8; stroke-width: 3; fill: none; stroke-dasharray: 6,4; }
      .flow-arrow-solid { stroke: #10B981; stroke-width: 3; fill: none; }
      .arrow-head { fill: #38BDF8; }
      .arrow-head-green { fill: #10B981; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head-green" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1680" height="2220" class="bg" />

  <!-- Header -->
  <rect x="60" y="40" width="1560" height="120" class="header-box" />
  <text x="100" y="95" class="title">SEUMIM 서비스 흐름도 (Service Flow) - 가상클라이언트 92 (시각화 개편)</text>
  <text x="100" y="135" class="subtitle">Hero 중앙 타이틀 ➔ 척추 통계 차트 &amp; 블라인드 후기 ➔ 3대 철학 카드 ➔ 15종 쇼케이스 ➔ 0원 무료 시착</text>

  <!-- ST-01 -->
  <g transform="translate(490, 200)">
    <rect width="700" height="100" class="step-box" />
    <rect x="20" y="20" width="80" height="28" class="badge-step" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-01</text>
    <text x="120" y="40" class="txt-title">Hero 오프닝 : 대형 비주얼 중앙 타이틀 확인 (SCR-01)</text>
    <text x="20" y="75" class="txt-desc">"바쁜 하루 속에서도, 나를 먼저 아끼는 다정한 균형" 오버레이 헤드라인 감상</text>
  </g>

  <line x1="840" y1="300" x2="840" y2="340" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-02 -->
  <g transform="translate(490, 340)">
    <rect width="700" height="135" class="step-active" />
    <rect x="20" y="20" width="80" height="28" fill="#E11D48" rx="6" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-02</text>
    <text x="120" y="40" class="txt-title">척추 통계 차트 &amp; 블라인드 찐후기 시각 대조 (SCR-02)</text>
    <text x="20" y="75" class="txt-desc">• [Left Data]: 82.3% 도넛 차트 / 9.4시간 타임라인 바 / 18.2° 골반 회전 그래픽 확인</text>
    <text x="20" y="100" class="txt-desc">• [Right Reviews]: 블라인드 불만 후기 말풍선 3종 &amp; 피부 붉은 자국/옷태 파괴 컷 확인</text>
  </g>

  <line x1="840" y1="475" x2="840" y2="515" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-03 -->
  <g transform="translate(490, 515)">
    <rect width="700" height="110" class="step-box" />
    <rect x="20" y="20" width="80" height="28" class="badge-step" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-03</text>
    <text x="120" y="40" class="txt-title">스밈 3대 탄생 철학 시각 다이어그램 수용 (SCR-03)</text>
    <text x="20" y="75" class="txt-desc">1) '스며들다' 습관 카드  2) '티 없이' 0.1mm 은폐 카드  3) Effort-Free 지탱 카드 확인</text>
  </g>

  <line x1="840" y1="625" x2="840" y2="665" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-04 -->
  <g transform="translate(490, 665)">
    <rect width="700" height="110" class="step-box" />
    <rect x="20" y="20" width="80" height="28" class="badge-step" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-04</text>
    <text x="120" y="40" class="txt-title">3대 원천기술 3D 인터랙티브 단면 확인 (SCR-04)</text>
    <text x="20" y="75" class="txt-desc">0.1mm 심리스 나노본딩 / 38g 에어로 쿨링 메쉬 / 척추 기립근 4중 동적 텐션 프레임</text>
  </g>

  <line x1="840" y1="775" x2="840" y2="815" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-05 -->
  <g transform="translate(490, 815)">
    <rect width="700" height="100" class="step-box" />
    <rect x="20" y="20" width="80" height="28" class="badge-step" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-05</text>
    <text x="120" y="40" class="txt-title">Before &amp; After 슬라이더 및 24시 일상 갤러리 (SCR-05)</text>
    <text x="20" y="75" class="txt-desc">드래그 슬라이더로 어깨 각도 32% 개선 비교 및 출근-업무-퇴근 실착 화보 확인</text>
  </g>

  <line x1="840" y1="915" x2="840" y2="955" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-06 -->
  <g transform="translate(490, 955)">
    <rect width="700" height="100" class="step-box" />
    <rect x="20" y="20" width="80" height="28" fill="#10B981" rx="6" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-06</text>
    <text x="120" y="40" class="txt-title">4대 자부심 메트릭 보드 확인 (SCR-06)</text>
    <text x="20" y="75" class="txt-desc">38g 초경량 / 99.8% 은폐율 / 300+ 의사·전문가 검증 / 100% 30일 안심 무료 시착</text>
  </g>

  <line x1="840" y1="1055" x2="840" y2="1095" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-07 -->
  <g transform="translate(490, 1095)">
    <rect width="700" height="120" class="step-active" />
    <rect x="20" y="20" width="80" height="28" class="badge-step" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-07</text>
    <text x="120" y="40" class="txt-title">15종 상품 쇼케이스 4대 탭 필터링 (SCR-07)</text>
    <text x="20" y="75" class="txt-desc">[시그니처 코어웨어 4] | [전문 집중케어 4] | [스마트 센서 4] | [직업 맞춤ACC 3]</text>
    <text x="20" y="98" class="txt-highlight">➔ 상품 카드별 [🔍 퀵뷰] 또는 [30일 무료 시착] 버튼 클릭 분기</text>
  </g>

  <!-- Branch Left: ST-08 (Quick View) -->
  <line x1="490" y1="1155" x2="350" y2="1155" class="flow-arrow" marker-end="url(#arrow)" />
  <g transform="translate(50, 1095)">
    <rect width="300" height="120" class="step-modal" />
    <rect x="15" y="15" width="70" height="24" fill="#D97706" rx="4" />
    <text x="50" y="32" text-anchor="middle" class="badge-txt" font-size="12">ST-08</text>
    <text x="95" y="33" class="txt-title" font-size="16">3D 퀵뷰 모달 (MOD-01)</text>
    <text x="15" y="65" class="txt-desc" font-size="12">• 360도 3D 단면 렌더링</text>
    <text x="15" y="85" class="txt-desc" font-size="12">• 실착 핏 &amp; 원단 스펙</text>
    <text x="15" y="105" class="txt-desc" font-size="12">• [사이즈 가이드] 연동</text>
  </g>

  <!-- Branch ST-08 -> ST-09 -->
  <line x1="200" y1="1215" x2="200" y2="1275" class="flow-arrow" marker-end="url(#arrow)" />
  <g transform="translate(50, 1275)">
    <rect width="300" height="100" class="step-modal" />
    <rect x="15" y="15" width="70" height="24" fill="#D97706" rx="4" />
    <text x="50" y="32" text-anchor="middle" class="badge-txt" font-size="12">ST-09</text>
    <text x="95" y="33" class="txt-title" font-size="16">사이즈 매칭 (MOD-02)</text>
    <text x="15" y="65" class="txt-desc" font-size="12">• 평소 의류 규격(95/100) 매칭</text>
    <text x="15" y="85" class="txt-desc" font-size="12">• 10초 체형 진단 설문</text>
  </g>

  <!-- Connect ST-09 to ST-10 -->
  <path d="M 350 1325 L 840 1325 L 840 1365" class="flow-arrow" marker-end="url(#arrow)" />
  <line x1="840" y1="1215" x2="840" y2="1365" class="flow-arrow-solid" marker-end="url(#arrow-green)" />

  <!-- ST-10 -->
  <g transform="translate(490, 1365)">
    <rect width="700" height="110" class="step-active" />
    <rect x="20" y="20" width="80" height="28" fill="#10B981" rx="6" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-10</text>
    <text x="120" y="40" class="txt-title">[30일 무료 시착 (결제금액 0원)] 전환 CTA 클릭</text>
    <text x="20" y="75" class="txt-desc">결제금액 0원 / 왕복 배송비 0원 / 30일 안심 무료 반품 보증 명시</text>
  </g>

  <line x1="840" y1="1475" x2="840" y2="1515" class="flow-arrow-solid" marker-end="url(#arrow-green)" />

  <!-- ST-11 -->
  <g transform="translate(490, 1515)">
    <rect width="700" height="110" class="step-modal" />
    <rect x="20" y="20" width="80" height="28" fill="#D97706" rx="6" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-11</text>
    <text x="120" y="40" class="txt-title">0원 무료 시착 간편 배송정보 입력 (MOD-03)</text>
    <text x="20" y="75" class="txt-desc">이름, 휴대폰 번호, 배송지 주소 입력 (별도 카드 등록/보증금 없음)</text>
  </g>

  <line x1="840" y1="1625" x2="840" y2="1665" class="flow-arrow-solid" marker-end="url(#arrow-green)" />

  <!-- ST-12 -->
  <g transform="translate(490, 1665)">
    <rect width="700" height="110" class="step-success" />
    <rect x="20" y="20" width="80" height="28" fill="#10B981" rx="6" />
    <text x="60" y="39" text-anchor="middle" class="badge-txt">ST-12</text>
    <text x="120" y="40" class="txt-title">시착 접수 완료 &amp; 카카오 알림톡 발송 (MOD-04)</text>
    <text x="20" y="75" class="txt-desc">접수 번호 발급, 30일 시착 캘린더 안내 및 무료 반품 송장 자동 생성</text>
  </g>

  <!-- Post-Order Services Branches (ST-13 & ST-14) -->
  <line x1="650" y1="1775" x2="650" y2="1845" class="flow-arrow" marker-end="url(#arrow)" />
  <line x1="1030" y1="1775" x2="1030" y2="1845" class="flow-arrow" marker-end="url(#arrow)" />

  <!-- ST-13 -->
  <g transform="translate(450, 1845)">
    <rect width="360" height="120" class="step-box" />
    <rect x="15" y="15" width="70" height="24" class="badge-step" />
    <text x="50" y="32" text-anchor="middle" class="badge-txt" font-size="12">ST-13</text>
    <text x="95" y="33" class="txt-title" font-size="16">AI 케어 앱 연동</text>
    <text x="15" y="65" class="txt-desc" font-size="12">• 10초 데스크 스트레칭 앱 연동</text>
    <text x="15" y="85" class="txt-desc" font-size="12">• 일일 자세 리포트 알림</text>
    <text x="15" y="105" class="txt-desc" font-size="12">• 스마트워치 퀵-글랜스 UI</text>
  </g>

  <!-- ST-14 -->
  <g transform="translate(870, 1845)">
    <rect width="360" height="120" class="step-box" />
    <rect x="15" y="15" width="70" height="24" class="badge-step" />
    <text x="50" y="32" text-anchor="middle" class="badge-txt" font-size="12">ST-14</text>
    <text x="95" y="33" class="txt-title" font-size="16">오프라인 센터 예약 (MOD-05)</text>
    <text x="15" y="65" class="txt-desc" font-size="12">• 전국 32개 제휴 교정 센터 검색</text>
    <text x="15" y="85" class="txt-desc" font-size="12">• 1:1 체형 정밀 진단 무료 쿠폰</text>
    <text x="15" y="105" class="txt-desc" font-size="12">• 전문가 맞춤 피팅 서비스</text>
  </g>

  <!-- Flow Summary Footer -->
  <rect x="60" y="2020" width="1560" height="140" class="header-box" />
  <text x="100" y="2065" class="txt-title" font-size="20">서비스 흐름 핵심 차별화 요약</text>
  <text x="100" y="2100" class="txt-desc">• [시각 몰입]: Hero 중앙 타이틀 오버레이와 척추 통계 차트로 직관적 공감대 형성</text>
  <text x="100" y="2125" class="txt-desc">• [블라인드 후기]: 기존 교정기의 실제 불만 후기를 통해 구매 당위성 부여</text>
  <text x="100" y="2150" class="txt-desc">• [마찰 제로 퍼널]: 결제금액 0원 30일 시착 신청으로 전환 장벽을 100% 제거</text>
</svg>
