<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="1680" height="2220" style="background:#f8f9fa; font-family:'Pretendard', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="flowHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c21" />
      <stop offset="100%" stop-color="#234a38" />
    </linearGradient>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382b" />
      <stop offset="100%" stop-color="#2d5a43" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f7f5" />
    </linearGradient>
    <linearGradient id="storyCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff5ee" />
    </linearGradient>
    <linearGradient id="ctaStepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97736" />
      <stop offset="100%" stop-color="#b8581b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .f-title { font-size: 32px; font-weight: 800; fill: #ffffff; }
    .f-subtitle { font-size: 16px; font-weight: 500; fill: #a8d5be; }
    .st-title { font-size: 17px; font-weight: 800; fill: #1b382b; }
    .st-title-story { font-size: 17px; font-weight: 800; fill: #9c4310; }
    .st-desc { font-size: 13px; font-weight: 500; fill: #555555; }
    .st-meta { font-size: 12px; font-weight: 600; fill: #2d5a43; }
    .st-meta-story { font-size: 12px; font-weight: 700; fill: #d97736; }
    .flow-line { stroke: #2d5a43; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow-line-story { stroke: #d97736; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .arrow { fill: #2d5a43; }
    .arrow-story { fill: #d97736; }
    .dec-title { font-size: 15px; font-weight: 800; fill: #1b382b; }
    .badge-txt { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- HEADER -->
  <rect x="60" y="40" width="1560" height="120" rx="18" fill="url(#flowHeaderGrad)" filter="url(#shadow)" />
  <text x="100" y="92" class="f-title">SEUMIM 스밈 브랜드 소개 전용 서비스 흐름도 (ST-01 ~ ST-14)</text>
  <text x="100" y="130" class="f-subtitle">바디럽(BODYLUV)형 일상 공감 ➔ 4대 상품 라인별 독립 서사 ➔ 3D 단면 분해도 조작 ➔ 28종 쇼케이스 ➔ 30일 무료 시착(0원 결제) 퍼널</text>
  <rect x="1420" y="70" width="160" height="40" rx="8" fill="#d97736" />
  <text x="1500" y="96" class="badge-txt" text-anchor="middle">ST-01 ~ 14 완결</text>

  <!-- ST-01: GNB 진입 -->
  <g transform="translate(490, 200)">
    <rect x="0" y="0" width="700" height="80" rx="40" fill="url(#startGrad)" filter="url(#shadow)" />
    <text x="350" y="36" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">ST-01: GNB 상단 진입 &amp; Our Story 메뉴 선택</text>
    <text x="350" y="60" font-size="13" font-weight="500" fill="#c3e4d4" text-anchor="middle">사용자 트리거: GNB 'Our Story' 클릭 ➔ 브랜드 소개 서브페이지 진입</text>
  </g>

  <!-- Flow Line 1 to 2 -->
  <path d="M 840 280 L 840 320" class="flow-line" />
  <polygon points="835,315 840,325 845,315" class="arrow" />

  <!-- ST-02: 안녕(安寧) 매니페스토 & 질문 인트로 -->
  <g transform="translate(490, 325)">
    <rect x="0" y="0" width="700" height="100" rx="14" fill="url(#cardGrad)" stroke="#2d5a43" stroke-width="1.5" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title">ST-02: 안녕(安寧) 매니페스토 &amp; 바디럽형 공감 인트로</text>
    <text x="30" y="60" class="st-desc">• 바디럽 공식 질문: "우리가 매일 겪는 자세 무너짐은 왜 늘 아프고 참아야 할까요?"</text>
    <text x="30" y="82" class="st-meta">시스템: 텍스트 페이드 인 (0.4s) &amp; Effortless Wellness 브랜드 존재 이유 선언</text>
  </g>

  <!-- Flow Line 2 to Decision 1 -->
  <path d="M 840 425 L 840 465" class="flow-line" />
  <polygon points="835,460 840,470 845,460" class="arrow" />

  <!-- DECISION 1: 탐색 방식 선택 -->
  <g transform="translate(715, 470)">
    <polygon points="125,0 250,55 125,110 0,55" fill="#eef4f0" stroke="#2d5a43" stroke-width="2" filter="url(#shadow)" />
    <text x="125" y="52" class="dec-title" text-anchor="middle">탐색 방식 선택</text>
    <text x="125" y="70" font-size="11" fill="#668274" text-anchor="middle">탭 점프 vs 스크롤</text>
  </g>

  <!-- Decision Branches -->
  <path d="M 715 525 L 360 525 L 360 600" class="flow-line" />
  <polygon points="355,595 360,605 365,595" class="arrow" />
  <text x="480" y="515" font-size="12" font-weight="700" fill="#2d5a43">상단 앵커 탭 클릭</text>

  <path d="M 965 525 L 1200 525 L 1200 600" class="flow-line" />
  <polygon points="1195,595 1200,605 1205,595" class="arrow" />
  <text x="1030" y="515" font-size="12" font-weight="700" fill="#2d5a43">자유 롱스크롤 탐색</text>

  <!-- ST-03: 스토리 앵커 탭 점프 -->
  <g transform="translate(160, 605)">
    <rect x="0" y="0" width="400" height="90" rx="12" fill="url(#cardGrad)" stroke="#2d5a43" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="32" class="st-title">ST-03: 스토리 앵커 탭 점프</text>
    <text x="20" y="54" class="st-desc">• [코어웨어/척추/골반/테크] 탭 선택</text>
    <text x="20" y="74" class="st-meta">시스템: scrollTo smooth &amp; ScrollSpy 동기화</text>
  </g>

  <!-- ST-04: Line 01 코어웨어 서사 (Center Direct) -->
  <g transform="translate(1000, 605)">
    <rect x="0" y="0" width="400" height="90" rx="12" fill="url(#storyCardGrad)" stroke="#d97736" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="32" class="st-title-story">자유 스크롤 서사 탐색</text>
    <text x="20" y="54" class="st-desc">• 4대 상품 라인 순차 완독</text>
    <text x="20" y="74" class="st-meta-story">시스템: 뷰포트 감지 탭 실시간 활성화</text>
  </g>

  <!-- MERGE LINES TO ST-04 -->
  <path d="M 360 695 L 360 740 L 840 740 L 840 770" class="flow-line" />
  <path d="M 1200 695 L 1200 740 L 840 740" class="flow-line" />
  <polygon points="835,765 840,775 845,765" class="arrow" />

  <!-- ST-04: Line 01. 0.1mm 코어웨어 서사 -->
  <g transform="translate(390, 775)">
    <rect x="0" y="0" width="900" height="110" rx="14" fill="url(#storyCardGrad)" stroke="#d97736" stroke-width="2" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title-story">ST-04: Line 01. 0.1mm 심리스 코어웨어 라인 스토리</text>
    <text x="30" y="60" class="st-desc">• [문제] 숨 막히는 보정기와 와이어의 고통 ➔ [R&amp;D] 엔지니어들의 3년 450회 원사 배합 실험</text>
    <text x="30" y="82" class="st-desc">• [시각 에셋] VIS-01 나노 센서 섬유 450배 확대 스캔 컷 &amp; 99.8% 무봉제 은폐율 입증</text>
    <text x="30" y="100" class="st-meta-story">전환: 0.1mm 심리스 넥&amp;숄더 밴드 3D 인터랙션 블록으로 연결</text>
  </g>

  <!-- Flow Line 4 to 5 -->
  <path d="M 840 885 L 840 920" class="flow-line-story" />
  <polygon points="835,915 840,925 845,915" class="arrow-story" />

  <!-- ST-05: 3D 단면 분해도 조작 -->
  <g transform="translate(390, 925)">
    <rect x="0" y="0" width="900" height="100" rx="14" fill="url(#cardGrad)" stroke="#2d5a43" stroke-width="1.5" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title">ST-05: 0.1mm 넥&amp;숄더 밴드 3D 단면 분해도 조작</text>
    <text x="30" y="60" class="st-desc">• 사용자 인터랙션: 마우스 드래그/호버로 전면 자석 버클 &amp; 0.1mm 전도성 섬유 레이어 3D 분해</text>
    <text x="30" y="82" class="st-meta">시스템: Three.js/WebGL 3D 렌더링 (미지원 시 2D 벡터 단면도 폴백)</text>
  </g>

  <!-- Flow Line 5 to 6 -->
  <path d="M 840 1025 L 840 1060" class="flow-line" />
  <polygon points="835,1055 840,1065 845,1055" class="arrow" />

  <!-- ST-06: Line 02 3D 척추조끼 서사 -->
  <g transform="translate(390, 1065)">
    <rect x="0" y="0" width="900" height="110" rx="14" fill="url(#storyCardGrad)" stroke="#d97736" stroke-width="2" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title-story">ST-06: Line 02. 3D 에어로 메쉬 척추 정렬 조끼 스토리</text>
    <text x="30" y="60" class="st-desc">• [문제] 장시간 착석 직장인의 굽은 등 &amp; 땀 ➔ [R&amp;D] 척추 기립근 탄성 지렛대 프레임 공학</text>
    <text x="30" y="82" class="st-desc">• [시각 에셋] VIS-02 척추 탄성 프레임 단면도 &amp; 3D 에어로 메쉬 열화상 쿨링 인포그래픽</text>
    <text x="30" y="100" class="st-meta-story">전환: 출근복 속 숨은 지퍼 3D 시연 및 3D 척추 조끼 0원 시착 링크</text>
  </g>

  <!-- Flow Line 6 to 7 -->
  <path d="M 840 1175 L 840 1210" class="flow-line-story" />
  <polygon points="835,1205 840,1215 845,1205" class="arrow-story" />

  <!-- ST-07: Line 03 골반 에어셀 벨트 서사 -->
  <g transform="translate(390, 1215)">
    <rect x="0" y="0" width="900" height="110" rx="14" fill="url(#storyCardGrad)" stroke="#d97736" stroke-width="2" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title-story">ST-07: Line 03. 인체공학 에어셀 골반 밸런스 벨트 스토리</text>
    <text x="30" y="60" class="st-desc">• [문제] 무의식적 다리 꼬기 &amp; 골반 비대칭 ➔ [R&amp;D] 착석 체압 감지 반사 에어셀 메커니즘</text>
    <text x="30" y="82" class="st-desc">• [시각 에셋] VIS-03 착석 체압 비대칭 감지 및 다리 꼬기 물리 차단 시뮬레이션</text>
    <text x="30" y="100" class="st-meta-story">전환: 골반 에어셀 벨트 3D 체압 분산도 확인 및 0원 시착 링크</text>
  </g>

  <!-- Flow Line 7 to 8 -->
  <path d="M 840 1325 L 840 1360" class="flow-line-story" />
  <polygon points="835,1355 840,1365 845,1355" class="arrow-story" />

  <!-- ST-08: Line 04 스마트 테크 & 직업 ACC 서사 -->
  <g transform="translate(390, 1365)">
    <rect x="0" y="0" width="900" height="110" rx="14" fill="url(#storyCardGrad)" stroke="#d97736" stroke-width="2" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title-story">ST-08: Line 04. 스마트 햅틱 센서 &amp; 직업 맞춤 ACC 스토리</text>
    <text x="30" y="60" class="st-desc">• [문제] 자세 무너짐 실시간 파악 불가 ➔ [R&amp;D] 0.01초 시차 필터링 &amp; 직종별 맞춤 도구</text>
    <text x="30" y="82" class="st-desc">• [시각 에셋] VIS-04 0.01초 모션 센싱 파형 &amp; 직업 맞춤 도구 7종 설계도</text>
    <text x="30" y="100" class="st-meta-story">전환: 실시간 HUD 대시보드 시연 및 직업 맞춤 ACC 7종 쇼케이스</text>
  </g>

  <!-- Flow Line 8 to 9 -->
  <path d="M 840 1475 L 840 1510" class="flow-line" />
  <polygon points="835,1505 840,1515 845,1505" class="arrow" />

  <!-- ST-09: 사회적 검증 & 임상 데이터 -->
  <g transform="translate(390, 1515)">
    <rect x="0" y="0" width="900" height="100" rx="14" fill="url(#cardGrad)" stroke="#2d5a43" stroke-width="1.5" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title">ST-09: 300인 전문의·개발자 실착 검증 &amp; 글로벌 친환경 비전</text>
    <text x="30" y="60" class="st-desc">• 검증 데이터: 통증 87.4% 감소, 3.2시간 바른 자세 유지, 평점 4.9점 실착 리포트</text>
    <text x="30" y="82" class="st-meta">시스템: 100% 생분해성 리사이클 원사 인증 뱃지 &amp; Social Proof 갤러리 렌더링</text>
  </g>

  <!-- Flow Line 9 to 10 -->
  <path d="M 840 1615 L 840 1650" class="flow-line" />
  <polygon points="835,1645 840,1655 845,1645" class="arrow" />

  <!-- ST-10: 28종 쇼케이스 필터링 -->
  <g transform="translate(390, 1655)">
    <rect x="0" y="0" width="900" height="100" rx="14" fill="url(#cardGrad)" stroke="#2d5a43" stroke-width="1.5" filter="url(#shadow)" />
    <text x="30" y="34" class="st-title">ST-10: 4대 솔루션 28개 전 상품 쇼케이스 탭 필터링</text>
    <text x="30" y="60" class="st-desc">• 사용자 트리거: 4대 탭(시그니처/전문케어/스마트센서/직업ACC) 클릭으로 카테고리 전환</text>
    <text x="30" y="82" class="st-meta">시스템: 4×7 그리드 28종 상품 즉시 필터링 (60fps 무지연 전환)</text>
  </g>

  <!-- Flow Line 10 to Decision 2 -->
  <path d="M 840 1755 L 840 1790" class="flow-line" />
  <polygon points="835,1785 840,1795 845,1785" class="arrow" />

  <!-- DECISION 2: 상세 확인 여부 -->
  <g transform="translate(715, 1795)">
    <polygon points="125,0 250,55 125,110 0,55" fill="#eef4f0" stroke="#2d5a43" stroke-width="2" filter="url(#shadow)" />
    <text x="125" y="52" class="dec-title" text-anchor="middle">상세 확인 여부</text>
    <text x="125" y="70" font-size="11" fill="#668274" text-anchor="middle">퀵뷰 vs 즉시 0원 시착</text>
  </g>

  <!-- Decision Branches 2 -->
  <path d="M 715 1850 L 450 1850 L 450 1910" class="flow-line" />
  <polygon points="445,1905 450,1915 455,1905" class="arrow" />
  <text x="530" y="1840" font-size="12" font-weight="700" fill="#2d5a43">[🔍 퀵뷰] 클릭</text>

  <path d="M 965 1850 L 1230 1850 L 1230 1910" class="flow-line" />
  <polygon points="1225,1905 1230,1915 1235,1905" class="arrow" />
  <text x="1030" y="1840" font-size="12" font-weight="700" fill="#d97736">[30일 0원 시착] 클릭</text>

  <!-- ST-11: 퀵뷰 모달 -->
  <g transform="translate(250, 1915)">
    <rect x="0" y="0" width="400" height="90" rx="12" fill="url(#cardGrad)" stroke="#2d5a43" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="32" class="st-title">ST-11: 상품 퀵뷰(Quick View) 모달</text>
    <text x="20" y="54" class="st-desc">• 0.1mm 정밀 치수표 &amp; 실착자 리뷰 확인</text>
    <text x="20" y="74" class="st-meta">전환: 퀵뷰 내부 [30일 무료시착] 클릭</text>
  </g>

  <!-- Merge to ST-12 -->
  <path d="M 450 2005 L 450 2030 L 840 2030 L 840 2050" class="flow-line" />
  <path d="M 1230 1915 L 1230 2030 L 840 2030" class="flow-line" />
  <polygon points="835,2045 840,2055 845,2045" class="arrow" />

  <!-- ST-12 & ST-13: 0원 결제 바텀시트 -->
  <g transform="translate(440, 2055)">
    <rect x="0" y="0" width="800" height="75" rx="14" fill="url(#ctaStepGrad)" filter="url(#shadow)" />
    <text x="30" y="32" font-size="16" font-weight="800" fill="#ffffff">ST-12 &amp; ST-13: [30일 무료 시착 (결제금액 0원)] 바텀시트 승인</text>
    <text x="30" y="56" font-size="12" font-weight="500" fill="#fceee6">사이즈 선택 ➔ 배송지 입력 ➔ 결제금액 0원 PG 본인인증 ➔ 마찰 제로 1초 신청 완료</text>
  </g>

  <!-- Flow Line to Finish -->
  <path d="M 840 2130 L 840 2155" class="flow-line" />
  <polygon points="835,2150 840,2160 845,2150" class="arrow" />

  <!-- ST-14: 완료 -->
  <g transform="translate(490, 2160)">
    <rect x="0" y="0" width="700" height="50" rx="25" fill="url(#startGrad)" filter="url(#shadow)" />
    <text x="350" y="32" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">ST-14: 시착 신청 완료 (30일 안심 무료 반품 보증 시작)</text>
  </g>
</svg>
