  <text x="90" y="945" class="step-desc">• [스밈 3대 대표작 3D 체험하러 가기 ➔] 클릭</text>
  <text x="90" y="963" class="step-desc">• 메인 랜딩 `#sec-featured`로 부드러운 뷰 복귀</text>

