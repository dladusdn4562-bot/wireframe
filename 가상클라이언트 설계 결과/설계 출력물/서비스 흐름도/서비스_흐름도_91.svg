  <!-- ================= LANE 1: 바디럽형 브랜드 스토리 (Our Story) ================= -->
  <rect x="50" y="180" width="490" height="1380" class="flow-lane" />
  <rect x="70" y="200" width="450" height="46" class="lane-header" />
  <text x="295" y="230" class="lane-title">[LANE 1] 바디럽형 브랜드 스토리 (Our Story)</text>

  <!-- ST-01 -->
  <rect x="75" y="270" width="440" height="84" class="step-node-action" />
  <rect x="90" y="282" width="60" height="20" class="step-tag" />
  <text x="120" y="296" class="step-tag-text">ST-01</text>
  <text x="160" y="297" class="step-title">GNB 'Our Story' 서브페이지 진입</text>
  <text x="90" y="325" class="step-desc">• GNB 활성화 하이라이트 &amp; `story.html` 서브페이지 렌더링</text>

  <!-- ST-02 -->
  <rect x="75" y="380" width="440" height="96" class="step-node-highlight" />
  <rect x="90" y="392" width="60" height="20" class="step-tag-accent" />
  <text x="120" y="406" class="step-tag-text">ST-02</text>
  <text x="160" y="407" class="step-title">바디럽형 일상 공감 인트로 인지</text>
  <text x="90" y="435" class="step-desc">• *"왜 자세 무너짐은 늘 아프고 참아야 할까?"* 질문 인지</text>
  <text x="90" y="453" class="step-desc">• 억지로 조이지 않는 Effortless Wellness 철학 선언</text>

  <!-- ST-03 -->
  <rect x="75" y="500" width="440" height="106" class="step-node" />
  <rect x="90" y="512" width="60" height="20" class="step-tag" />
  <text x="120" y="526" class="step-tag-text">ST-03</text>
  <text x="160" y="527" class="step-title">Ch 01. The Origin &amp; 나노 원천 기술</text>
  <text x="90" y="555" class="step-desc">• **[VIS-01]** 나노 섬유 현미경 450배 확대 스캔 컷 확인</text>
  <text x="90" y="573" class="step-desc">• 부품 엔지니어 팀의 체형 통증 고민 &amp; 3년 450회 실험</text>

  <!-- ST-04 -->
  <rect x="75" y="630" width="440" height="106" class="step-node" />
  <rect x="90" y="642" width="60" height="20" class="step-tag" />
  <text x="120" y="656" class="step-tag-text">ST-04</text>
  <text x="160" y="657" class="step-title">Ch 02. The Philosophy &amp; 지렛대 공학</text>
  <text x="90" y="685" class="step-desc">• **[VIS-02]** 인체공학 지렛대 탄성 복원 메커니즘 도면</text>
  <text x="90" y="703" class="step-desc">• 강제 조임 거부, 미세 움직임에 반응하는 텐션 공학</text>

  <!-- ST-05 -->
  <rect x="75" y="760" width="440" height="106" class="step-node" />
  <rect x="90" y="772" width="60" height="20" class="step-tag" />
  <text x="120" y="786" class="step-tag-text">ST-05</text>
  <text x="160" y="787" class="step-title">Ch 03. The Vision &amp; 300인 임상 검증</text>
  <text x="90" y="815" class="step-desc">• **[VIS-03]** 300인 의사·개발자 실착 검증단 포토 갤러리</text>
  <text x="90" y="833" class="step-desc">• 100% 생분해 친환경 원사 &amp; 6조 8,000억 글로벌 도약</text>

  <!-- ST-06 -->
  <rect x="75" y="890" width="440" height="88" class="step-node-highlight" />
  <rect x="90" y="902" width="60" height="20" class="step-tag-accent" />
