  <rect x="635" y="542" width="60" height="20" class="step-tag" />
  <text x="665" y="556" class="step-tag-text">ST-09</text>
  <text x="705" y="557" class="step-title">스마트 사이즈 파인더 동기화 탐색</text>
  <text x="635" y="585" class="step-desc">• 178cm / 72kg 입력 ➔ 1초 만에 권장 M 사이즈 산출</text>
  <text x="635" y="603" class="step-desc">• 28개 전 상품 카드에 [권장: M 뱃지] 실시간 동기화</text>
  <text x="635" y="621" class="step-desc">• 찜한 상품(❤️) GNB 뱃지 실시간 연동</text>

  <!-- ST-10 -->
