<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFlowGolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="headerGolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <filter id="flowShadowGolf" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1680" height="2220" fill="url(#bgFlowGolfGrad)"/>

  <!-- Main Header -->
  <g transform="translate(80, 50)">
    <rect width="1520" height="100" rx="16" fill="url(#headerGolfGrad)" filter="url(#flowShadowGolf)"/>
    <text x="760" y="45" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" text-anchor="middle">SEUMIM 시니어 파크골프 서포터 서비스 흐름도 (가상클라이언트 11: 배준호)</text>
    <text x="760" y="78" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="15" font-weight="600" text-anchor="middle">ST-01~14 전 단계 정의 &amp; 080 무료 전화 30일 필드 무료체험 Happy Path &amp; 동호회 단체 20% 분기</text>
  </g>

  <!-- Lane 1: Entry & Core Exploration (Y: 190 ~ 650) -->
  <g transform="translate(80, 190)">
    <rect width="1520" height="460" rx="16" fill="#FFFFFF" stroke="#14532D" stroke-width="2" filter="url(#flowShadowGolf)"/>
    <rect width="1520" height="40" rx="16" fill="#14532D"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">1. 진입 및 스윙 서포터 탐색 영역 (Entry &amp; Tech Validation)</text>

    <!-- ST-01 -->
    <g transform="translate(40, 70)">
      <rect width="320" height="90" rx="12" fill="#14532D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-01 큰 글씨 메인 랜딩</text>
      <text x="160" y="62" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-0.0) 스윙 요통 &amp; 080 전화</text>
    </g>

    <!-- ST-02 -->
    <g transform="translate(420, 70)">
      <rect width="320" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-02 1.0 파크골프 서포터</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-1.0) 비거리 15m 증가 원리</text>
    </g>

    <!-- ST-03 -->
    <g transform="translate(800, 70)">
      <rect width="320" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-03 2.0 척추-무릎 보호</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-2.0) 무릎 충격 45% 흡수 성적서</text>
    </g>

    <!-- ST-06 -->
    <g transform="translate(1180, 70)">
      <rect width="300" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#flowShadowGolf)"/>
      <text x="150" y="38" fill="#92400E" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-06 1.3 허리둘레 [모달]</text>
      <text x="150" y="62" fill="#B45309" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-1.3) 바지 28~42인치 매칭</text>
    </g>

    <!-- Connectors -->
    <path d="M 360 115 L 420 115 M 740 115 L 800 115 M 740 115 L 740 220 L 1180 220 M 1120 115 L 1180 115" stroke="#14532D" stroke-width="2" fill="none"/>
  </g>

  <!-- Lane 2: Verification & Review (Y: 690 ~ 1150) -->
  <g transform="translate(80, 690)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#14532D" stroke-width="2" filter="url(#flowShadowGolf)"/>
    <rect width="1520" height="40" rx="16" fill="#14532D"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">2. 동호회 검증 및 단체 제휴 영역 (Review &amp; Golf Club Alliance)</text>

    <!-- ST-04 -->
    <g transform="translate(40, 70)">
      <rect width="320" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-04 3.0 동호회 100인 후기</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-3.0) 평점 4.95점 갤러리</text>
    </g>

    <!-- ST-10 -->
    <g transform="translate(420, 70)">
      <rect width="320" height="90" rx="12" fill="#D97706" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-10 3.3 동호회 단체 20%</text>
      <text x="160" y="62" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-3.3) 10인 이상 단체 할인</text>
    </g>

    <!-- ST-05 -->
    <g transform="translate(800, 70)">
      <rect width="320" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-05 5.0 티박스 스트레칭</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-5.0) 10초 관절 리셋 영상</text>
    </g>

    <!-- ST-09 -->
    <g transform="translate(1180, 70)">
      <rect width="300" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="150" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-09 4.0 30일 필드 체험</text>
      <text x="150" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-4.0) 100% 무료 반품 보증</text>
    </g>
  </g>

  <!-- Lane 3: Conversion & Order Completion (Y: 1170 ~ 1630) -->
  <g transform="translate(80, 1170)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#14532D" stroke-width="2" filter="url(#flowShadowGolf)"/>
    <rect width="1520" height="40" rx="16" fill="#14532D"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">3. 080 무료 전화 주문 및 발송 영역 (Conversion &amp; Completion)</text>

    <!-- ST-07 -->
    <g transform="translate(420, 70)">
      <rect width="400" height="110" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#flowShadowGolf)"/>
      <text x="200" y="45" fill="#92400E" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">ST-07 4.2 080 전화 / 카톡 [모달]</text>
      <text x="200" y="75" fill="#B45309" font-family="'Pretendard', sans-serif" font-size="13" text-anchor="middle">📞 080-800-1234 무료 연결 + 10초 간편 주문</text>
    </g>

    <!-- ST-08 -->
    <g transform="translate(900, 70)">
      <rect width="380" height="110" rx="14" fill="#052E16" filter="url(#flowShadowGolf)"/>
      <text x="190" y="45" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">ST-08 4.3 주문 완료 및 배송 안내</text>
      <text x="190" y="75" fill="#FEF3C7" font-family="'Pretendard', sans-serif" font-size="13" text-anchor="middle">(P-4.3) 접수 완료 &amp; 댁으로 즉시 발송</text>
    </g>

    <!-- Connectors -->
    <path d="M 820 125 L 900 125" stroke="#D97706" stroke-width="3" fill="none"/>
  </g>

  <!-- Lane 4: Member Service & System Exceptions (Y: 1650 ~ 2110) -->
  <g transform="translate(80, 1650)">
    <rect width="1520" height="440" rx="16" fill="#FFFFFF" stroke="#14532D" stroke-width="2" filter="url(#flowShadowGolf)"/>
    <rect width="1520" height="40" rx="16" fill="#14532D"/>
    <text x="30" y="26" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">4. 회원 서비스 및 시스템 예외 처리 영역 (Member &amp; Exceptions)</text>

    <!-- ST-11 -->
    <g transform="translate(40, 70)">
      <rect width="320" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-11 6.1 전화번호 간편 조회</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-6.1) 비밀번호 없는 간편 세션</text>
    </g>

    <!-- ST-12 -->
    <g transform="translate(420, 70)">
      <rect width="320" height="90" rx="12" fill="#15803D" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-12 6.2 마이페이지</text>
      <text x="160" y="62" fill="#FEFCE8" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-6.2) 배송 조회 &amp; 무료 반품 신청</text>
    </g>

    <!-- ST-13 -->
    <g transform="translate(800, 70)">
      <rect width="320" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#flowShadowGolf)"/>
      <text x="160" y="38" fill="#991B1B" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-13 9.1 404 Not Found</text>
      <text x="160" y="62" fill="#B91C1C" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-9.1) 080 무료 전화 바로가기</text>
    </g>

    <!-- ST-14 -->
    <g transform="translate(1180, 70)">
      <rect width="300" height="90" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#flowShadowGolf)"/>
      <text x="150" y="38" fill="#991B1B" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ST-14 9.2 시스템 점검 안내</text>
      <text x="150" y="62" fill="#B91C1C" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">(P-9.2) 080 전화 주문 정상 운영</text>
    </g>
  </g>
</svg>
