<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEUMIM(스밈) 와이어프레임 스튜디오 (가상클라이언트 1: 박서준 총괄)</title>
  <style>
    /* ==========================================================================
       1. Global Reset & Theme Tokens (Low-Fidelity Wireframe System)
       ========================================================================== */
    :root {
      --bg-canvas: #0F172A;
      --bg-studio: #1E293B;
      --sidebar-width: 320px;
      --wf-bg: #FFFFFF;
      --wf-border: #94A3B8;
      --wf-dark-border: #334155;
      --wf-text-main: #0F172A;
      --wf-text-muted: #64748B;
      --wf-box-bg: #F1F5F9;
      --wf-accent: #0284C7;
      --wf-accent-bg: #E0F2FE;
      --wf-modal-border: #D97706;
      --wf-modal-bg: #FFFBEB;
      --wf-success: #059669;
      --wf-danger: #DC2626;
      --font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--bg-canvas);
      color: #F8FAFC;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ==========================================================================
       2. Studio Workspace Layout (Sidebar + Top Bar + Canvas)
       ========================================================================== */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-studio);
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 100vh;
      flex-shrink: 0;
      z-index: 100;
    }

    .studio-header {
      padding: 18px 20px;
      border-bottom: 1px solid #334155;
    }
    .studio-title { font-size: 16px; font-weight: 800; color: #38BDF8; display: flex; align-items: center; gap: 8px; }
    .studio-subtitle { font-size: 11.5px; color: #94A3B8; margin-top: 4px; }

    .search-box {
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px;
      background: #0F172A;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #F8FAFC;
      font-size: 12.5px;
      outline: none;
    }
    .search-input:focus { border-color: #38BDF8; }

    .screen-tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }
    .tree-category {
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      padding: 8px 12px 4px 12px;
      letter-spacing: 0.5px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #CBD5E1;
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 2px;
      transition: all 0.15s ease;
    }
    .tree-item:hover { background: #334155; color: #FFFFFF; }
    .tree-item.active { background: #0284C7; color: #FFFFFF; font-weight: 700; }
    .tree-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: #94A3B8;
    }
    .tree-item.active .tree-badge { background: #0369A1; color: #E0F2FE; }

    /* Studio Main Canvas */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #090D16;
    }

    #top-bar {
      height: 56px;
      background: var(--bg-studio);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .current-screen-info { display: flex; align-items: center; gap: 12px; }
    .screen-id-badge { background: #0284C7; color: #FFFFFF; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 4px; }
    .screen-name-title { font-size: 15px; font-weight: 700; color: #F8FAFC; }

    .viewport-controls { display: flex; align-items: center; gap: 6px; background: #0F172A; padding: 4px; border-radius: 8px; border: 1px solid #334155; }
    .vp-btn {
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    .vp-btn.active { background: #334155; color: #38BDF8; font-weight: 700; }

    .state-controls { display: flex; align-items: center; gap: 6px; }
    .state-label { font-size: 11.5px; color: #94A3B8; font-weight: 600; }
    .state-select {
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid #475569;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    #viewport-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
    }

    /* Device Viewport Wrapper */
    #device-frame {
      width: 1280px;
      background: var(--wf-bg);
      color: var(--wf-text-main);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border-radius: 8px;
      border: 1px solid #334155;
      overflow: hidden;
      min-height: 800px;
      transition: width 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #device-frame.tablet { width: 768px; }
    #device-frame.mobile { width: 375px; border-radius: 24px; border: 4px solid #334155; }

    /* ==========================================================================
       3. Wireframe UI Standard Elements
       ========================================================================== */
    .wf-header {
      border-bottom: 2px solid var(--wf-dark-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .wf-logo { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: #0F172A; cursor: pointer; }
    .wf-gnb { display: flex; gap: 16px; align-items: center; }
    .wf-gnb-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--wf-text-main);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px dashed transparent;
    }
    .wf-gnb-link:hover, .wf-gnb-link.active { border-color: var(--wf-accent); background: var(--wf-accent-bg); color: var(--wf-accent); }
    .wf-btn {
      padding: 8px 16px;
      border: 1.5px solid var(--wf-dark-border);
      background: #FFFFFF;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.1s ease;
    }
    .wf-btn:hover { background: #F1F5F9; }
    .wf-btn-primary { background: #0F172A; color: #FFFFFF; border-color: #0F172A; }
    .wf-btn-primary:hover { background: #1E293B; }
    .wf-btn-accent { background: var(--wf-accent); color: #FFFFFF; border-color: var(--wf-accent); }
    .wf-btn-accent:hover { background: #0369A1; }
    .wf-btn-sm { padding: 4px 10px; font-size: 11.5px; }

    .wf-box {
      border: 1.5px dashed var(--wf-border);
      background: var(--wf-box-bg);
      border-radius: 6px;
      padding: 16px;
    }
    .wf-placeholder {
      border: 2px dashed #94A3B8;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 16px;
      border-radius: 6px;
    }
    .wf-grid { display: grid; gap: 16px; }
    .wf-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .wf-grid-2 { grid-template-columns: repeat(2, 1fr); }

    .wf-footer {
      margin-top: auto;
      border-top: 2px solid var(--wf-dark-border);
      background: #F8FAFC;
      padding: 24px;
      font-size: 11.5px;
      color: var(--wf-text-muted);
    }

    /* Floating CTA Bar */
    .wf-floating-cta {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 12px 18px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 60;
    }

    /* Modal Overlay System */
    .wf-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .wf-modal-card {
      width: 90%;
      max-width: 580px;
      background: #FFFFFF;
      border: 2px solid #0F172A;
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      overflow: hidden;
      animation: modalPop 0.15s ease-out;
    }
    @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .wf-modal-header {
      padding: 16px 20px;
      background: #F8FAFC;
      border-bottom: 1.5px solid #CBD5E1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .wf-modal-title { font-size: 15px; font-weight: bold; color: #0F172A; }
    .wf-modal-close { background: none; border: none; font-size: 20px; font-weight: bold; cursor: pointer; color: #64748B; }
    .wf-modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
    .wf-modal-footer { padding: 14px 20px; background: #F8FAFC; border-top: 1px solid #CBD5E1; display: flex; justify-content: flex-end; gap: 8px; }

    /* Form Elements */
    .wf-form-group { margin-bottom: 14px; }
    .wf-label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .wf-input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #CBD5E1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .wf-input:focus { border-color: #0284C7; }
    .wf-input.error { border-color: #DC2626; background: #FEF2F2; }
    .wf-error-msg { font-size: 11px; color: #DC2626; margin-top: 4px; font-weight: 600; }

    /* Bottom Info Drawer */
    #info-drawer {
      height: 140px;
      background: var(--bg-studio);
      border-top: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      gap: 30px;
      flex-shrink: 0;
      font-size: 12px;
      overflow-x: auto;
    }
    .info-col { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
    .info-heading { font-weight: 700; color: #38BDF8; text-transform: uppercase; font-size: 11px; margin-bottom: 2px; }
    .info-val { color: #CBD5E1; line-height: 1.4; }

    /* Helper Utility */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ==========================================================================
       SIDEBAR: Screen Index & Navigator
       ========================================================================== -->
  <aside id="sidebar">
    <div class="studio-header">
      <div class="studio-title">
        <span>📐</span> SEUMIM Wireframe Studio
      </div>
      <div class="studio-subtitle">가상클라이언트 1 (박서준 기획총괄: HW+AI+O2O)</div>
    </div>

    <div class="search-box">
      <input type="text" id="screenSearch" class="search-input" placeholder="화면 ID 또는 화면명 검색...">
    </div>

    <div class="screen-tree" id="screenTree">
      <!-- Generated via JS -->
    </div>
  </aside>

  <!-- ==========================================================================
       MAIN WORKSPACE AREA
       ========================================================================== -->
  <main id="main-area">
    <!-- Top Control Bar -->
    <header id="top-bar">
      <div class="current-screen-info">
        <span class="screen-id-badge" id="currentScreenId">SCR-01</span>
        <span class="screen-name-title" id="currentScreenName">0.0 메인 랜딩페이지 (P-0.0)</span>
      </div>

      <div class="viewport-controls">
        <button class="vp-btn active" onclick="setViewport('desktop')">🖥️ Desktop (1280px)</button>
        <button class="vp-btn" onclick="setViewport('tablet')">📱 Tablet (768px)</button>
        <button class="vp-btn" onclick="setViewport('mobile')">📲 Mobile (375px)</button>
      </div>

      <div class="state-controls">
        <span class="state-label">화면 상태:</span>
        <select id="stateSelect" class="state-select" onchange="changeScreenState(this.value)">
          <option value="default">Default (기본)</option>
          <option value="loading">Loading (로딩 중)</option>
          <option value="empty">Empty (빈 상태)</option>
          <option value="error">Error (오류 발생)</option>
          <option value="complete">Complete (완료/승인)</option>
        </select>
      </div>
    </header>

    <!-- Canvas Viewport Wrapper -->
    <div id="viewport-container">
      <div id="device-frame">
        <!-- Interactive Viewport Content Injected Dynamically -->
        <div id="wf-content"></div>
      </div>
    </div>

    <!-- Bottom Metadata Info Drawer -->
    <footer id="info-drawer">
      <div class="info-col">
        <div class="info-heading">화면 목적 (Purpose)</div>
        <div class="info-val" id="drawerPurpose">-</div>
      </div>
      <div class="info-col">
        <div class="info-heading">진입 조건 (Entry)</div>
        <div class="info-val" id="drawerEntry">-</div>
      </div>
      <div class="info-col">
        <div class="info-heading">핵심 사용자 인터랙션 (Actions)</div>
        <div class="info-val" id="drawerActions">-</div>
      </div>
      <div class="info-col">
        <div class="info-heading">연결 화면 (Next Screens)</div>
        <div class="info-val" id="drawerNext">-</div>
      </div>
    </footer>
  </main>

  <!-- ==========================================================================
       JAVASCRIPT LOGIC & WIREFRAME ENGINE
       ========================================================================== -->

      const tree = document.getElementById("screenTree");
      tree.innerHTML = "";
      
      const categories = ["1차 메인", "2차 서브페이지", "3차 팝업/모달", "회원 서비스", "시스템 예외"];
      
      categories.forEach(cat => {
        const catScreens = screensData.filter(s => s.category === cat && (s.name.includes(filter) || s.id.toLowerCase().includes(filter.toLowerCase())));
        if (catScreens.length > 0) {
          const catHeader = document.createElement("div");
          catHeader.className = "tree-category";
          catHeader.textContent = cat;
          tree.appendChild(catHeader);

          catScreens.forEach(s => {
            const item = document.createElement("div");
            item.className = `tree-item ${s.id === currentScreen ? 'active' : ''}`;
            item.innerHTML = `
              <span>${s.name}</span>
              <span class="tree-badge">${s.sitemapId}</span>
            `;
            item.onclick = () => navigateToScreen(s.id);
            tree.appendChild(item);
          });
        }
      });
    }

      // Update Top Bar & Drawer
      document.getElementById("currentScreenId").textContent = data.id;
      document.getElementById("currentScreenName").textContent = `${data.name} (${data.sitemapId})`;
      document.getElementById("drawerPurpose").textContent = data.purpose;
      document.getElementById("drawerEntry").textContent = data.entry;
      document.getElementById("drawerActions").textContent = data.actions;
      document.getElementById("drawerNext").textContent = data.next;

      // Update Sidebar Active Class
      document.querySelectorAll(".tree-item").forEach(el => el.classList.remove("active"));
      renderSidebarTree(document.getElementById("screenSearch").value);

      // Render Screen Content
      renderScreenContent(screenId, "default");
    }

    function setViewport(size) {

      document.querySelectorAll(".vp-btn").forEach(b => b.classList.remove("active"));
      frame.className = "";
      if (size === "tablet") {
        frame.classList.add("tablet");
        event.target.classList.add("active");
      } else if (size === "mobile") {
        frame.classList.add("mobile");
        event.target.classList.add("active");

                    <strong>Step 1: 지점 확인</strong>
                    <p style="font-size: 12.5px; margin-top: 4px;">선택 지점: <strong>스밈 동행센터 강남 플래그십점</strong></p>
                    <p style="font-size: 11.5px; color: #64748B;">담당 매니저: 김진우 수석 체형교정사</p>
                  </div>
                ` : wizardStep === 2 ? `
                  <div class="wf-box" style="margin-bottom: 12px;">
                    <strong>Step 2: 예약 일시 선택</strong>
                    <div style="margin: 10px 0;">
                      <label class="wf-label">방문 희망 일자</label>
                      <input type="date" class="wf-input" value="2026-08-12">
                    </div>
                    <label class="wf-label">희망 시간대 선택</label>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
                      <button class="wf-btn wf-btn-sm wf-btn-primary">14:00 (잔여 1)</button>
                      <button class="wf-btn wf-btn-sm">15:00 (잔여 2)</button>
                      <button class="wf-btn wf-btn-sm" disabled style="opacity: 0.5;">16:00 (마감)</button>
                    </div>
                  </div>
                ` : wizardStep === 3 ? `
                  <div class="wf-box" style="margin-bottom: 12px;">
                    <strong>Step 3: 방문자 정보 입력</strong>
                    <div class="wf-form-group" style="margin-top: 8px;">
                      <label class="wf-label">이름</label>
                      <input type="text" class="wf-input" value="김스밈">
                    </div>
                    <div class="wf-form-group">
                      <label class="wf-label">휴대폰 번호 (알림톡 수신용)</label>
                      <input type="tel" class="wf-input" value="010-1234-5678">
                    </div>
                    <label class="wf-label">주요 불편 부위 (다중 선택)</label>
                    <div style="display: flex; gap: 8px;">
                      <label><input type="checkbox" checked> 목/거북목</label>
                      <label><input type="checkbox" checked> 어깨 굽음</label>
                      <label><input type="checkbox"> 허리/골반</label>
                    </div>
                  </div>
                ` : `
                  <div class="wf-box" style="background: #ECFDF5; border-color: #10B981;">
                    <strong style="color: #065F46;">Step 4: 예약 내용 최종 확인</strong>
                    <p style="font-size: 12.5px; margin: 8px 0;">• 일시: 2026년 08월 12일(수) 14:00<br>• 지점: 스밈 강남 플래그십점<br>• 예약자: 김스밈 (010-1234-5678)</p>
                    <label style="font-size: 11.5px;"><input type="checkbox" checked> 개인정보 수집 및 SMS 알림톡 발송 동의 (필수)</label>
                  </div>
                `}
              </div>
              <div class="wf-modal-footer">
                ${wizardStep > 1 ? `<button class="wf-btn" onclick="prevWizard()">이전 단계</button>` : ''}
                ${wizardStep < 4 ? `<button class="wf-btn wf-btn-primary" onclick="nextWizard()">다음 단계</button>` : `<button class="wf-btn wf-btn-accent" onclick="completeWizard()">예약 확정하기</button>`}
              </div>
            </div>
          </div>
        `;
      } else if (currentModal === "SCR-10") { // 30일 시착 신청 모달
        modalHtml = `
          <div class="wf-modal-overlay" onclick="closeModal()">
            <div class="wf-modal-card" onclick="event.stopPropagation()">
              <div class="wf-modal-header">
                <div class="wf-modal-title">📦 스밈 30일 무료 체험 사전 신청</div>
                <button class="wf-modal-close" onclick="closeModal()">×</button>
              </div>
              <div class="wf-modal-body">
                <p style="font-size: 12px; color: #64748B; margin-bottom: 12px;">30일 동안 편하게 착용해 보시고 불만족 시 100% 무료 반품해 드립니다.</p>
                <div class="wf-form-group">
                  <label class="wf-label">체험 제품 및 사이즈 선택</label>
                  <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                    <button class="wf-btn wf-btn-sm wf-btn-primary" style="flex: 1;">어깨 밴드</button>
                    <button class="wf-btn wf-btn-sm" style="flex: 1;">척추 조끼</button>
                    <button class="wf-btn wf-btn-sm" style="flex: 1;">골반 벨트</button>
                  </div>
                  <select class="wf-input">
                    <option>Type 2: 상의 100~105 스탠다드 (추천)</option>
                    <option>Type 1: 상의 90~95 슬림</option>
                    <option>Type 3: 상의 110+ 릴렉스</option>
                  </select>
                </div>
                <div class="wf-form-group">
                  <label class="wf-label">신청자 이름</label>
                  <input type="text" class="wf-input" placeholder="홍길동" value="김스밈">
                </div>
                <div class="wf-form-group">
                  <label class="wf-label">연락처</label>
                  <input type="tel" class="wf-input" placeholder="010-0000-0000" value="010-1234-5678">
                </div>
                <div class="wf-form-group">
                  <label class="wf-label">배송지 주소</label>
                  <input type="text" class="wf-input" placeholder="서울특별시 강남구 테헤란로 123" value="서울특별시 강남구 테헤란로 123" style="margin-bottom: 4px;">
                  <input type="text" class="wf-input" placeholder="상세 주소 입력" value="8층 스밈하우스">
                </div>
                <label style="font-size: 11.5px; color: #475569;"><input type="checkbox" checked> 30일 무상 시착 보장 약관 동의 (필수)</label>
              </div>
              <div class="wf-modal-footer">
                <button class="wf-btn" onclick="closeModal()">취소</button>
                <button class="wf-btn wf-btn-accent" onclick="alert('30일 무료 체험 사전 신청이 정상 접수되었습니다!'); closeModal(); navigateToScreen('SCR-12');">사전 신청 완료하기</button>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = commonHeader + bodyHtml + commonFooter + modalHtml;
    }

    // 5. 모달 및 Wizard 제어 함수
    function openModal(modalId) {
      currentModal = modalId;
      wizardStep = 1;
      renderScreenContent(currentScreen);
    }
    function closeModal() {
      currentModal = null;
      wizardStep = 1;
      renderScreenContent(currentScreen);
    }
    function nextWizard() {
      if (wizardStep < 4) {
        wizardStep++;
        renderScreenContent(currentScreen);
      }
    }
    function prevWizard() {
      if (wizardStep > 1) {
        wizardStep--;
        renderScreenContent(currentScreen);
      }
    }
    function completeWizard() {
      closeModal();
      navigateToScreen('SCR-08');
    }

    // 6. 검색 필터
    document.getElementById("screenSearch").addEventListener("input", function(e) {
      renderSidebarTree(e.target.value);
    });

    // 실행 시작
    window.onload = initStudio;
  </script>
</body>
</html>
