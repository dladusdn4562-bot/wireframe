  <text x="584" y="382" text-anchor="middle" class="head">착석 보조</text>
  <text x="745" y="382" text-anchor="middle" class="head">자세 감지</text>
  <text x="906" y="382" text-anchor="middle" class="head">즉시 알림</text>
  <text x="1066" y="382" text-anchor="middle" class="head">앱 기록</text>

