  <rect width="1860" height="1034" fill="#fcf8f6"/>
  <rect width="1860" height="5" fill="#edddd5"/>

  <text x="930" y="151" text-anchor="middle" class="eyebrow">COMPETITIVE ANALYSIS</text>
  <text x="930" y="219" text-anchor="middle" class="headline">기존 자세 관리 제품은 어떤 경험을 제공할까?</text>
  <text x="930" y="264" text-anchor="middle" class="subtitle">운동형 · 거치형 · 센서형 제품의 기능과 사용상 한계를 비교했습니다.</text>

