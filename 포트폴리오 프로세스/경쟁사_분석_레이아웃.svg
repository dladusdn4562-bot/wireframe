  <text x="225" y="794" class="brand" style="font-size:17px">UPRIGHT GO 2</text>
  <text x="225" y="821" class="type">부착형 센서</text>

  <g class="body">
    <text x="1191" y="476"><tspan>• 능동적 자세 운동</tspan><tspan x="1191" dy="36">• 반복 학습 중심</tspan></text>
    <text x="1463" y="476"><tspan>• 강습 일정에 맞춰 참여</tspan><tspan x="1463" dy="36">• 운동기구 별도 구매</tspan></text>
    <text x="1191" y="633"><tspan>• 착석 자세 물리 지지</tspan><tspan x="1191" dy="36">• 의자 위에 바로 배치</tspan></text>
    <text x="1463" y="633"><tspan>• 앉아 있을 때만 사용</tspan><tspan x="1463" dy="36">• 감지·기록 기능 없음</tspan></text>
    <text x="1191" y="790"><tspan>• 자세 감지·진동 알림</tspan><tspan x="1191" dy="36">• 앱 목표·데이터 관리</tspan></text>
    <text x="1463" y="790"><tspan>• 피부 부착·목걸이 착용</tspan><tspan x="1463" dy="36">• 물리적 지지 없음</tspan></text>
  </g>

  <text x="143" y="926" class="note">● 색 막대는 해당 제품·프로그램의 공식 안내에 나타난 기능 범위이며, 효과의 우열이나 성능 점수를 뜻하지 않습니다.</text>
