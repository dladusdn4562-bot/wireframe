<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1860" height="1034" viewBox="0 0 1860 1034" role="img" aria-labelledby="title description">
  <title id="title">자세 관리 제품 경쟁사 분석</title>
  <desc id="description">SNPE 운동, 커블체어, UPRIGHT GO 2의 기능 범위와 장점, 사용상 한계를 비교한 포트폴리오용 표</desc>
  <defs>
    <style><![CDATA[
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #252a29; }
      .eyebrow { font-size: 19px; font-weight: 800; letter-spacing: 2.3px; fill: #49675b; }
      .headline { font-size: 38px; font-weight: 800; letter-spacing: -1.7px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #6a706e; }
      .head { font-size: 19px; font-weight: 700; }
      .brand { font-size: 23px; font-weight: 800; letter-spacing: -0.6px; }
      .type { font-size: 16px; font-weight: 600; fill: #777f7b; }
      .body { font-size: 17px; font-weight: 600; letter-spacing: -0.45px; }
      .note { font-size: 15px; font-weight: 500; fill: #65716b; }
      .source { font-size: 14px; font-weight: 600; fill: #526e62; text-decoration: underline; }
      .mark { font-size: 25px; font-weight: 800; fill: white; }
    ]]></style>
    <filter id="cardShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#5c493f" flood-opacity="0.055"/>
