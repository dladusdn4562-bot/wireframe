  <text x="185" y="498" text-anchor="middle" class="mark">S</text>
  <text x="225" y="480" class="brand">SNPE</text>
  <text x="225" y="507" class="type">운동 프로그램</text>

  <rect x="158" y="620" width="54" height="54" rx="16" fill="#e7e9df"/>
