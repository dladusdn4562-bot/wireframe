        }
      });

      for (const [cat, list] of Object.entries(groups)) {
        if (list.length === 0) continue;
        const grpTitle = document.createElement("div");
        grpTitle.className = "tree-group-title";
        grpTitle.innerText = cat;
        tree.appendChild(grpTitle);

        list.forEach(s => {
          const item = document.createElement("div");
          item.className = "screen-item" + (s.id === currentScreen ? " active" : "");
          item.onclick = () => navigateToScreen(s.id);
          item.innerHTML = `<span>${s.name}</span><span class="badge">${s.id}</span>`;
          tree.appendChild(item);
        });
      }
    }

    function navigateToScreen(screenId) {
      currentScreen = screenId;
      const target = screens.find(s => s.id === screenId);
      document.getElementById("currentScreenId").innerText = target.id;
      document.getElementById("currentScreenName").innerText = `${target.name} (${target.sitemapId})`;
      renderSidebarTree(document.getElementById("screenSearch").value);
      renderScreenContent(target.id);
    }

    function renderScreenContent(screenId) {
      const container = document.getElementById("wf-content");
      if (screenId === "SCR-01") {
        container.innerHTML = `
          <div class="wf-header">
            <div class="wf-logo">SEUMIM 플로리스트공간디렉터</div>
            <div class="wf-nav">
              <span onclick="navigateToScreen('SCR-02')">1.0 브랜드 철학</span>
              <span onclick="navigateToScreen('SCR-03')">2.0 전문 컬렉션 (15종)</span>
              <span onclick="navigateToScreen('SCR-05')">3.0 AI 데이터 케어</span>
              <span onclick="navigateToScreen('SCR-06')">4.0 웰니스 센터</span>
              <span onclick="navigateToScreen('SCR-09')">5.0 혜택 &amp; 체험</span>
            </div>
            <div>
              <button class="wf-cta-btn" style="padding: 8px 16px; font-size: 11px;" onclick="navigateToScreen('SCR-10')">30일 무료 시착</button>
            </div>
          </div>

          <div class="wf-hero">
            <div class="wf-badge">Botanical Plant Atelier & Floral Spiral Wrist Clinic</div>
            <div class="wf-h1">직업적 한계를 극복하는 완벽한 바디 밸런스</div>
            <div class="wf-sub">플로리스트공간디렉터의 고강도 작업 환경에 최적화된 0.1mm 시크릿 에르고 코어웨어 &amp; 직업 맞춤 교정 솔루션</div>
            <button class="wf-cta-btn" onclick="navigateToScreen('SCR-10')">30일 무료 시착 신청하기 ➔</button>
          </div>

          <div class="wf-section" style="background: #F8FAFC;">
            <div class="wf-sec-title">★ 플로리스트공간디렉터 특화 인터랙티브 워크스페이스</div>
            <div class="wf-sec-desc">해당 직업의 작업 환경과 신체 부하를 정밀 분석하는 전용 시뮬레이션 위젯입니다.</div>
            
          <div class="atelier-mag">
            <div>
              <div style="font-size:16px; font-weight:800; color:#F472B6; margin-bottom:6px;">💐 대형 부케 스파이럴 손목 클리닉</div>
              <div style="font-size:12px; color:#FCE7F3; line-height:1.5;">수십 송이 꽃 줄기를 나선형으로 쥘 때 발생하는 엄지/검지 건초염과 손목 꺾임을 에르고 락 밴드가 물리적으로 지지합니다.</div>
            </div>
            <div style="background:#9D174D; padding:14px; border-radius:8px; text-align:center;">
              <div style="font-size:11px;">손목 중립 각도 유지율</div>
              <div style="font-size:22px; font-weight:800; color:#FFF; margin-top:4px;">98.2%</div>
            </div>
          </div>
        
          </div>

          <div class="wf-section">
            <div class="wf-sec-title">★ 메인 15개 브랜드 상품 전체 라인업 (4대 카테고리)</div>
            <div class="wf-sec-desc">직업 연계 인체공학 교정 도구를 포함한 15개 상품을 즉시 필터링하여 탐색하세요.</div>
            
            <div class="wf-tabs">
              <button class="wf-tab-btn ${activeTab === 'all' ? 'active' : ''}" onclick="filterProducts('all')">전체 컬렉션 (15)</button>
              <button class="wf-tab-btn ${activeTab === 'signature' ? 'active' : ''}" onclick="filterProducts('signature')">시그니처 라인 (4)</button>
              <button class="wf-tab-btn ${activeTab === 'care' ? 'active' : ''}" onclick="filterProducts('care')">전문 케어 라인 (4)</button>
              <button class="wf-tab-btn ${activeTab === 'sensor' ? 'active' : ''}" onclick="filterProducts('sensor')">스마트 센서 라인 (4)</button>
              <button class="wf-tab-btn ${activeTab === 'acc' ? 'active' : ''}" onclick="filterProducts('acc')">직업 맞춤 교정 ACC (3)</button>
            </div>

            <div class="wf-grid" id="productGrid"></div>
          </div>
        `;
        renderProductCards();
      } else {
        container.innerHTML = `
          <div style="padding: 60px; text-align: center;">
            <div style="display:inline-block; padding: 6px 12px; background:#F1F5F9; border-radius:4px; font-size:12px; font-weight:700; color:#0284C7; margin-bottom:12px;">${screenId}</div>
            <h2 style="font-size:22px; color:#0F172A; margin-bottom:12px;">${screens.find(s=>s.id===screenId).name}</h2>
            <p style="font-size:13px; color:#64748B; max-width:500px; margin:0 auto 24px;">${role_name} 전용 컴포넌트와 특화 인터랙션이 탑재된 화면입니다.</p>
            <button class="wf-cta-btn" onclick="navigateToScreen('SCR-01')">메인 랜딩페이지로 복귀</button>
          </div>
        `;
      }
    }

    function filterProducts(cat) {
      activeTab = cat;
      const btns = document.querySelectorAll(".wf-tab-btn");
      btns.forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      renderProductCards();
    }

    function renderProductCards() {
      const grid = document.getElementById("productGrid");
      if (!grid) return;
      grid.innerHTML = "";
      const filtered = activeTab === "all" ? productsData : productsData.filter(p => p.cat === activeTab);
      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "wf-card";
        card.innerHTML = `
          <div>
            <div class="wf-img-box">[IMG_${p.id < 10 ? '0' + p.id : p.id}] ${p.badge}</div>
            <div class="wf-tag">${p.tag}</div>
            <div class="wf-p-name">${p.name}</div>
            <div class="wf-p-desc">${p.desc}</div>
          </div>
          <div>
            <div class="wf-price-box">
              <span class="wf-price">${p.price.toLocaleString()}원</span>
              <span class="wf-origin">${p.origin.toLocaleString()}원</span>
              <span class="wf-disc">${p.disc}</span>
            </div>
            <div class="wf-btn-box">
              <button class="wf-btn-qv" onclick="openQvModal(${p.id})">🔍 퀵뷰</button>
              <button class="wf-btn-trial" onclick="navigateToScreen('SCR-10')">30일 시착</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openQvModal(pid) {
      const p = productsData.find(item => item.id === pid);
      if (!p) return;
      document.getElementById("qvTitle").innerText = `[${p.badge}] ${p.name}`;
      document.getElementById("qvBody").innerHTML = `
        <div style="height:160px; background:#F8FAFC; border:1px dashed #CBD5E1; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#94A3B8; margin-bottom:14px; font-weight:700;">
          [0.1mm 고화질 3D 실착 룩북 뷰어]
        </div>
        <div style="font-size:12px; color:#0284C7; font-weight:700; margin-bottom:4px;">${p.tag}</div>
        <div style="font-size:16px; font-weight:800; color:#0F172A; margin-bottom:8px;">${p.name}</div>
        <div style="font-size:12px; color:#475569; line-height:1.5; margin-bottom:14px;">${p.desc}</div>
        <div style="background:#F8FAFC; padding:12px; border-radius:6px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
            <span style="color:#64748B;">정가</span>
            <span style="text-decoration:line-through; color:#94A3B8;">${p.origin.toLocaleString()}원</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:800;">
            <span style="color:#0F172A;">30일 무료체험 특가</span>
            <span style="color:#0284C7;">${p.price.toLocaleString()}원 (${p.disc} 할인)</span>
          </div>
        </div>
        <div style="font-size:12px; font-weight:700; margin-bottom:6px;">권장 사이즈 선택</div>
        <div style="display:flex; gap:6px;">
          <button style="flex:1; padding:6px; border:1px solid #0F172A; background:#0F172A; color:#FFF; border-radius:4px; font-size:11px; font-weight:700;">95 (Type 1)</button>
          <button style="flex:1; padding:6px; border:1px solid #CBD5E1; background:#FFF; border-radius:4px; font-size:11px;">100 (Type 2)</button>
          <button style="flex:1; padding:6px; border:1px solid #CBD5E1; background:#FFF; border-radius:4px; font-size:11px;">105 (Type 3)</button>
        </div>
      `;
      document.getElementById("qvModal").classList.remove("hidden");
    }

    function closeQvModal() {
      document.getElementById("qvModal").classList.add("hidden");
    }

    function openTrialModalFromQv() {
      closeQvModal();
      navigateToScreen("SCR-10");
    }

    function setViewport(mode) {
      const frame = document.getElementById("device-frame");
      const btns = document.querySelectorAll(".vp-btn");
      btns.forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      if (mode === 'desktop') frame.style.width = "1280px";
      else if (mode === 'tablet') frame.style.width = "768px";
      else if (mode === 'mobile') frame.style.width = "375px";
    }

    window.onload = initStudio;
  </script>
</body>
</html>
