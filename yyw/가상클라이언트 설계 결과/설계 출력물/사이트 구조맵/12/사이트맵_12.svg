    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">3.0 맘카페 100인 후기</text>
    <text x="100" y="48" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-3.0) 평점 4.97점 갤러리</text>
  </g>
  <!-- 4.0 -->
