        <text x="195" y="28" fill="#FB7185" font-size="16">➔</text>
        <rect x="215" width="180" height="45" rx="8" fill="#FB7185"/><text x="305" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">1.3 출산 전후 사이즈</text>
        <text x="410" y="28" fill="#FB7185" font-size="16">➔</text>
        <rect x="430" width="220" height="45" rx="8" fill="#F43F5E"/><text x="540" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">30일 100% 무료 반품 보증</text>
        <text x="665" y="28" fill="#FB7185" font-size="16">➔</text>
        <rect x="685" width="160" height="45" rx="8" fill="#EA580C"/><text x="765" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">무료 체험 신청 완료</text>
      </g>
    </g>

    <!-- Journey 3 -->
    <g transform="translate(40, 460)">
