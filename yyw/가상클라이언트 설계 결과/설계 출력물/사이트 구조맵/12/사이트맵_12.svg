    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">4.0 맘스 30일 무료체험</text>
    <text x="100" y="48" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-4.0) 100% 무료 반품</text>
  </g>
  <!-- 5.0 -->
  <g transform="translate(940, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeMomGrad)" filter="url(#shadowMom)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">5.0 육퇴 10초 힐링팁</text>
    <text x="100" y="48" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-5.0) 침대 골반 리셋 영상</text>
  </g>

  <!-- Tree Connectors -->
  <path d="M 600 250 L 600 280 M 160 280 L 1040 280 M 160 280 L 160 310 M 380 280 L 380 310 M 600 280 L 600 310 M 820 280 L 820 310 M 1040 280 L 1040 310" stroke="#EA580C" stroke-width="2" fill="none"/>

  <!-- Level 2 Children -->
  <!-- 1.0 Children -->
  <g transform="translate(60, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.1 심리스 홈웨어 (P-1.1)</text>
  </g>
  <g transform="translate(60, 450)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">1.2 하중 52% 분산 (P-1.2)</text>
  </g>
  <g transform="translate(60, 500)">
    <rect width="200" height="40" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/>
    <text x="100" y="25" fill="#9F1239" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1.3 출산 전후 사이즈 [모달]</text>
  </g>

  <!-- 2.0 Children -->
  <g transform="translate(280, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2.1 0dB 무소음 버클 (P-2.1)</text>
