    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">3.3 출산 선물 후기 (P-3.3)</text>
  </g>

  <!-- 4.0 Children -->
  <g transform="translate(720, 400)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">4.1 30일 무료 실착 (P-4.1)</text>
  </g>
  <g transform="translate(720, 450)">
    <rect width="200" height="40" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/>
    <text x="100" y="25" fill="#9F1239" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800" text-anchor="middle">4.2 카카오 신청 [모달]</text>
