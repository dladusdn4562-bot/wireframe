<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="rootMomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="nodeMomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadowMom" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1350" fill="url(#bgMomGrad)"/>

  <!-- Title Header -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="90" rx="16" fill="#EA580C" filter="url(#shadowMom)"/>
    <text x="540" y="42" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" text-anchor="middle">SEUMIM 맘스 듀얼 서포터 사이트 구조맵 (가상클라이언트 12: 임수현)</text>
    <text x="540" y="70" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="14" font-weight="600" text-anchor="middle">0dB 무소음 마그네틱 버클 &amp; 아기띠 결합 허리 하중 52% 분산 IA</text>
  </g>

  <!-- Root Node -->
  <g transform="translate(420, 180)">
    <rect width="360" height="70" rx="12" fill="url(#rootMomGrad)" stroke="#FB7185" stroke-width="2" filter="url(#shadowMom)"/>
    <text x="180" y="34" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" text-anchor="middle">0.0 웜 피치 메인 랜딩 (P-0.0)</text>
    <text x="180" y="54" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="12" text-anchor="middle">육아 요통 공감 &amp; 맘스 30일 무료체험</text>
  </g>

  <!-- Level 1 Nodes -->
  <!-- 1.0 -->
  <g transform="translate(60, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeMomGrad)" filter="url(#shadowMom)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">1.0 맘스 듀얼 서포터</text>
    <text x="100" y="48" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-1.0) 하중 52% 분산</text>
  </g>
  <!-- 2.0 -->
  <g transform="translate(280, 310)">
    <rect width="200" height="60" rx="10" fill="url(#nodeMomGrad)" filter="url(#shadowMom)"/>
    <text x="100" y="28" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" text-anchor="middle">2.0 무소음 마그네틱</text>
    <text x="100" y="48" fill="#FFEDD5" font-family="'Pretendard', sans-serif" font-size="11" text-anchor="middle">(P-2.0) 0dB 버클 &amp; 오코텍스</text>
  </g>
  <!-- 3.0 -->
