    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.1 침대 골반 리셋 (P-5.1)</text>
  </g>
  <g transform="translate(940, 450)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.2 수유 바른 자세 (P-5.2)</text>
  </g>
  <g transform="translate(940, 500)">
    <rect width="200" height="40" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="100" y="25" fill="#1E293B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">5.3 세탁 &amp; 선물 FAQ (P-5.3)</text>
  </g>

  <!-- Conversion Journeys Sub-Diagram -->
  <g transform="translate(60, 620)">
    <rect width="1080" height="670" rx="16" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" filter="url(#shadowMom)"/>
    <rect width="1080" height="50" rx="16" fill="#EA580C"/>
    <text x="540" y="32" fill="#FFFFFF" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" text-anchor="middle">📍 핵심 사용자 3대 전환 여정 (Key User Conversion Journeys)</text>

    <!-- Journey 1 -->
    <g transform="translate(40, 80)">
      <rect width="1000" height="160" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
      <text x="30" y="36" fill="#EA580C" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 1] 카카오 1-Click 30일 맘스 무료 체험단 여정 (메인 전환)</text>
      <text x="30" y="66" fill="#C2410C" font-family="'Pretendard', sans-serif" font-size="13">타깃: 3040 육아맘/워킹맘 | 유입: 맘스홀릭 &amp; 베이비빌리 앱</text>
      <g transform="translate(30, 90)">
        <rect width="160" height="45" rx="8" fill="#EA580C"/><text x="80" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">0.0 메인 랜딩</text>
        <text x="175" y="28" fill="#F97316" font-size="16">➔</text>
        <rect x="195" width="160" height="45" rx="8" fill="#F97316"/><text x="275" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">1.0 맘스 서포터</text>
        <text x="370" y="28" fill="#F97316" font-size="16">➔</text>
        <rect x="390" width="160" height="45" rx="8" fill="#F97316"/><text x="470" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">2.0 0dB 무소음</text>
        <text x="565" y="28" fill="#F97316" font-size="16">➔</text>
        <rect x="585" width="180" height="45" rx="8" fill="#E11D48"/><text x="675" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">4.2 카카오 신청 모달</text>
        <text x="780" y="28" fill="#F97316" font-size="16">➔</text>
        <rect x="800" width="140" height="45" rx="8" fill="#9A3412"/><text x="870" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">4.3 댁으로 수령</text>
      </g>
    </g>

    <!-- Journey 2 -->
    <g transform="translate(40, 270)">
      <rect width="1000" height="160" rx="12" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.5"/>
      <text x="30" y="36" fill="#9F1239" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 2] 출산 전후 체형 사이즈 매칭 및 30일 무료 반품 주문 여정 (모바일)</text>
      <text x="30" y="66" fill="#BE123C" font-family="'Pretendard', sans-serif" font-size="13">타깃: 출산 후 체형 관리 여성 | 유입: 산후조리 허리보호대 검색</text>
      <g transform="translate(30, 90)">
