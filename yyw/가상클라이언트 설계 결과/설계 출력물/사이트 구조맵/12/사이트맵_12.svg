      <text x="30" y="36" fill="#991B1B" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800">[여정 3] 육퇴 10초 힐링팁 &amp; 출산 축하 선물 여정 (기프트)</text>
      <text x="30" y="66" fill="#B91C1C" font-family="'Pretendard', sans-serif" font-size="13">타깃: 남편/친구/가족 | 유입: 출산 백일 선물 검색</text>
      <g transform="translate(30, 90)">
        <rect width="180" height="45" rx="8" fill="#991B1B"/><text x="90" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">5.0 육퇴 힐링팁</text>
        <text x="195" y="28" fill="#F87171" font-size="16">➔</text>
        <rect x="215" width="200" height="45" rx="8" fill="#EF4444"/><text x="315" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">3.3 출산 선물 후기</text>
        <text x="430" y="28" fill="#F87171" font-size="16">➔</text>
        <rect x="450" width="240" height="45" rx="8" fill="#DC2626"/><text x="570" y="28" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">프리미엄 선물 패키지 선택</text>
