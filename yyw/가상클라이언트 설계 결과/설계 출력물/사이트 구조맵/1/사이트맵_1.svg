  <text x="70" y="1200" font-size="11" fill="#64748b">시나리오: 골반 수평 에어셀 원리 확인 ➔ 위치 기반 가까운 동행센터 검색 ➔ 4단계 Wizard 1회 무료 예약 ➔ 알림톡 수신 및 지점 방문</text>

