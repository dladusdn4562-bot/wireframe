  <text x="600" y="338" fill="#94A3B8" font-size="11" text-anchor="middle">실시간 HUD 대시보드</text>

  <line x1="840" y1="250" x2="840" y2="290" stroke="#38BDF8" stroke-width="2"/>
  <rect x="740" y="290" width="200" height="60" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="840" y="320" fill="#F8FAFC" font-size="13" font-weight="bold" text-anchor="middle">P-4.0 웰니스 센터</text>
