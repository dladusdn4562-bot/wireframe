  <text x="600" y="188" fill="#E0F2FE" font-size="12" text-anchor="middle">15개 상품 쇼케이스 (4대 탭) &amp; 0.1mm 에르고 슬라이더</text>

  <!-- Line from Root to Tier 1 -->
  <line x1="600" y1="205" x2="600" y2="250" stroke="#38BDF8" stroke-width="2"/>
  <line x1="120" y1="250" x2="1080" y2="250" stroke="#38BDF8" stroke-width="2"/>

  <!-- Tier 1 Nodes -->
  <line x1="120" y1="250" x2="120" y2="290" stroke="#38BDF8" stroke-width="2"/>
