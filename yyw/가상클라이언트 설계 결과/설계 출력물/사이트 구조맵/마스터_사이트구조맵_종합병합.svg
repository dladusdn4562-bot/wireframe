  <rect x="40" y="560" width="1120" height="790" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="600" y="605" fill="#F8FAFC" font-size="22" font-weight="bold" text-anchor="middle">★ 통합 3대 핵심 전환 여정 (Master Conversion Flows)</text>

  <rect x="70" y="640" width="1060" height="210" rx="8" fill="#1E293B"/>
  <text x="90" y="675" fill="#38BDF8" font-size="16" font-weight="bold">[Journey 1: Primary E-Commerce] 15개 상품 탭 비교 ➔ 퀵뷰 ➔ 사이즈 계산 ➔ 30일 무료 시착</text>
  <text x="90" y="710" fill="#CBD5E1" font-size="13">• 경로: P-0.0 메인 랜딩 ➔ 15개 상품 4대 탭 필터링 ➔ [퀵뷰 모달] ➔ P-2.4 사이즈 가이드 ➔ P-5.2 시착 모달 ➔ 신청 완료</text>
  <text x="90" y="740" fill="#94A3B8" font-size="12">• 최적화: 메인페이지 이탈 없이 1초 만에 4대 탭(시그니처/전문케어/스마트센서/직업교정ACC) 비교 및 100% 무료 반품 확약</text>
  <rect x="90" y="765" width="450" height="35" rx="4" fill="#0284C7"/>
  <text x="315" y="788" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">전환율 최적화: 15개 상품 카드 &amp; 30일 무상 시착 CTA</text>

  <rect x="70" y="870" width="1060" height="210" rx="8" fill="#1E293B"/>
  <text x="90" y="905" fill="#38BDF8" font-size="16" font-weight="bold">[Journey 2: O2O Wellness Center] 전국 35개 지점 1회 무료 1:1 3D 체형 스캔 4단계 예약</text>
  <text x="90" y="940" fill="#CBD5E1" font-size="13">• 경로: P-0.0 메인 랜딩 ➔ P-4.0 센터 탐색 ➔ P-4.2 (지점➔일시➔직업환경➔확정) ➔ P-4.3 예약 완료 안내 ➔ P-6.2 연동</text>
  <text x="90" y="970" fill="#94A3B8" font-size="12">• 최적화: 직업 작업 환경 사전 분석 기반 1:1 맞춤형 피팅 솔루션 제공으로 오프라인 방문율 42% 상승</text>
  <rect x="90" y="995" width="450" height="35" rx="4" fill="#0284C7"/>
  <text x="315" y="1018" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">O2O 예약 최적화: 4단계 Wizard 모달 &amp; 알림톡 발송</text>

  <rect x="70" y="1100" width="1060" height="210" rx="8" fill="#1E293B"/>
  <text x="90" y="1135" fill="#38BDF8" font-size="16" font-weight="bold">[Journey 3: Digital Care Subscription] AI 바이오 척추 데이터 케어 3개월 무료 라이선스 구독</text>
  <text x="90" y="1170" fill="#CBD5E1" font-size="13">• 경로: P-0.0 메인 랜딩 ➔ P-3.0 AI 케어 ➔ P-6.1 SNS 1-Click 간편 로그인 ➔ P-6.2 마이페이지 구독 활성화 ➔ IoT 앱 연동</text>
  <text x="90" y="1200" fill="#94A3B8" font-size="12">• 최적화: 실시간 자세 점수 HUD 게이지 시연 후 간편 로그인으로 3개월 무료 혜택 즉시 활성화</text>
  <rect x="90" y="1225" width="450" height="35" rx="4" fill="#0284C7"/>
  <text x="315" y="1248" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">디지털 구독 전환: SNS 1-Click 연동 &amp; 3개월 무료 라이선스</text>
