  <text x="600" y="90" fill="#38BDF8" font-size="15" text-anchor="middle">메인 15개 상품 쇼케이스 &amp; 14개 전 표준 화면 완전 구조도</text>

  <!-- Root -->
  <rect x="420" y="130" width="360" height="75" rx="10" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
