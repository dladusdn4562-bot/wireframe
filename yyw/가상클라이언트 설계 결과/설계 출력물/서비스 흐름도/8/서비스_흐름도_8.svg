<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0F172A; }
      .main-title { font-family: 'Pretendard', sans-serif; font-size: 26px; font-weight: 800; fill: #F59E0B; }
      .sub-title { font-family: 'Pretendard', sans-serif; font-size: 14px; fill: #FDE68A; font-weight: 500; }
      .node-text { font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .edge-label { font-family: 'Pretendard', sans-serif; font-size: 11.5px; font-weight: 600; fill: #FDE68A; text-anchor: middle; }
      
      .line { stroke: #475569; stroke-width: 2px; fill: none; }
      .line-accent { stroke: #F59E0B; stroke-width: 2.5px; fill: none; }
      .line-dashed { stroke: #0284C7; stroke-width: 2px; stroke-dasharray: 5,5; fill: none; }
      .line-error { stroke: #EF4444; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
      .line-success { stroke: #10B981; stroke-width: 2px; fill: none; }
      
      .arrow { fill: #475569; }
      .arrow-accent { fill: #F59E0B; }
      .arrow-dashed { fill: #0284C7; }
      .arrow-error { fill: #EF4444; }
      .arrow-success { fill: #10B981; }

      .box-start-end { fill: #1E293B; stroke: #F59E0B; stroke-width: 2px; }
      .text-start-end { fill: #FDE68A; font-size: 13.5px; font-weight: bold; }
      
      .box-screen { fill: #1E293B; stroke: #F59E0B; stroke-width: 2px; rx: 8px; ry: 8px; filter: drop-shadow(0 2px 8px rgba(245,158,11,0.2)); }
      .text-screen { fill: #F59E0B; font-size: 13px; font-weight: bold; }
      
      .box-user { fill: #334155; stroke: #F59E0B; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-user { fill: #FEF08A; font-size: 12.5px; font-weight: 600; }
      
      .box-system { fill: #082F49; stroke: #0284C7; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-system { fill: #7DD3FC; font-size: 12.5px; font-weight: 600; }
      
      .box-decision { fill: #1E293B; stroke: #F59E0B; stroke-width: 1.8px; }
      .text-decision { fill: #FDE68A; font-size: 12px; font-weight: bold; }
      
      .box-modal { fill: #1E293B; stroke: #0284C7; stroke-width: 2px; stroke-dasharray: 6,3; rx: 8px; ry: 8px; }
      .text-modal { fill: #38BDF8; font-size: 13px; font-weight: bold; }
      
      .box-exception { fill: #1E293B; stroke: #EF4444; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-exception { fill: #F87171; font-size: 12px; font-weight: 600; }

      .col-container { fill: #1E293B; stroke: #334155; stroke-width: 1.5px; rx: 12px; ry: 12px; }
      .col-header { font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: bold; }
      .legend-box { fill: #1E293B; stroke: #334155; stroke-width: 1px; rx: 8px; ry: 8px; }
    </style>

    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="arrow" /></marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="arrow-accent" /></marker>
    <marker id="arr-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="arrow-dashed" /></marker>
    <marker id="arr-error" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="arrow-error" /></marker>
    <marker id="arr-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="arrow-success" /></marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- 헤더 & 범례 -->
  <g transform="translate(50, 35)">
    <text x="0" y="28" class="main-title">SEUMIM(스밈) 드라이브 럼버 서포터 서비스 흐름도 (Service Flowchart)</text>
    <text x="0" y="55" class="sub-title">가상클라이언트 8 (오성훈: 12V 3초 자동 팽창 &amp; 도로 진동 55% 흡수 &amp; 080 무료 전화)</text>
    
    <g transform="translate(730, 0)">
      <rect width="850" height="65" class="legend-box" />
      <rect x="20" y="22" width="50" height="22" rx="11" class="box-start-end" /><text x="80" y="37" font-size="12" fill="#FDE68A">시작/종료</text>
      <rect x="145" y="20" width="30" height="24" class="box-screen" /><text x="185" y="37" font-size="12" fill="#FDE68A">화면(Page)</text>
      <rect x="265" y="22" width="28" height="22" class="box-user" /><text x="302" y="37" font-size="12" fill="#FDE68A">사용자 행동</text>
      <rect x="385" y="22" width="28" height="22" class="box-system" /><text x="422" y="37" font-size="12" fill="#FDE68A">시스템 처리</text>
      <polygon points="505,33 517,21 529,33 517,45" class="box-decision" /><text x="538" y="37" font-size="12" fill="#FDE68A">판단 분기</text>
      <rect x="610" y="20" width="30" height="24" class="box-modal" /><text x="650" y="37" font-size="12" fill="#FDE68A">080/모달</text>
      <rect x="725" y="22" width="28" height="22" class="box-exception" /><text x="762" y="37" font-size="12" fill="#FDE68A">오류/예외</text>
    </g>
  </g>

  <!-- 메인 진입 -->
  <g transform="translate(715, 125)">
    <rect width="250" height="46" rx="23" class="box-start-end" />
    <text x="125" y="23" class="node-text text-start-end">● 시작: 큰 글씨 웹사이트 접속</text>
  </g>

  <path d="M 840 171 L 840 205" class="line-accent" marker-end="url(#arr-accent)" />

  <g transform="translate(840, 240)">
    <polygon points="0,-32 120,0 0,32 -120,0" class="box-decision" />
    <text x="0" y="0" class="node-text text-decision">URL 유효성 검사</text>
  </g>

  <path d="M 840 272 L 840 325" class="line-accent" marker-end="url(#arr-accent)" />
  <rect x="848" y="288" width="56" height="20" fill="#0F172A" rx="4" />
  <text x="876" y="302" class="edge-label">정상 URL</text>

  <!-- 404 분기 -->
  <path d="M 960 240 L 1400 240 L 1400 280" class="line-error" marker-end="url(#arr-error)" />
  <g transform="translate(1275, 280)">
    <rect width="250" height="50" class="box-exception" />
    <text x="125" y="25" class="node-text text-exception">9.1 404 Not Found [가정] (P-9.1)</text>
  </g>

  <!-- 0.0 메인 -->
  <g transform="translate(690, 325)">
    <rect width="300" height="56" class="box-screen" stroke-width="2.5" />
    <text x="150" y="28" class="node-text text-screen" font-size="15">0.0 큰 글씨 드라이브 메인 (P-0.0)</text>
  </g>

  <!-- GNB 분기선 -->
  <path d="M 840 381 L 840 425" class="line" />
  <path d="M 285 425 L 1395 425" class="line" />

  <path d="M 285 425 L 285 465" class="line-accent" marker-end="url(#arr-accent)" />
  <path d="M 840 425 L 840 465" class="line-accent" marker-end="url(#arr-accent)" />
  <path d="M 1395 425 L 1395 465" class="line-accent" marker-end="url(#arr-accent)" />

  <text x="285" y="445" class="edge-label" font-weight="bold">12V 자동 팽창</text>
  <text x="840" y="445" class="edge-label" font-weight="bold">진동 55% 흡수</text>
  <text x="1395" y="445" class="edge-label" font-weight="bold">기사님 찐후기</text>

  <!-- 3대 컬럼 -->
  <!-- COLUMN 1 -->
  <g transform="translate(45, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#334155" stroke="#F59E0B" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#FDE68A" text-anchor="middle">[Flow A] 12V 자동 팽창 &amp; 080 무료 전화 주문</text>
    
    <g transform="translate(90, 60)"><rect width="300" height="50" class="box-screen" /><text x="150" y="25" class="node-text text-screen">1.0 드라이브 서포터 (P-1.0)</text></g>
    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />
    <g transform="translate(90, 145)"><rect width="300" height="46" class="box-user" /><text x="150" y="23" class="node-text text-user">사용자: 시동 시 3초 팽창 모식도 확인</text></g>
    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />
    
    <g transform="translate(90, 225)"><rect width="300" height="46" class="box-modal" /><text x="150" y="23" class="node-text text-modal">1.3 차종별 호환 가이드 [모달] (P-1.3)</text></g>
    <path d="M 240 271 L 240 310" class="line" marker-end="url(#arr)" />

    <g transform="translate(75, 310)"><rect width="330" height="52" class="box-modal" stroke-width="2.5" /><text x="165" y="26" class="node-text text-modal">4.2 080 전화 / 카톡 신청 [모달] (P-4.2)</text></g>
    <path d="M 240 362 L 240 400" class="line-accent" marker-end="url(#arr-accent)" />

    <g transform="translate(90, 400)"><rect width="300" height="46" class="box-user" /><text x="150" y="23" class="node-text text-user">사용자: 080 무료 전화 터치 또는 주소 입력</text></g>
    <path d="M 240 446 L 240 485" class="line" marker-end="url(#arr)" />

    <g transform="translate(90, 485)"><rect width="300" height="46" class="box-system" /><text x="150" y="23" class="node-text text-system">시스템: 30일 차량 장착 접수 &amp; 알림톡</text></g>
    <path d="M 240 531 L 240 570" class="line-accent" marker-end="url(#arr-accent)" />

    <g transform="translate(90, 570)"><rect width="300" height="50" class="box-screen" /><text x="150" y="25" class="node-text text-screen">4.3 주문 완료 및 배송 안내 (P-4.3)</text></g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(600, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#334155" stroke="#F59E0B" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#FDE68A" text-anchor="middle">[Flow B] 도로 진동 55% 흡수 테크 검증</text>

    <g transform="translate(90, 60)"><rect width="300" height="50" class="box-screen" /><text x="150" y="25" class="node-text text-screen">2.0 진동 흡수 테크 (P-2.0)</text></g>
    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />
    <g transform="translate(90, 145)"><rect width="300" height="46" class="box-user" /><text x="150" y="23" class="node-text text-user">사용자: 요추 L4-L5 0mm 밀착 성적서 확인</text></g>
    <path d="M 240 191 L 240 230" class="line-accent" marker-end="url(#arr-accent)" />

    <g transform="translate(75, 230)"><rect width="330" height="52" class="box-modal" stroke-width="2.5" /><text x="165" y="26" class="node-text text-modal">4.2 080 전화 / 카톡 신청 [모달] (P-4.2)</text></g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(1155, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#082F49" stroke="#0284C7" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#38BDF8" text-anchor="middle">[Flow C] 기사님 찐후기 &amp; 운송조합 혜택</text>

    <g transform="translate(90, 60)"><rect width="300" height="50" class="box-screen" /><text x="150" y="25" class="node-text text-screen">3.0 기사님 찐후기 (P-3.0)</text></g>
    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />
    <g transform="translate(90, 145)"><rect width="300" height="46" class="box-user" /><text x="150" y="23" class="node-text text-user">사용자: 택시 10년 차 포토 후기 &amp; 평점 확인</text></g>
    <path d="M 240 191 L 240 230" class="line-accent" marker-end="url(#arr-accent)" />

    <g transform="translate(75, 230)"><rect width="330" height="52" class="box-modal" stroke-width="2.5" /><text x="165" y="26" class="node-text text-modal">4.2 080 전화 / 카톡 신청 [모달] (P-4.2)</text></g>
  </g>

  <!-- 수렴선 및 종료 -->
  <path d="M 285 1685 L 285 1740 L 840 1740" class="line-accent" />
  <path d="M 840 1685 L 840 1740" class="line-accent" />
  <path d="M 1395 1685 L 1395 1740 L 840 1740" class="line-accent" />

  <path d="M 840 1740 L 840 1780" class="line-accent" marker-end="url(#arr-accent)" />
  <g transform="translate(690, 1780)"><rect width="300" height="50" class="box-screen" /><text x="150" y="25" class="node-text text-screen">6.1 간편 주문 조회 [가정] (P-6.1)</text></g>
  
  <path d="M 840 1830 L 840 1870" class="line-success" marker-end="url(#arr-success)" />
  <g transform="translate(690, 1870)"><rect width="300" height="56" class="box-screen" stroke-width="2.5" /><text x="150" y="28" class="node-text text-screen" font-size="14">6.2 마이페이지 배송 조회 [가정] (P-6.2)</text></g>

  <path d="M 840 1926 L 840 1965" class="line" marker-end="url(#arr)" />
  <g transform="translate(715, 1965)"><rect width="250" height="46" rx="23" class="box-start-end" /><text x="125" y="23" class="node-text text-start-end">◎ 종료: 내 차 30일 주행 실착 후 결정</text></g>
</svg>
