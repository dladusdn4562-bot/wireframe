  <text x="840" y="110" fill="#EC4899" font-size="18" text-anchor="middle">ST-01 ~ ST-14 전 14단계 풀 서비스 플로우 &amp; 3대 Happy Path</text>

  <!-- Step 1 to 8: Flow A -->
  <rect x="140" y="160" width="1400" height="180" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
  <text x="180" y="210" fill="#EC4899" font-size="22" font-weight="bold">[Flow A] 15개 상품 탐색 ➔ 퀵뷰 ➔ 사이즈 매칭 ➔ 30일 무료 시착</text>
  <text x="180" y="250" fill="#F8FAFC" font-size="16">ST-01 메인 랜딩 ➔ ST-02 척추 통계 ➔ ST-03 15개 상품 탭 ➔ ST-04 퀵뷰 ➔ ST-05 사이즈 가이드 ➔ ST-06 시착 모달 ➔ ST-07 배송정보 ➔ ST-08 접수 완료</text>
  <text x="180" y="290" fill="#94A3B8" font-size="14">※ 메인페이지 이탈 없이 15개 상품 카드 100% 탐색 및 30일 무료 반품 확약</text>

  <!-- Step 9 to 11: Flow B -->
  <rect x="140" y="380" width="1400" height="180" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
  <text x="180" y="430" fill="#EC4899" font-size="22" font-weight="bold">[Flow B] 전국 웰니스 센터 1:1 3D 체형 스캔 4단계 예약</text>
  <text x="180" y="470" fill="#F8FAFC" font-size="16">ST-01 메인 ➔ ST-09 센터 탐색 ➔ ST-10 4단계 Wizard 예약 (지점➔일시➔작업환경➔확정) ➔ ST-11 예약 확정</text>
  <text x="180" y="510" fill="#94A3B8" font-size="14">※ 직업 작업 환경 사전 분석을 통한 1:1 맞춤형 체형 리셋 처방</text>

  <!-- Step 12: Flow C -->
  <rect x="140" y="600" width="1400" height="180" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
  <text x="180" y="650" fill="#EC4899" font-size="22" font-weight="bold">[Flow C] AI 바이오 척추 데이터 케어 3개월 무료 라이선스 구독</text>
  <text x="180" y="690" fill="#F8FAFC" font-size="16">ST-01 메인 ➔ ST-12 AI 데이터 대시보드 시연 ➔ SNS 1-Click 간편 로그인 ➔ 라이선스 활성화</text>
  <text x="180" y="730" fill="#94A3B8" font-size="14">※ 작업 중 무소음 AI 햅틱 피드백 및 애플워치 퀵-글랜스 링 UI 연동</text>

