<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFF1F2; }
      .main-title { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 26px; font-weight: 800; fill: #881337; }
      .sub-title { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 14px; fill: #9F1239; font-weight: 500; }
      .node-text { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .edge-label { font-family: 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif; font-size: 11.5px; font-weight: 600; fill: #9F1239; text-anchor: middle; }
      
      /* 연결선 */
      .line { stroke: #FDA4AF; stroke-width: 2px; fill: none; }
      .line-accent { stroke: #F43F5E; stroke-width: 2.5px; fill: none; }
      .line-dashed { stroke: #BE123C; stroke-width: 2px; stroke-dasharray: 5,5; fill: none; }
      .line-error { stroke: #EF4444; stroke-width: 2px; stroke-dasharray: 4,4; fill: none; }
      .line-success { stroke: #E11D48; stroke-width: 2px; fill: none; }
      
      /* 마커 */
      .arrow { fill: #FDA4AF; }
      .arrow-accent { fill: #F43F5E; }
      .arrow-dashed { fill: #BE123C; }
      .arrow-error { fill: #EF4444; }
      .arrow-success { fill: #E11D48; }

      /* 노드 스타일 */
      .box-start-end { fill: #4C0519; stroke: #F43F5E; stroke-width: 2px; }
      .text-start-end { fill: #FFE4E6; font-size: 13.5px; font-weight: bold; }
      
      .box-screen { fill: #FFFFFF; stroke: #F43F5E; stroke-width: 2px; rx: 8px; ry: 8px; filter: drop-shadow(0 2px 8px rgba(244,63,94,0.15)); }
      .text-screen { fill: #9F1239; font-size: 13px; font-weight: bold; }
      
      .box-user { fill: #FFE4E6; stroke: #E11D48; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-user { fill: #881337; font-size: 12.5px; font-weight: 600; }
      
      .box-system { fill: #FDF2F8; stroke: #EC4899; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-system { fill: #831843; font-size: 12.5px; font-weight: 600; }
      
      .box-decision { fill: #FEF9C3; stroke: #CA8A04; stroke-width: 1.8px; }
      .text-decision { fill: #854D0E; font-size: 12px; font-weight: bold; }
      
      .box-modal { fill: #FFFBEB; stroke: #D97706; stroke-width: 2px; stroke-dasharray: 6,3; rx: 8px; ry: 8px; }
      .text-modal { fill: #B45309; font-size: 13px; font-weight: bold; }
      
      .box-exception { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .text-exception { fill: #991B1B; font-size: 12px; font-weight: 600; }

      .col-container { fill: #FFFFFF; stroke: #FECDD3; stroke-width: 1.5px; rx: 12px; ry: 12px; }
      .col-header { font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: bold; }
      .legend-box { fill: #FFFFFF; stroke: #FECDD3; stroke-width: 1px; rx: 8px; ry: 8px; }
    </style>

    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow" />
    </marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-accent" />
    </marker>
    <marker id="arr-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-dashed" />
    </marker>
    <marker id="arr-error" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-error" />
    </marker>
    <marker id="arr-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-success" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="100%" height="100%" class="bg" />

  <!-- ========================================== -->
  <!-- 1. 헤더 및 범례 영역 -->
  <!-- ========================================== -->
  <g transform="translate(50, 35)">
    <text x="0" y="28" class="main-title">SEUMIM(스밈) 오피스룩 슬림핏 서비스 흐름도 (Service Flowchart)</text>
    <text x="0" y="55" class="sub-title">가상클라이언트 4 (이주은: 0.1mm 심리스 무봉제 &amp; 승모근 32% 완화 &amp; 얼리버드 15% 사전 예약)</text>
    
    <!-- 범례 (Legend) -->
    <g transform="translate(730, 0)">
      <rect width="850" height="65" class="legend-box" />
      <rect x="20" y="22" width="50" height="22" rx="11" class="box-start-end" />
      <text x="80" y="37" font-size="12" fill="#881337">시작/종료</text>
      
      <rect x="145" y="20" width="30" height="24" class="box-screen" />
      <text x="185" y="37" font-size="12" fill="#881337">화면(Page)</text>
      
      <rect x="265" y="22" width="28" height="22" class="box-user" />
      <text x="302" y="37" font-size="12" fill="#881337">사용자 행동</text>
      
      <rect x="385" y="22" width="28" height="22" class="box-system" />
      <text x="422" y="37" font-size="12" fill="#881337">시스템 처리</text>
      
      <polygon points="505,33 517,21 529,33 517,45" class="box-decision" />
      <text x="538" y="37" font-size="12" fill="#881337">판단 분기</text>
      
      <rect x="610" y="20" width="30" height="24" class="box-modal" />
      <text x="650" y="37" font-size="12" fill="#881337">모달/팝업</text>

      <rect x="725" y="22" width="28" height="22" class="box-exception" />
      <text x="762" y="37" font-size="12" fill="#881337">오류/예외</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. 공통 진입 및 메인 랜딩 네비게이션 -->
  <!-- ========================================== -->
  <g transform="translate(715, 125)">
    <rect width="250" height="46" rx="23" class="box-start-end" />
    <text x="125" y="23" class="node-text text-start-end">● 시작: 오피스룩 웹사이트 접속</text>
  </g>

  <path d="M 840 171 L 840 205" class="line-accent" marker-end="url(#arr-accent)" />

  <!-- URL 유효성 검사 분기 다이아몬드 -->
  <g transform="translate(840, 240)">
    <polygon points="0,-32 120,0 0,32 -120,0" class="box-decision" />
    <text x="0" y="0" class="node-text text-decision">URL 유효성 검사</text>
  </g>

  <path d="M 840 272 L 840 325" class="line-accent" marker-end="url(#arr-accent)" />
  <rect x="848" y="288" width="56" height="20" fill="#FFF1F2" rx="4" />
  <text x="876" y="302" class="edge-label">정상 URL</text>

  <!-- 404 예외 분기 -->
  <path d="M 960 240 L 1400 240 L 1400 280" class="line-error" marker-end="url(#arr-error)" />
  <rect x="1140" y="228" width="65" height="20" fill="#FFF1F2" rx="4" />
  <text x="1172" y="242" class="edge-label" fill="#EF4444">잘못된 URL</text>
  
  <g transform="translate(1275, 280)">
    <rect width="250" height="50" class="box-exception" />
    <text x="125" y="25" class="node-text text-exception">9.1 404 Not Found [가정] (P-9.1)</text>
  </g>
  <path d="M 1275 305 L 1100 305 L 1100 350 L 990 350" class="line-dashed" marker-end="url(#arr-dashed)" />
  <text x="1165" y="297" class="edge-label">룩북 바로가기</text>

  <!-- 0.0 메인 랜딩페이지 노드 -->
  <g transform="translate(690, 325)">
    <rect width="300" height="56" class="box-screen" stroke-width="2.5" />
    <text x="150" y="28" class="node-text text-screen" font-size="15">0.0 오피스룩 메인 (P-0.0)</text>
  </g>

  <!-- GNB 분기선 -->
  <path d="M 840 381 L 840 425" class="line" />
  <path d="M 285 425 L 1395 425" class="line" />

  <path d="M 285 425 L 285 465" class="line-accent" marker-end="url(#arr-accent)" />
  <path d="M 840 425 L 840 465" class="line-accent" marker-end="url(#arr-accent)" />
  <path d="M 1395 425 L 1395 465" class="line-accent" marker-end="url(#arr-accent)" />

  <text x="285" y="445" class="edge-label" font-weight="bold">심리스 룩북 화보</text>
  <text x="840" y="445" class="edge-label" font-weight="bold">승모근 3D 패턴</text>
  <text x="1395" y="445" class="edge-label" font-weight="bold">100인 눈바디 릴스</text>

  <!-- ========================================================================= -->
  <!-- 3. 핵심 3대 흐름 컨테이너 (Flow A / Flow B / Flow C) -->
  <!-- ========================================================================= -->

  <!-- =================================================== -->
  <!-- COLUMN 1: Flow A (심리스 룩북 & 얼리버드 15% 예약) -->
  <!-- =================================================== -->
  <g transform="translate(45, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#9F1239" text-anchor="middle">[Flow A] 심리스 룩북 &amp; 얼리버드 15% 예약</text>
    
    <!-- 1. 탐색: P-1.0 오피스 룩북 -->
    <g transform="translate(90, 60)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">1.0 오피스 룩북 (P-1.0)</text>
    </g>

    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />

    <!-- 2. 사용자: 셔츠/블라우스 화보 확인 -->
    <g transform="translate(90, 145)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 셔츠/블라우스 0.1mm 심리스 화보</text>
    </g>

    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />

    <!-- 3. 비침 비교 모달 호출 -->
    <g transform="translate(90, 225)">
      <rect width="300" height="46" class="box-modal" />
      <text x="150" y="23" class="node-text text-modal">1.3 0.1mm 비침 비교 [모달] (P-1.3)</text>
    </g>

    <path d="M 240 271 L 240 310" class="line" marker-end="url(#arr)" />

    <!-- 4. 사용자: 슬라이더 조작 -->
    <g transform="translate(90, 310)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 비침 0% 슬라이더 좌우 조작</text>
    </g>

    <path d="M 240 356 L 240 395" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 5. 모달: 얼리버드 예약 폼 -->
    <g transform="translate(75, 395)">
      <rect width="330" height="52" class="box-modal" stroke-width="2.5" />
      <text x="165" y="26" class="node-text text-modal">4.3 얼리버드 예약 폼 [모달] (P-4.3)</text>
    </g>

    <path d="M 240 447 L 240 485" class="line" marker-end="url(#arr)" />

    <!-- 6. 사용자: 옵션 및 배송지 입력 -->
    <g transform="translate(90, 485)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 사이즈(55/66), 세탁망 증정 체크</text>
    </g>

    <path d="M 240 531 L 240 570" class="line" marker-end="url(#arr)" />

    <!-- 7. 유효성 검증 분기 -->
    <g transform="translate(240, 605)">
      <polygon points="0,-32 110,0 0,32 -110,0" class="box-decision" />
      <text x="0" y="0" class="node-text text-decision">입력값 유효성 검증</text>
    </g>

    <!-- 에러 경로 -->
    <path d="M 130 605 L 50 605 L 50 508 L 90 508" class="line-error" marker-end="url(#arr-error)" />
    <text x="70" y="595" class="edge-label" fill="#EF4444">누락 오류</text>

    <!-- 정상 완료 -->
    <path d="M 240 637 L 240 675" class="line-success" marker-end="url(#arr-success)" />
    <text x="260" y="655" class="edge-label" fill="#E11D48">예약 성공</text>

    <!-- 8. 시스템 처리 -->
    <g transform="translate(90, 675)">
      <rect width="300" height="46" class="box-system" />
      <text x="150" y="23" class="node-text text-system">시스템: 15% 할인가 적용 &amp; 세탁망 증정 DB</text>
    </g>

    <path d="M 240 721 L 240 760" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 9. 완료 화면 -->
    <g transform="translate(90, 760)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">4.4 예약 완료 및 배송 안내 (P-4.4)</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- COLUMN 2: Flow B (승모근 3D 패턴 & 사이즈 매칭) -->
  <!-- =================================================== -->
  <g transform="translate(600, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#9F1239" text-anchor="middle">[Flow B] 승모근 3D 패턴 &amp; 사이즈 매칭</text>

    <!-- 1. 탐색: P-2.0 승모근 이너 핏 -->
    <g transform="translate(90, 60)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">2.0 승모근 이너 핏 (P-2.0)</text>
    </g>

    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />

    <!-- 2. 사용자: 승모근 32% 완화 확인 -->
    <g transform="translate(90, 145)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 승모근 솟음 32% 완화 데이터 검증</text>
    </g>

    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />

    <!-- 3. 모달: 사이즈 매칭 -->
    <g transform="translate(90, 225)">
      <rect width="300" height="46" class="box-modal" />
      <text x="150" y="23" class="node-text text-modal">2.3 정밀 사이즈 가이드 [모달] (P-2.3)</text>
    </g>

    <path d="M 240 271 L 240 310" class="line" marker-end="url(#arr)" />

    <!-- 4. 사용자: 상의 사이즈 선택 -->
    <g transform="translate(90, 310)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 블라우스 치수(44/55/66/77) 선택</text>
    </g>

    <path d="M 240 356 L 240 395" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 5. 얼리버드 예약 폼 모달 -->
    <g transform="translate(75, 395)">
      <rect width="330" height="52" class="box-modal" stroke-width="2.5" />
      <text x="165" y="26" class="node-text text-modal">4.3 얼리버드 예약 폼 [모달] (P-4.3)</text>
    </g>

    <path d="M 240 447 L 240 485" class="line-success" marker-end="url(#arr-success)" />

    <g transform="translate(90, 485)">
      <rect width="300" height="46" class="box-system" />
      <text x="150" y="23" class="node-text text-system">시스템: 30일 안심 시착 예약 접수 완료</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- COLUMN 3: Flow C (100인 눈바디 릴스 & 안심 시착) -->
  <!-- =================================================== -->
  <g transform="translate(1155, 465)">
    <rect width="480" height="1220" class="col-container" />
    <rect width="480" height="42" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5" rx="12" />
    <text x="240" y="26" class="col-header" fill="#831843" text-anchor="middle">[Flow C] 100인 눈바디 릴스 &amp; 안심 시착</text>

    <!-- 1. 탐색: P-3.0 눈바디 릴스 후기 -->
    <g transform="translate(90, 60)">
      <rect width="300" height="50" class="box-screen" />
      <text x="150" y="25" class="node-text text-screen">3.0 눈바디 릴스 후기 (P-3.0)</text>
    </g>

    <path d="M 240 110 L 240 145" class="line" marker-end="url(#arr)" />

    <!-- 2. 사용자: 직장인 릴스 시청 -->
    <g transform="translate(90, 145)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 직장인 100인 출근 룩 릴스 시청</text>
    </g>

    <path d="M 240 191 L 240 225" class="line" marker-end="url(#arr)" />

    <!-- 3. 화면: 패션 케어 가이드 -->
    <g transform="translate(90, 225)">
      <rect width="300" height="46" class="box-screen" />
      <text x="150" y="23" class="node-text text-screen">5.0 패션 케어 가이드 (P-5.0)</text>
    </g>

    <path d="M 240 271 L 240 310" class="line" marker-end="url(#arr)" />

    <!-- 4. 사용자: 30일 무료 반품 확인 -->
    <g transform="translate(90, 310)">
      <rect width="300" height="46" class="box-user" />
      <text x="150" y="23" class="node-text text-user">사용자: 30일 안심 무료 반품 보증 확인</text>
    </g>

    <path d="M 240 356 L 240 395" class="line-accent" marker-end="url(#arr-accent)" />

    <!-- 5. 모달: 예약 접수 -->
    <g transform="translate(75, 395)">
      <rect width="330" height="52" class="box-modal" stroke-width="2.5" />
      <text x="165" y="26" class="node-text text-modal">4.3 얼리버드 예약 폼 [모달] (P-4.3)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. 하단 공통 수렴 및 사후 관리 영역 -->
  <!-- ========================================================================= -->
  <path d="M 285 1685 L 285 1740 L 840 1740" class="line-accent" />
  <path d="M 840 1685 L 840 1740" class="line-accent" />
  <path d="M 1395 1685 L 1395 1740 L 840 1740" class="line-accent" />

  <path d="M 840 1740 L 840 1780" class="line-accent" marker-end="url(#arr-accent)" />

  <g transform="translate(690, 1780)">
    <rect width="300" height="50" class="box-screen" />
    <text x="150" y="25" class="node-text text-screen">6.1 SNS 간편 로그인 [가정] (P-6.1)</text>
  </g>

  <path d="M 840 1830 L 840 1870" class="line-success" marker-end="url(#arr-success)" />

  <g transform="translate(690, 1870)">
    <rect width="300" height="56" class="box-screen" stroke-width="2.5" />
    <text x="150" y="28" class="node-text text-screen" font-size="14">6.2 마이페이지 예약 관리 [가정] (P-6.2)</text>
  </g>

  <path d="M 840 1926 L 840 1965" class="line" marker-end="url(#arr)" />

  <!-- 최종 종료 노드 -->
  <g transform="translate(715, 1965)">
    <rect width="250" height="46" rx="23" class="box-start-end" />
    <text x="125" y="23" class="node-text text-start-end">◎ 종료: 30일 출근 룩 실착 후 결정</text>
  </g>

  <g transform="translate(1300, 1960)">
    <rect width="250" height="50" class="box-exception" />
    <text x="125" y="25" class="node-text text-exception">9.2 시스템 점검 안내 [가정] (P-9.2)</text>
  </g>
</svg>
