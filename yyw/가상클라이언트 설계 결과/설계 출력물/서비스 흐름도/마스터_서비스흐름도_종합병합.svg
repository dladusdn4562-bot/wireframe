<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2400" width="1680" height="2400">
  <rect width="1680" height="2400" fill="#0B0F19"/>
  <text x="840" y="70" fill="#F8FAFC" font-size="32" font-weight="bold" text-anchor="middle">SEUMIM 통합 마스터 서비스 흐름도 (Master User Flow)</text>
  <text x="840" y="110" fill="#38BDF8" font-size="18" text-anchor="middle">ST-01 ~ ST-14 전 14단계 풀 서비스 플로우 &amp; 3대 Happy Path</text>

  <!-- Flow A -->
  <rect x="140" y="160" width="1400" height="190" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="180" y="210" fill="#38BDF8" font-size="22" font-weight="bold">[Flow A] 15개 상품 탐색 ➔ 퀵뷰 ➔ 사이즈 매칭 ➔ 30일 무료 시착 (Primary Path)</text>
  <text x="180" y="255" fill="#F8FAFC" font-size="16">ST-01 메인 랜딩 ➔ ST-02 척추 통계 ➔ ST-03 15개 상품 탭 ➔ ST-04 퀵뷰 ➔ ST-05 사이즈 매칭 ➔ ST-06 시착 모달 ➔ ST-07 배송정보 ➔ ST-08 접수 완료</text>
  <text x="180" y="295" fill="#94A3B8" font-size="14">※ 메인페이지 이탈 없이 15개 상품 카드 100% 탐색 및 100% 무료 반품 확약으로 구매 전환율 극대화</text>

  <!-- Flow B -->
  <rect x="140" y="390" width="1400" height="190" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="180" y="440" fill="#38BDF8" font-size="22" font-weight="bold">[Flow B] 전국 35개 제휴 웰니스 센터 1:1 3D 체형 스캔 4단계 예약 (O2O Path)</text>
  <text x="180" y="485" fill="#F8FAFC" font-size="16">ST-01 메인 ➔ ST-09 센터 탐색 ➔ ST-10 4단계 Wizard 예약 (지점➔일시➔직업환경➔확정) ➔ ST-11 예약 확정 ➔ 알림톡 발송</text>
  <text x="180" y="525" fill="#94A3B8" font-size="14">※ 직업별 작업 환경 사전 분석을 통한 1:1 맞춤형 체형 리셋 처방 및 방문 리텐션 확보</text>

  <!-- Flow C -->
  <rect x="140" y="620" width="1400" height="190" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="180" y="670" fill="#38BDF8" font-size="22" font-weight="bold">[Flow C] AI 바이오 척추 데이터 케어 3개월 무료 라이선스 구독 (Digital Care Path)</text>
  <text x="180" y="715" fill="#F8FAFC" font-size="16">ST-01 메인 ➔ ST-12 AI 데이터 대시보드 시연 ➔ SNS 1-Click 간편 로그인 ➔ 라이선스 활성화 ➔ IoT 센서 연동</text>
  <text x="180" y="755" fill="#94A3B8" font-size="14">※ 작업 중 무소음 AI 햅틱 피드백 및 애플워치 퀵-글랜스 링 UI 연동으로 일상 체형 교정 지원</text>

  <!-- ST-01 ~ ST-14 Grid -->
  <rect x="140" y="850" width="1400" height="1480" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="840" y="900" fill="#F8FAFC" font-size="24" font-weight="bold" text-anchor="middle">ST-01 ~ ST-14 전 14단계 상세 실행 명세 다이어그램</text>

  <rect x="180" y="950" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="988" fill="#38BDF8" font-size="18" font-weight="bold">ST-01</text>
  <text x="320" y="985" fill="#F8FAFC" font-size="16" font-weight="bold">웹사이트 진입 및 메인 랜딩</text>
  <text x="320" y="1012" fill="#94A3B8" font-size="13">15개 상품 프리패칭 & 누적 체험자 카운터 가동 (화면: SCR-01)</text>

  <rect x="180" y="1045" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1083" fill="#38BDF8" font-size="18" font-weight="bold">ST-02</text>
  <text x="320" y="1080" fill="#F8FAFC" font-size="16" font-weight="bold">전문가 척추 통계 리포트 확인</text>
  <text x="320" y="1107" fill="#94A3B8" font-size="13">92.4% 척추 피로도 카운트업 인터랙션 (화면: SCR-01, SCR-02)</text>

  <rect x="180" y="1140" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1178" fill="#38BDF8" font-size="18" font-weight="bold">ST-03</text>
  <text x="320" y="1175" fill="#F8FAFC" font-size="16" font-weight="bold">15개 상품 4대 카테고리 탭 탐색</text>
  <text x="320" y="1202" fill="#94A3B8" font-size="13">4대 탭(시그니처/전문케어/스마트센서/직업교정ACC) 필터링 (화면: SCR-01, SCR-03)</text>

  <rect x="180" y="1235" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1273" fill="#38BDF8" font-size="18" font-weight="bold">ST-04</text>
  <text x="320" y="1270" fill="#F8FAFC" font-size="16" font-weight="bold">퀵뷰 모달 호출 및 스펙 확인</text>
  <text x="320" y="1297" fill="#94A3B8" font-size="13">페이지 이탈 없는 0.1mm 디테일 룩북 & 가격/스펙 표출 (화면: SCR-01, SCR-04)</text>

  <rect x="180" y="1330" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1368" fill="#38BDF8" font-size="18" font-weight="bold">ST-05</text>
  <text x="320" y="1365" fill="#F8FAFC" font-size="16" font-weight="bold">정밀 사이즈 가이드 매칭</text>
  <text x="320" y="1392" fill="#94A3B8" font-size="13">Type 1(Slim) ~ Type 3(Relax) 자동 계산 알고리즘 (화면: SCR-04)</text>

  <rect x="180" y="1425" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1463" fill="#38BDF8" font-size="18" font-weight="bold">ST-06</text>
  <text x="320" y="1460" fill="#F8FAFC" font-size="16" font-weight="bold">30일 무료 시착 모달 로드</text>
  <text x="320" y="1487" fill="#94A3B8" font-size="13">선택 상품 & 권장 사이즈 사전 바인딩 팝업 표출 (화면: SCR-10)</text>

  <rect x="180" y="1520" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1558" fill="#38BDF8" font-size="18" font-weight="bold">ST-07</text>
  <text x="320" y="1555" fill="#F8FAFC" font-size="16" font-weight="bold">배송 정보 및 사전 예약서 작성</text>
  <text x="320" y="1582" fill="#94A3B8" font-size="13">성명, 연락처, 안심 배송지 입력 & 정규식 검증 (화면: SCR-10)</text>

  <rect x="180" y="1615" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1653" fill="#38BDF8" font-size="18" font-weight="bold">ST-08</text>
  <text x="320" y="1650" fill="#F8FAFC" font-size="16" font-weight="bold">30일 무료 시착 접수 완료 [성공]</text>
  <text x="320" y="1677" fill="#94A3B8" font-size="13">주문번호 SEU-2026-XXXX 생성 & 알림톡 발송 (화면: SCR-10, SCR-12)</text>

  <rect x="180" y="1710" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1748" fill="#38BDF8" font-size="18" font-weight="bold">ST-09</text>
  <text x="320" y="1745" fill="#F8FAFC" font-size="16" font-weight="bold">전국 웰니스 센터 지점 탐색</text>
  <text x="320" y="1772" fill="#94A3B8" font-size="13">지도 API 렌더링 & 실시간 잔여 슬롯 조회 (화면: SCR-06)</text>

  <rect x="180" y="1805" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1843" fill="#38BDF8" font-size="18" font-weight="bold">ST-10</text>
  <text x="320" y="1840" fill="#F8FAFC" font-size="16" font-weight="bold">4단계 Wizard 센터 예약</text>
  <text x="320" y="1867" fill="#94A3B8" font-size="13">지점➔일시➔직업환경➔확정 4단계 인터랙션 (화면: SCR-07)</text>

  <rect x="180" y="1900" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="1938" fill="#38BDF8" font-size="18" font-weight="bold">ST-11</text>
  <text x="320" y="1935" fill="#F8FAFC" font-size="16" font-weight="bold">센터 예약 확정 안내</text>
  <text x="320" y="1962" fill="#94A3B8" font-size="13">예약 번호 발급, 약도 안내, 캘린더 연동 (화면: SCR-08)</text>

  <rect x="180" y="1995" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="2033" fill="#38BDF8" font-size="18" font-weight="bold">ST-12</text>
  <text x="320" y="2030" fill="#F8FAFC" font-size="16" font-weight="bold">AI 데이터 케어 구독 활성화</text>
  <text x="320" y="2057" fill="#94A3B8" font-size="13">자세 HUD 시연 ➔ SNS 1-Click 간편 로그인 ➔ 라이선스 키 발급 (화면: SCR-05, SCR-11)</text>

  <rect x="180" y="2090" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="2128" fill="#38BDF8" font-size="18" font-weight="bold">ST-13</text>
  <text x="320" y="2125" fill="#F8FAFC" font-size="16" font-weight="bold">404 Not Found 예외 처리</text>
  <text x="320" y="2152" fill="#94A3B8" font-size="13">유실 링크 접근 시 메인 랜딩 복귀 CTA 제공 (화면: SCR-13)</text>

  <rect x="180" y="2185" width="1320" height="85" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="2223" fill="#38BDF8" font-size="18" font-weight="bold">ST-14</text>
  <text x="320" y="2220" fill="#F8FAFC" font-size="16" font-weight="bold">시스템 정기 점검 예외 처리</text>
  <text x="320" y="2247" fill="#94A3B8" font-size="13">02:00~04:00 점검 안내 및 비상 연락망 표출 (화면: SCR-14)</text>
</svg>