<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 2220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1680" height="2220" fill="url(#bgGrad)"/>

  <!-- Title Area -->
  <text x="840" y="70" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#38BDF8" text-anchor="middle">SEUMIM Executive 서비스 흐름도 (가상클라이언트 60: 글로벌전략컨설턴트)</text>
  <text x="840" y="110" font-family="'Pretendard', sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">15개 브랜드 상품 탭 탐색 / 퀵뷰 모달 / 30일 무료 시착 & VIP 센터 예약 전 14단계 풀 플로우</text>

  <!-- ST-01 Main Entry -->
  <g transform="translate(640, 160)" filter="url(#shadow)">
    <rect width="400" height="90" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="200" y="38" font-family="'Pretendard', sans-serif" font-size="18" font-weight="800" fill="#38BDF8" text-anchor="middle">ST-01 웹사이트 진입 및 랜딩</text>
    <text x="200" y="65" font-family="'Pretendard', sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">0.1mm 수트핏 히어로 + 15개 상품 쇼케이스 로드 (SCR-01)</text>
  </g>

  <!-- Line to ST-02 -->
  <path d="M 840 250 L 840 300" stroke="#38BDF8" stroke-width="2.5" fill="none"/>

  <!-- ST-02 Stats -->
  <g transform="translate(640, 300)" filter="url(#shadow)">
    <rect width="400" height="80" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <text x="200" y="34" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">ST-02 글로벌 직장인 척추 통계 확인</text>
    <text x="200" y="58" font-family="'Pretendard', sans-serif" font-size="12.5" fill="#94A3B8" text-anchor="middle">주 60시간 착석 및 만성 피로 인포그래픽 탐색</text>
  </g>

  <!-- Line to ST-03 -->
  <path d="M 840 380 L 840 430" stroke="#38BDF8" stroke-width="2.5" fill="none"/>

  <!-- ST-03 15 Products Tabs -->
  <g transform="translate(565, 430)" filter="url(#shadow)">
    <rect width="550" height="110" rx="14" fill="#0A192F" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="275" y="38" font-family="'Pretendard', sans-serif" font-size="19" font-weight="900" fill="#38BDF8" text-anchor="middle">★ ST-03 메인 15개 상품 카테고리 탭 탐색</text>
    <text x="275" y="66" font-family="'Pretendard', sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">[전체 15종] / [시그니처 4종] / [집중케어 4종] / [스마트테크 4종] / [트래블 3종]</text>
    <text x="275" y="90" font-family="'Pretendard', sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle">탭 전환 시 비동기 카드 리렌더링 & 뱃지/가격/평점 확인</text>
  </g>

  <!-- Branch Decision -->
  <path d="M 840 540 L 840 600" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
  <g transform="translate(690, 600)">
    <polygon points="150,0 300,60 150,120 0,60" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="150" y="55" font-family="'Pretendard', sans-serif" font-size="14" font-weight="700" fill="#EEF2FF" text-anchor="middle">상품 탐색 방식</text>
    <text x="150" y="75" font-family="'Pretendard', sans-serif" font-size="11" fill="#C7D2FE" text-anchor="middle">선택 분기</text>
  </g>

  <!-- Left: Quick View (ST-04 -> ST-05) -->
  <path d="M 690 660 L 400 660 L 400 730" stroke="#818CF8" stroke-width="2" fill="none"/>
  <g transform="translate(230, 730)" filter="url(#shadow)">
    <rect width="340" height="85" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="170" y="34" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#92400E" text-anchor="middle">ST-04 퀵뷰 모달 호출</text>
    <text x="170" y="58" font-family="'Pretendard', sans-serif" font-size="12" fill="#B45309" text-anchor="middle">메인 이탈 없이 세부 스펙/화보 팝업 표출</text>
  </g>

  <path d="M 400 815 L 400 860" stroke="#D97706" stroke-width="2" fill="none"/>
  <g transform="translate(230, 860)" filter="url(#shadow)">
    <rect width="340" height="85" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="170" y="34" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#92400E" text-anchor="middle">ST-05 맞춤 사이즈 매칭</text>
    <text x="170" y="58" font-family="'Pretendard', sans-serif" font-size="12" fill="#B45309" text-anchor="middle">상의 규격(95/100/105) 자동 계산기 연동 (SCR-04)</text>
  </g>

  <!-- Right: Direct Trial (ST-06) -->
  <path d="M 990 660 L 1280 660 L 1280 730" stroke="#818CF8" stroke-width="2" fill="none"/>
  <g transform="translate(1110, 730)" filter="url(#shadow)">
    <rect width="340" height="85" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="170" y="34" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#92400E" text-anchor="middle">ST-06 30일 시착 신청 모달</text>
    <text x="170" y="58" font-family="'Pretendard', sans-serif" font-size="12" fill="#B45309" text-anchor="middle">15개 상품 중 선택 및 신청서 로드 (SCR-10)</text>
  </g>

  <!-- Convergence to ST-07 & ST-08 -->
  <path d="M 400 945 L 400 1000 L 840 1000" stroke="#D97706" stroke-width="2" fill="none"/>
  <path d="M 1280 815 L 1280 1000 L 840 1000" stroke="#D97706" stroke-width="2" fill="none"/>
  <path d="M 840 1000 L 840 1040" stroke="#D97706" stroke-width="2.5" fill="none"/>

  <g transform="translate(640, 1040)" filter="url(#shadow)">
    <rect width="400" height="90" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="200" y="38" font-family="'Pretendard', sans-serif" font-size="17" font-weight="800" fill="#92400E" text-anchor="middle">ST-07 배송 정보 & 사전 신청서 작성</text>
    <text x="200" y="65" font-family="'Pretendard', sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle">성명, 연락처, 안심 배송지 입력 및 약관 동의</text>
  </g>

  <path d="M 840 1130 L 840 1180" stroke="#10B981" stroke-width="2.5" fill="none"/>

  <g transform="translate(620, 1180)" filter="url(#shadow)">
    <rect width="440" height="95" rx="14" fill="#065F46" stroke="#10B981" stroke-width="2.5"/>
    <text x="220" y="40" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">ST-08 30일 무료 체험 접수 완료 [성공]</text>
    <text x="220" y="68" font-family="'Pretendard', sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">사전 예약 번호 발급, 30일 무료 반품 안내, 알림톡 발송</text>
  </g>

  <!-- Flow 2: O2O Center (ST-09 ~ ST-11) -->
  <g transform="translate(100, 1340)">
    <rect width="1480" height="340" rx="16" fill="#0B132B" stroke="#10B981" stroke-width="2"/>
    <text x="740" y="45" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle">Flow B: 오프라인 VIP 동행센터 1:1 진단 4단계 예약 플로우</text>

    <!-- ST-09 -->
    <g transform="translate(60, 90)" filter="url(#shadow)">
      <rect width="380" height="100" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="190" y="38" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">ST-09 VIP 동행센터 검색 (SCR-06)</text>
      <text x="190" y="65" font-family="'Pretendard', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">테헤란로 / 여의도 거점 지점 지도 탐색</text>
    </g>

    <path d="M 440 140 L 520 140" stroke="#10B981" stroke-width="2.5" fill="none"/>

    <!-- ST-10 -->
    <g transform="translate(520, 90)" filter="url(#shadow)">
      <rect width="440" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
      <text x="220" y="38" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#92400E" text-anchor="middle">ST-10 VIP 4단계 Wizard 예약 (SCR-07)</text>
      <text x="220" y="65" font-family="'Pretendard', sans-serif" font-size="12" fill="#B45309" text-anchor="middle">Step 1(지점) ➔ Step 2(일시) ➔ Step 3(정보) ➔ 확정</text>
    </g>

    <path d="M 960 140 L 1040 140" stroke="#10B981" stroke-width="2.5" fill="none"/>

    <!-- ST-11 -->
    <g transform="translate(1040, 90)" filter="url(#shadow)">
      <rect width="380" height="100" rx="10" fill="#065F46" stroke="#10B981" stroke-width="2.5"/>
      <text x="190" y="38" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">ST-11 VIP 예약 확정 안내 (SCR-08)</text>
      <text x="190" y="65" font-family="'Pretendard', sans-serif" font-size="12" fill="#D1FAE5" text-anchor="middle">예약 번호 확인, 방문 약도 및 SMS 발송</text>
    </g>

    <text x="740" y="260" font-family="'Pretendard', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">※ 예약 확정 후 마이페이지(SCR-12)에서 1-Click 일정 변경 및 취소 지원</text>
  </g>

  <!-- Flow 3 & Exceptions (ST-12, ST-13, ST-14) -->
  <g transform="translate(100, 1720)">
    <rect width="1480" height="420" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="740" y="45" font-family="'Pretendard', sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle">Flow C: AI 데이터 케어 구독 & 5대 분기/예외 핸들링 체계</text>

    <!-- ST-12 AI Care -->
    <g transform="translate(80, 90)" filter="url(#shadow)">
      <rect width="400" height="110" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/>
      <text x="200" y="40" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#EEF2FF" text-anchor="middle">ST-12 AI 데이터 케어 3개월 구독</text>
      <text x="200" y="68" font-family="'Pretendard', sans-serif" font-size="12" fill="#C7D2FE" text-anchor="middle">시차 릴렉스 대시보드 시연 ➔ 1-Click 간편 로그인</text>
      <text x="200" y="90" font-family="'Pretendard', sans-serif" font-size="11" fill="#818CF8" text-anchor="middle">SCR-05 ➔ SCR-11 ➔ SCR-12 마이페이지</text>
    </g>

    <!-- ST-13 404 Exception -->
    <g transform="translate(540, 90)" filter="url(#shadow)">
      <rect width="400" height="110" rx="10" fill="#450A0A" stroke="#F87171" stroke-width="1.5"/>
      <text x="200" y="40" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#FEE2E2" text-anchor="middle">ST-13 404 Not Found 예외 (SCR-13)</text>
      <text x="200" y="68" font-family="'Pretendard', sans-serif" font-size="12" fill="#FCA5A5" text-anchor="middle">잘못된 URL 입력 시 안내 및 [메인으로 이동] CTA</text>
      <text x="200" y="90" font-family="'Pretendard', sans-serif" font-size="11" fill="#F87171" text-anchor="middle">100% 정상 복구 유도</text>
    </g>

    <!-- ST-14 Maintenance Exception -->
    <g transform="translate(1000, 90)" filter="url(#shadow)">
      <rect width="400" height="110" rx="10" fill="#450A0A" stroke="#F87171" stroke-width="1.5"/>
      <text x="200" y="40" font-family="'Pretendard', sans-serif" font-size="16" font-weight="700" fill="#FEE2E2" text-anchor="middle">ST-14 정기 점검 안내 예외 (SCR-14)</text>
      <text x="200" y="68" font-family="'Pretendard', sans-serif" font-size="12" fill="#FCA5A5" text-anchor="middle">서버 점검 시간대 안내 및 VIP 긴급 고객센터</text>
      <text x="200" y="90" font-family="'Pretendard', sans-serif" font-size="11" fill="#F87171" text-anchor="middle">새로고침 기능 제공</text>
    </g>

    <text x="740" y="270" font-family="'Pretendard', sans-serif" font-size="13.5" fill="#E2E8F0" text-anchor="middle">★ ST-01 ~ ST-14 전 단계 정의표 및 3대 Happy Path가 100% 개별 노드로 시각화되었습니다.</text>
  </g>
</svg>
